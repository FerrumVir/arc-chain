# cargo-deny configuration.
#
# Run locally with `make audit`; CI and tagged releases use the checksummed
# `scripts/ci/run-cargo-deny.sh` wrapper against each tracked lockfile. Advisory,
# license, source, and yanked-crate failures are release-blocking.

[graph]
all-features = false

# ----------------------------------------------------------- advisories ----
[advisories]
version = 2
# Soundness notices apply to the complete shipped graph. The cargo-deny v0.20
# default checks only direct workspace dependencies, which would miss unsafe
# transitive runtime crates such as Wasmer's memory-mapping implementation.
unsound = "all"
# Yanked crates are denied rather than warned: a yanked dependency in a
# workspace that ships signed binaries to third-party node operators via
# `curl | bash` is a release-blocking fact, not a note.
yanked = "deny"

# POLICY FOR THIS LIST — no exceptions, including "just for now":
#   Every entry MUST carry a comment with (a) the date it was added, (b) who
#   accepted the risk, (c) why it is not exploitable here, and (d) the
#   condition under which it gets removed. An entry with no expiry condition
#   is a permanent silent vulnerability, which is strictly worse than no
#   scanner at all. Re-review the whole list at every release.
#
# Format:
#   "RUSTSEC-0000-0000", # 2026-08-17 <owner>: <why not exploitable>; remove when <condition>
ignore = [
    # 2026-08-27 ARC release engineering: paste is a build-time proc macro
    # reached only through pinned Wasmer/Candle/Revm dependencies; this
    # advisory reports maintenance status, not a vulnerability. Remove when
    # all three upstream stacks migrate to pastey or eliminate paste, no later
    # than the v0.9.0 dependency refresh.
    "RUSTSEC-2024-0436",
    # 2026-08-27 ARC release engineering: preserving verification of historic
    # Falcon-512 transactions requires the existing wire-compatible PQClean
    # implementation; these advisories report upstream archival and no known
    # vulnerability. Remove all three together once the fn-dsa migration has
    # golden vectors for legacy verification and new signing, no later than
    # v0.9.0.
    "RUSTSEC-2026-0162",
    "RUSTSEC-2026-0163",
    "RUSTSEC-2026-0165",
    # 2026-08-27 ARC release engineering: Tauri 2.11's supported Linux
    # WebKit/tray runtime still requires the archived gtk-rs GTK3 bindings;
    # these advisories report maintenance status, not known vulnerabilities,
    # and cargo-deny reports no safe upgrade. Remove each entry as soon as
    # Tauri/Wry migrate the Linux runtime off GTK3, no later than the v0.9.0
    # desktop dependency review.
    "RUSTSEC-2024-0411", # gdkwayland-sys; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0412", # gdk; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0413", # atk; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0414", # gdkx11-sys; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0415", # gtk; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0416", # atk-sys; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0417", # gdkx11; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0418", # gdk-sys; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0419", # gtk3-macros; remove with Tauri's GTK3 runtime
    "RUSTSEC-2024-0420", # gtk-sys; remove with Tauri's GTK3 runtime
    # 2026-08-27 ARC release engineering: proc-macro-error is build-time-only
    # through the same Tauri GTK3 macro stack; this is an unmaintained notice,
    # not a vulnerability, and has no safe upgrade. Remove with the GTK3 stack
    # or earlier if glib-macros migrates, no later than v0.9.0.
    "RUSTSEC-2024-0370",
    # 2026-08-27 ARC release engineering: Tauri 2.11's urlpattern dependency
    # retains these archived rust-unic crates. The notices contain no known
    # vulnerability and report no safe upgrade. Remove each when Tauri updates
    # urlpattern to ICU/unicode-ident, no later than the v0.9.0 dependency
    # review.
    "RUSTSEC-2025-0075", # unic-char-range; remove with Tauri urlpattern
    "RUSTSEC-2025-0080", # unic-common; remove with Tauri urlpattern
    "RUSTSEC-2025-0081", # unic-char-property; remove with Tauri urlpattern
    "RUSTSEC-2025-0098", # unic-ucd-version; remove with Tauri urlpattern
    "RUSTSEC-2025-0100", # unic-ucd-ident; remove with Tauri urlpattern
    # 2026-10-18 ARC release engineering, risk accepted by the repository
    # owner (FerrumVir) on 2026-10-18: these zip advisories cover archive extraction only
    # (`ZipArchive::extract`, `ZipStreamReader::extract`: SUID/SGID bits and
    # symlinks that escape the destination). candle-core 0.8.4 opens archives
    # and reads or writes entries (npy.rs, pickle.rs) but never extracts.
    # tauri-plugin-updater 2.10.1 extracts only on Windows, only a zip-format
    # update, and only after `download()` has verified the update's minisign
    # signature. ARC publishes signed `-setup.exe` updater artifacts
    # (`createUpdaterArtifacts = true`), never zips, so an exploit needs the
    # release signing key. No release accepts the patched zip >= 9.0.0:
    # candle-core 0.11.0 requires zip ^8.6 and tauri-plugin-updater 2.14.0
    # requires zip ^4. Remove all three once both crates accept zip >= 9 and
    # the lockfiles move to it, no later than the v0.9.0 dependency review.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # 2026-10-18 ARC release engineering, risk accepted by the repository
    # owner (FerrumVir) on 2026-10-18: ruzstd 0.5.0 can be driven out of memory by a crafted zstd
    # input. It is reached only through object 0.32's default `compression`
    # feature in the vendored wasmer-compiler 6.1.0, which only writes object
    # files and never reads or decompresses one; no ARC crate reads object
    # files. The fix (ruzstd >= 0.9.1) needs object >= 0.40, and wasmer-compiler
    # 6.x requires object ^0.32. Remove when the vendored wasmer-compiler moves
    # to object >= 0.40 or drops object's default features, no later than the
    # v0.9.0 dependency review.
    "RUSTSEC-2026-0344",
    # 2026-10-18 ARC release engineering, risk accepted by the repository
    # owner (FerrumVir) on 2026-10-18: these
    # notices report that upstream merged the standalone zvariant,
    # zvariant_derive and zbus_names crates into zbus 6.0.0. They are
    # maintenance status, not known vulnerabilities. The desktop reaches them
    # only through tauri-plugin-opener 2.5.4, which uses zbus 5.19 on Linux
    # and the BSDs only, and no release of tauri-plugin-opener (2.7.2,
    # 3.0.0-alpha.3) accepts zbus 6. Remove each entry when
    # tauri-plugin-opener moves to zbus >= 6 and the desktop lockfile
    # follows, no later than the v0.9.0 desktop dependency review.
    "RUSTSEC-2026-0370", # zvariant; remove with tauri-plugin-opener zbus 6
    "RUSTSEC-2026-0371", # zbus_names; remove with tauri-plugin-opener zbus 6
    "RUSTSEC-2026-0372", # zvariant_derive; remove with tauri-plugin-opener zbus 6
    # 2026-10-21 ARC release engineering: the lockfiles move webpki-roots and
    # webpki-root-certs to the patched 1.0.10 and rustls-webpki to 0.103.16
    # (RUSTSEC-2026-0381, -0382, -0383). webpki-roots 0.26.11 has no patched
    # 0.26 release, but it ships no roots of its own: its whole library is
    # `pub use parent::TLS_SERVER_ROOTS;` with `parent` = webpki-roots "1",
    # locked at 1.0.10, so it serves the patched roots. cargo-deny matches it
    # by version only. It is reached through ureq 2.12.1, from
    # arc-legacy-bridge and arc-olm only, never arc-node or the desktop.
    # Remove when both move to ureq 3 (webpki-roots 1.x directly), no later
    # than the v0.9.0 dependency review.
    "RUSTSEC-2026-0381",
    # 2026-10-24 ARC release engineering, risk accepted by ARC's CEO on
    # 2026-10-24: crypto-bigint 0.5.5 timing variability (subtraction, zero
    # counting, division, Montgomery multiplication, `UintRef` equality,
    # `BoxedMontyForm::invert`). The only secret-operand use in these graphs
    # is secp256k1 ECDSA through k256 0.13.4: its scalar add/negate/is_high/
    # from_repr and the final reduction of every scalar multiply call
    # `Uint::add_mod`/`neg_mod`/`ct_gt`/`ct_lt`/`sbb`, which bottom out in
    # 0.5.5's wide-word `Limb::sbb`. That path is reached only by user-held
    # keys handled explicitly in arc-cli: `arc keygen --scheme secp256k1`
    # generates one, and `load_keyfile` (behind `arc transfer` and `arc
    # keygen --verify`) parses it and signs one fixed validation challenge
    # per invocation; no shipped code signs a transaction with a secp256k1
    # key (`arc transfer` submits unsigned to /tx/submit) and the node only
    # recovers public keys from externally signed secp256k1 transactions.
    # No long-lived service key is secp256k1: validator identities are
    # Ed25519 only (arc-node validator_identity.rs rejects any other scheme),
    # every node-side signer uses that key, the RPC has no sign-on-request
    # method (`eth_accounts` is empty), and the desktop, relayer and
    # arc-channel sign with Ed25519. Every other 0.5.5 copy is verify-only or
    # unreached: revm-precompile and alloy-primitives recover public keys;
    # alloy-eip7702 signs only under cfg(test/arbitrary); starknet-crypto and
    # starknet-ff serve stwo's Poseidon252 channel, which ARC never
    # instantiates (Blake2s only); the desktop's p256/p384/p521 come from
    # ssh-key 0.6.7 (verify-only, `ssh-ed25519` keys only) and sit in that
    # lockfile only through weak features (rust-lang/cargo#10801). k256 never
    # calls 0.5.5's Montgomery, division or zero-counting code, and
    # `UintRef`/`BoxedMontyForm` do not exist in 0.5.5. Upstream's
    # subtraction fix (crypto-bigint#1358) repairs a `borrowing_sub`
    # formulation that #1029 added on 2025-12-10, two years after 0.5.5
    # (2023-11-18); 0.5.5's `sbb` has not been shown to branch, nor verified
    # not to. Remove when k256/ecdsa/elliptic-curve move to 0.14/0.17/0.14
    # (crypto-bigint >= 0.7.6) and the remaining 0.5.5 copies are gone or
    # re-scoped: no alloy-primitives (<= 1.7.3), alloy-eip7702 (<= 0.6.3) or
    # revm-precompile (<= 43.0.3) release accepts k256 0.14 yet, and every
    # starknet-crypto/starknet-ff release pins crypto-bigint ^0.5, so the
    # vendored stwo must drop or feature-gate Poseidon252. No later than
    # v0.9.0.
    "RUSTSEC-2026-0387",
]

# ------------------------------------------------------------- licenses ----
[licenses]
version = 2
# Shared allowlist for the independently locked workspace, desktop, and updater
# verifier graphs. The release workflow audits all three.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    # Weak, file-level copyleft. Acceptable while these crates are consumed
    # unmodified; if anyone vendors and patches an MPL crate, the modified
    # files must be published. Flagged here so that is a decision and not an
    # accident.
    "MPL-2.0",
    # Public-domain-equivalent and highly permissive licenses already present
    # in the locked revm/wgpu/wasmer dependency graph. These are policy
    # approvals, not advisory exceptions.
    "CC0-1.0",
    "0BSD",
    # Boost Software License 1.0 (not the source-available BUSL license) is a
    # permissive OSI-approved license used by the locked xxhash-rust crate.
    "BSL-1.0",
    # The workspace's own crates (Cargo.toml [workspace.package] license).
    "BUSL-1.1",
]
confidence-threshold = 0.9

# Per-crate exceptions go here rather than widening `allow` above, so an
# unusual licence stays scoped to the one crate that needs it.
# Format:
#   { allow = ["<SPDX>"], crate = "<name>" },  # <date> <owner>: <rationale>
exceptions = []

# ----------------------------------------------------------------- bans ----
[bans]
# Starts at "warn", not "deny". A 16-crate workspace pulling revm, wasmer,
# wgpu and quinn will have a substantial duplicate-version tail; denying on
# day one would mean an immediate allowlist war and the check being disabled.
# Ratchet: fix the duplicates that matter (anything in the crypto or wire
# path), then consider "deny" with a curated `skip` list.
multiple-versions = "warn"
# Path dependencies inside the workspace use wildcards legitimately.
wildcards = "allow"
deny = []
skip = []

# -------------------------------------------------------------- sources ----
[sources]
unknown-registry = "deny"
# Shipped graphs must resolve only from the registry or reviewed local paths.
# Stwo is vendored; the optional ICICLE feature is not release-enabled and must
# be vendored or registry-published before it can enter a shipped graph. A git
# dependency therefore fails rather than relying on a mutable tag or host.
unknown-git = "deny"
allow-git = []
