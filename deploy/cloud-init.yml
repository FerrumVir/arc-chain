#cloud-config
# RETIRED DEPLOYMENT TEMPLATE
#
# The v2 Hetzner bootstrap downloaded a moving, unchecksummed binary and then
# enabled a deterministic staked validator configuration. That is unsafe while
# the public fleet is forked and no approved v3 deployment manifest exists.
# This template is intentionally inert: it installs no packages, downloads no
# artifacts, creates no validator identity, changes no firewall, and enables no
# service. deploy/setup-testnet.sh also exits before contacting a cloud API.

final_message: >-
  ARC legacy cloud-init retired; no ARC software, identity, or service was installed.
