[workspace]
resolver = "2"
exclude = ["desktop/src-tauri", "vendor/stwo"]
members = [
    "vendor/wasmer-derive",
    "crates/arc-bincode",
    "crates/arc-crypto",
    "crates/arc-types",
    "crates/arc-state",
    "crates/arc-vm",
    "crates/arc-mempool",
    "crates/arc-node",
    "crates/arc-gpu",
    "crates/arc-bench",
    "crates/arc-consensus",
    "crates/arc-assign",
    "crates/arc-net",
    "crates/arc-cli",
    "crates/arc-legacy-bridge",
    "crates/arc-channel",
    "crates/arc-inference",
    "crates/arc-olm",
    "agents",
    "relayer",
]

[workspace.package]
version = "0.8.27"
edition = "2024"
license = "BUSL-1.1"
authors = ["FerrumVir"]
repository = "https://github.com/FerrumVir/arc-chain"

[workspace.dependencies]
blake3 = { version = "1.5", features = ["rayon"] }
curve25519-dalek = { version = "4.1", features = ["digest", "rand_core"] }
ed25519-dalek = { version = "2.1", features = ["batch", "rand_core"] }
k256 = { version = "0.13", features = ["ecdsa"] }
fips204 = "0.4"
pqcrypto-falcon = { version = "0.4", features = ["std"] }
pqcrypto-traits = "0.3"
sha2 = "0.10"
sha3 = "0.10"
blst = { version = "0.3", features = ["portable"] }
stwo = { path = "vendor/stwo/stwo", default-features = false, features = ["prover"] }
stwo-constraint-framework = { path = "vendor/stwo/constraint-framework", default-features = false, features = ["prover"] }
icicle-runtime = { git = "https://github.com/ingonyama-zk/icicle.git", rev = "cb1cdcb37c7a10f1b19e29d28be4f6d39ac68f06" }
icicle-core = { git = "https://github.com/ingonyama-zk/icicle.git", rev = "cb1cdcb37c7a10f1b19e29d28be4f6d39ac68f06" }
icicle-m31 = { git = "https://github.com/ingonyama-zk/icicle.git", rev = "cb1cdcb37c7a10f1b19e29d28be4f6d39ac68f06" }
icicle-hash = { git = "https://github.com/ingonyama-zk/icicle.git", rev = "cb1cdcb37c7a10f1b19e29d28be4f6d39ac68f06" }
num-traits = "0.2"
rand = "0.8"
rand_core = "0.6"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = { package = "arc-bincode", path = "crates/arc-bincode" }

tokio = { version = "1.0", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
quinn = "0.11"
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
webpki = { package = "rustls-webpki", version = "0.103" }

wasmer = "6.0"

revm = { version = "19", default-features = false, features = ["std"] }

wgpu = "25.0"

rayon = "1.10"
crossbeam = "0.8"
dashmap = "6.1"

crc32fast = "1.4"
lz4_flex = "0.11"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0"
zeroize = { version = "1.8", features = ["derive"] }
anyhow = "1.0"

criterion = { version = "0.5", features = ["html_reports"] }

proptest = "1"

toml = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
parking_lot = "0.12"
bytes = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }

[patch.crates-io]
wasmer-derive = { path = "vendor/wasmer-derive" }
shared-buffer = { path = "vendor/shared-buffer" }
wasmer-compiler = { path = "vendor/wasmer-compiler" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }

await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
mem_forget = "deny"
float_cmp = "warn"
lossy_float_literal = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"

unwrap_used = "allow"
expect_used = "allow"
arithmetic_side_effects = "allow"
indexing_slicing = "allow"
print_stdout = "allow"
print_stderr = "allow"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "warn"
