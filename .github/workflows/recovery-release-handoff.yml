name: Recovery release handoff

on:
  workflow_dispatch:
    inputs:
      handoff_commit_sha:
        description: Exact derived handoff commit whose sole parent is current main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: recovery-release-handoff-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-and-upload:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      artifact-digest: ${{ format('sha256:{0}', steps.upload.outputs.artifact-digest) }}
      handoff-commit-sha: ${{ steps.select.outputs.handoff_commit_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch and prove the exact-parent compact handoff commit
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_HANDOFF_COMMIT: ${{ inputs.handoff_commit_sha }}
        run: |
          set -Eeuo pipefail
          [[ "$REQUESTED_HANDOFF_COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::handoff_commit_sha must be one full lowercase Git SHA."
            exit 1
          }
          [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]
          [ "$GITHUB_REF" = refs/heads/main ]
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
          LIVE_MAIN_SHA="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$LIVE_MAIN_SHA" = "$GITHUB_SHA" ] || {
            echo "::error::Producer must run at the current exact main commit."
            exit 1
          }
          HANDOFF_REF="refs/arc-recovery-handoffs/$GITHUB_SHA"
          git -c protocol.version=2 fetch \
            --no-tags \
            --no-write-fetch-head \
            origin \
            "+$HANDOFF_REF:refs/remotes/origin/arc-recovery-handoffs/$GITHUB_SHA"
          FETCHED_HANDOFF="$(git rev-parse "refs/remotes/origin/arc-recovery-handoffs/$GITHUB_SHA^{commit}")"
          [ "$FETCHED_HANDOFF" = "$REQUESTED_HANDOFF_COMMIT" ] || {
            echo "::error::Requested handoff commit is not the exact commit at the content-addressed handoff ref."
            exit 1
          }
          echo "handoff_commit_sha=$FETCHED_HANDOFF" >> "$GITHUB_OUTPUT"

      - name: Validate and materialize the exact parent, tree, modes, and paths
        id: materialize
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/release/validate-cutover-handoff-commit.py \
            --repository-root . \
            --handoff-commit "${{ steps.select.outputs.handoff_commit_sha }}" \
            --main-commit "$GITHUB_SHA" \
            --output-dir derived-cutover-handoff
          TAG="$(jq -er '.release_tag' derived-cutover-handoff/arc-recovery-checkpoint-descriptor.json)"
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Build the exact-main compiled descriptor verifier
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "false"
        run: cargo build --locked --release -p arc-node --bin arc-node

      - name: Independently verify compact semantics and 5-of-6 certificate
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/release/validate-cutover-derived-assets.py \
            --input-dir derived-cutover-handoff \
            --verifier-binary target/release/arc-node \
            --genesis genesis.toml \
            --repository "$GITHUB_REPOSITORY" \
            --tag "${{ steps.materialize.outputs.tag }}" \
            --commit "$GITHUB_SHA"

      - name: Upload the exact compact recovery handoff
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: arc-recovery-release-handoff-${{ github.sha }}
          path: derived-cutover-handoff/*
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          overwrite: false
          retention-days: 90

      - name: Record the immutable artifact selection tuple
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          set -Eeuo pipefail
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$ARTIFACT_DIGEST" =~ ^[0-9a-f]{64}$ ]]
          artifact="$RUNNER_TEMP/recovery-handoff-artifact.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > "$artifact"
          jq -e \
            --argjson id "$ARTIFACT_ID" \
            --arg name "arc-recovery-release-handoff-$GITHUB_SHA" \
            --arg digest "sha256:$ARTIFACT_DIGEST" \
            --argjson run_id "$GITHUB_RUN_ID" \
            '.id == $id and .name == $name and .digest == $digest
             and .expired == false and .workflow_run.id == $run_id
             and (.size_in_bytes | type == "number" and . > 0 and . <= 33554432)' \
            "$artifact" >/dev/null
          {
            echo "### Compact ARC recovery handoff"
            echo
            echo "- main commit: \`$GITHUB_SHA\`"
            echo "- derived commit: \`${{ steps.select.outputs.handoff_commit_sha }}\`"
            echo "- artifact ID: \`$ARTIFACT_ID\`"
            echo "- artifact digest: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
