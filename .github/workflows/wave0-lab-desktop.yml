name: Wave 0 lab - desktop updater isolation (Linux, Windows, macOS in parallel, throwaway branch)

# THROWAWAY BRANCH ONLY. This workflow exists on `wave0-v0712-desktop-lab` and is never merged: main stays untouched.
# It changes no product code and no existing workflow, publishes no release, creates no tag, uses no environment,
# no secret and no deployment. The only token is the job token, read-only (contents, actions).
#
# Question (ARC-83 audit item 4): with the legacy-bridge launcher release v0.7.12 as GitHub "Latest" (five launchers and
# SHA256SUMS, NO latest.json), does the RELEASED v0.7.11 desktop app's updater path find no update, fetch no v0.8 payload,
# install nothing and leave no new files?
#
# How: on each runner the job installs the released v0.7.11 app (digest-checked against the release), generates a per-run
# throwaway CA that exists only inside the runner (lib/ca.py; the private keys are never uploaded), trusts it in the
# runner's trust store, maps the GitHub names to loopback in the hosts file, and runs a recording HTTPS server that plays
# github.com (lib/mitm_server.py). Every request and every file write is recorded. The app is also kept away from every
# ARC address (lib/live_block.py). The updater plugin validates TLS against the operating system trust store, so this
# interception covers ITS check/download/install path; the app's own banner (check_for_update) and ensure_binary use
# bundled webpki roots, are not interceptable, and are covered by citations plus the Stage A replica (see
# wave0-lab-desktop/config.json interception_scope).
#
# The four operating-system jobs run IN PARALLEL (no job waits for another); only `guard` precedes them and `summary`
# follows. Everything operating-system specific (packages, trust store, hosts file, firewall, app install, trigger) is
# done by wave0-lab-desktop/os_<os>.py. mode "probe" (config) only records what each runner can do; mode "full" runs the
# isolation cases. All third-party actions are pinned to the SHAs the repository's own workflows already use.
on:
  push:
    branches: [wave0-v0712-desktop-lab]

permissions:
  contents: read
  actions: read

jobs:
  guard:
    name: desktop lab tree is base plus lab files only; configuration; offline self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      mode: ${{ steps.config.outputs.mode }}
      linux: ${{ steps.config.outputs.linux }}
      windows: ${{ steps.config.outputs.windows }}
      macos_arm64: ${{ steps.config.outputs.macos_arm64 }}
      macos_intel: ${{ steps.config.outputs.macos_intel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the lab tree to the base commit's tree plus added desktop lab files only
        run: bash wave0-lab-desktop/guard.sh wave0-lab-desktop/config.json

      - name: Validate the desktop lab configuration
        id: config
        run: python3 wave0-lab-desktop/check_config.py --config wave0-lab-desktop/config.json --github-output "$GITHUB_OUTPUT"

      - name: Offline self-tests (no network, no app)
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -B -m unittest discover -s wave0-lab-desktop/tests -p 'test_*.py' -v
          shellcheck -S warning wave0-lab-desktop/*.sh

  desktop-linux:
    name: "Desktop updater isolation: Linux (ubuntu-24.04)"
    needs: guard
    if: needs.guard.outputs.linux == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ github.workspace }}/evidence/linux
      MODE: ${{ needs.guard.outputs.mode }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the evidence directory (a crash before the first record still uploads something)
        run: |
          mkdir -p "$EVIDENCE"
          printf '{"schema": "arc.legacy-bridge.wave0-lab.desktop-job.v1", "mode": "%s", "run_id": "%s", "sha": "%s", "runner_os": "%s", "runner_arch": "%s", "image_os": "%s", "image_version": "%s"}\n' \
            "$MODE" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}" > "$EVIDENCE/job.json"

      - name: Build prerequisites of the native updater check (webkit2gtk development files)
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set -Eeuo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libwebkit2gtk-4.1-dev

      - name: Build the native tauri-plugin-updater check (the plugin version of the released app, from a locked dependency set)
        if: ${{ env.MODE == 'full' }}
        continue-on-error: true
        timeout-minutes: 40
        run: cargo build --release --locked --manifest-path wave0-lab-desktop/native-updater-check/Cargo.toml

      - name: "Replica harness (supporting evidence only, a fake GitHub on loopback, no hosts or trust-store change)"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.11:refs/tags/v0.7.11
          native=wave0-lab-desktop/native-updater-check/target/release/native-updater-check
          if [ -f "$native.exe" ]; then native="$native.exe"; fi
          args=(--repo . --evidence "$EVIDENCE/harness" --label linux --live-observation wave0-lab-desktop/live-observation-flip-window.json)
          if [ -f "$native" ]; then args+=(--native-check "$native"); fi
          python3 -u wave0-lab-desktop/desktop_updater_check.py run "${args[@]}"

      - name: Desktop updater isolation on Linux
        run: |
          set -Eeuo pipefail
          case "$MODE" in probe) command=probe ;; full) command=run ;; *) echo "unknown mode $MODE" >&2; exit 2 ;; esac
          python3 -u wave0-lab-desktop/os_linux.py "$command" --evidence "$EVIDENCE"

      - name: Refuse to upload any private key material
        id: keys
        if: always()
        run: python3 wave0-lab-desktop/lib/ca.py scan --root "$EVIDENCE"

      - name: Keep the evidence
        if: always() && steps.keys.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-evidence-linux
          path: evidence/linux/
          if-no-files-found: error
          retention-days: 90

  desktop-windows:
    name: "Desktop updater isolation: Windows (windows-latest)"
    needs: guard
    if: needs.guard.outputs.windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ github.workspace }}/evidence/windows
      MODE: ${{ needs.guard.outputs.mode }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the evidence directory (a crash before the first record still uploads something)
        run: |
          mkdir -p "$EVIDENCE"
          printf '{"schema": "arc.legacy-bridge.wave0-lab.desktop-job.v1", "mode": "%s", "run_id": "%s", "sha": "%s", "runner_os": "%s", "runner_arch": "%s", "image_os": "%s", "image_version": "%s"}\n' \
            "$MODE" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}" > "$EVIDENCE/job.json"

      - name: Build the native tauri-plugin-updater check (the plugin version of the released app, from a locked dependency set)
        if: ${{ env.MODE == 'full' }}
        continue-on-error: true
        timeout-minutes: 40
        run: cargo build --release --locked --manifest-path wave0-lab-desktop/native-updater-check/Cargo.toml

      - name: "Replica harness (supporting evidence only, a fake GitHub on loopback, no hosts or trust-store change)"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.11:refs/tags/v0.7.11
          native=wave0-lab-desktop/native-updater-check/target/release/native-updater-check
          if [ -f "$native.exe" ]; then native="$native.exe"; fi
          args=(--repo . --evidence "$EVIDENCE/harness" --label windows --live-observation wave0-lab-desktop/live-observation-flip-window.json)
          if [ -f "$native" ]; then args+=(--native-check "$native"); fi
          python -u wave0-lab-desktop/desktop_updater_check.py run "${args[@]}"

      - name: Desktop updater isolation on Windows
        run: |
          set -Eeuo pipefail
          case "$MODE" in probe) command=probe ;; full) command=run ;; *) echo "unknown mode $MODE" >&2; exit 2 ;; esac
          python -u wave0-lab-desktop/os_windows.py "$command" --evidence "$EVIDENCE"

      - name: Refuse to upload any private key material
        id: keys
        if: always()
        run: python wave0-lab-desktop/lib/ca.py scan --root "$EVIDENCE"

      - name: Keep the evidence
        if: always() && steps.keys.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-evidence-windows
          path: evidence/windows/
          if-no-files-found: error
          retention-days: 90

  desktop-macos-arm64:
    name: "Desktop updater isolation: macOS arm64 (macos-15)"
    needs: guard
    if: needs.guard.outputs.macos_arm64 == 'true'
    runs-on: macos-15
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ github.workspace }}/evidence/macos-arm64
      MODE: ${{ needs.guard.outputs.mode }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the evidence directory (a crash before the first record still uploads something)
        run: |
          mkdir -p "$EVIDENCE"
          printf '{"schema": "arc.legacy-bridge.wave0-lab.desktop-job.v1", "mode": "%s", "run_id": "%s", "sha": "%s", "runner_os": "%s", "runner_arch": "%s", "image_os": "%s", "image_version": "%s"}\n' \
            "$MODE" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}" > "$EVIDENCE/job.json"

      - name: Build the native tauri-plugin-updater check (the plugin version of the released app, from a locked dependency set)
        if: ${{ env.MODE == 'full' }}
        continue-on-error: true
        timeout-minutes: 40
        run: cargo build --release --locked --manifest-path wave0-lab-desktop/native-updater-check/Cargo.toml

      - name: "Replica harness (supporting evidence only, a fake GitHub on loopback, no hosts or trust-store change)"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.11:refs/tags/v0.7.11
          native=wave0-lab-desktop/native-updater-check/target/release/native-updater-check
          if [ -f "$native.exe" ]; then native="$native.exe"; fi
          args=(--repo . --evidence "$EVIDENCE/harness" --label macos --live-observation wave0-lab-desktop/live-observation-flip-window.json)
          if [ -f "$native" ]; then args+=(--native-check "$native"); fi
          python3 -u wave0-lab-desktop/desktop_updater_check.py run "${args[@]}"

      - name: Desktop updater isolation on macOS arm64
        run: |
          set -Eeuo pipefail
          case "$MODE" in probe) command=probe ;; full) command=run ;; *) echo "unknown mode $MODE" >&2; exit 2 ;; esac
          python3 -u wave0-lab-desktop/os_macos.py "$command" --evidence "$EVIDENCE" --arch arm64

      - name: Refuse to upload any private key material
        id: keys
        if: always()
        run: python3 wave0-lab-desktop/lib/ca.py scan --root "$EVIDENCE"

      - name: Keep the evidence
        if: always() && steps.keys.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-evidence-macos-arm64
          path: evidence/macos-arm64/
          if-no-files-found: error
          retention-days: 90

  desktop-macos-intel:
    name: "Desktop updater isolation: macOS x86_64 (macos-15-intel, optional)"
    needs: guard
    if: needs.guard.outputs.macos_intel == 'true'
    runs-on: macos-15-intel
    continue-on-error: true
    timeout-minutes: 75
    env:
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: ${{ github.workspace }}/evidence/macos-intel
      MODE: ${{ needs.guard.outputs.mode }}
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the evidence directory (a crash before the first record still uploads something)
        run: |
          mkdir -p "$EVIDENCE"
          printf '{"schema": "arc.legacy-bridge.wave0-lab.desktop-job.v1", "mode": "%s", "run_id": "%s", "sha": "%s", "runner_os": "%s", "runner_arch": "%s", "image_os": "%s", "image_version": "%s"}\n' \
            "$MODE" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_OS" "$RUNNER_ARCH" "${ImageOS:-}" "${ImageVersion:-}" > "$EVIDENCE/job.json"

      - name: Build the native tauri-plugin-updater check (the plugin version of the released app, from a locked dependency set)
        if: ${{ env.MODE == 'full' }}
        continue-on-error: true
        timeout-minutes: 40
        run: cargo build --release --locked --manifest-path wave0-lab-desktop/native-updater-check/Cargo.toml

      - name: "Replica harness (supporting evidence only, a fake GitHub on loopback, no hosts or trust-store change)"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.11:refs/tags/v0.7.11
          native=wave0-lab-desktop/native-updater-check/target/release/native-updater-check
          if [ -f "$native.exe" ]; then native="$native.exe"; fi
          args=(--repo . --evidence "$EVIDENCE/harness" --label macos --live-observation wave0-lab-desktop/live-observation-flip-window.json)
          if [ -f "$native" ]; then args+=(--native-check "$native"); fi
          python3 -u wave0-lab-desktop/desktop_updater_check.py run "${args[@]}"

      - name: Desktop updater isolation on macOS x86_64
        run: |
          set -Eeuo pipefail
          case "$MODE" in probe) command=probe ;; full) command=run ;; *) echo "unknown mode $MODE" >&2; exit 2 ;; esac
          python3 -u wave0-lab-desktop/os_macos.py "$command" --evidence "$EVIDENCE" --arch x86_64

      - name: Refuse to upload any private key material
        id: keys
        if: always()
        run: python3 wave0-lab-desktop/lib/ca.py scan --root "$EVIDENCE"

      - name: Keep the evidence
        if: always() && steps.keys.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-evidence-macos-intel
          path: evidence/macos-intel/
          if-no-files-found: error
          retention-days: 90

  summary:
    name: per-OS results to one verdict
    needs: [guard, desktop-linux, desktop-windows, desktop-macos-arm64, desktop-macos-intel]
    if: always() && needs.guard.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the Linux evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-evidence-linux
          path: records/linux

      - name: Download the Windows evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-evidence-windows
          path: records/windows

      - name: Download the macOS arm64 evidence
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-evidence-macos-arm64
          path: records/macos-arm64

      - name: Download the macOS x86_64 evidence (optional, summarised separately)
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-evidence-macos-intel
          path: records-intel/macos-intel

      - name: One verdict per operating system (anything missing or unknown is UNPROVED or MISSING, never PASS)
        run: |
          set -Eeuo pipefail
          mkdir -p summary
          python3 wave0-lab-desktop/stage_c_summary.py build --records records --out summary/stage-c-summary.json --require-desktop-os | tee summary/stage-c-summary.txt
          if [ -d records-intel ]; then
            python3 wave0-lab-desktop/stage_c_summary.py build --records records-intel --out summary/stage-c-summary-macos-intel.json --require-desktop-os | tee summary/stage-c-summary-macos-intel.txt || true
          fi

      - name: Keep the summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-summary
          path: summary/
          if-no-files-found: error
          retention-days: 90
