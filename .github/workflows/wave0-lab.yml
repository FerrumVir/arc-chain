name: Wave 0 lab - Stage A (pre-G0 dry run on the handoff artifact, throwaway branch)

# THROWAWAY BRANCH ONLY. This workflow exists on `wave0-v0712-lab` and is never merged: main stays untouched.
# It changes no product code and no existing workflow, publishes no release, creates no tag, uses no environment,
# no secret and no deployment. The only token is the job token, read-only (contents, actions).
#
# What it does (Stage A): download the L6 handoff artifact (digest-checked inside EVERY job), then run the
# repository's EXISTING acceptance harnesses against the launcher bytes of THAT artifact instead of CI-built ones:
#   linux-x86_64   headless (systemd, real v0.7.11 updater) and desktop            ubuntu-24.04
#   windows-x86_64 desktop                                                           windows-latest
#   macos-arm64    desktop                                                           macos-15
#   macos-x86_64   desktop                                                           macos-15-intel
#   linux-aarch64  NAMED EXCEPTION: no v0.7 linux-aarch64 baseline exists (v0.7.7 shipped none), so it is only
#                  EXECUTED as a smoke on ubuntu-24.04-arm and recorded as not consumed.
# Every job records the sha256 of the launcher before and after the harness; the summary job writes
# stage-a-summary.json (artifact wave0-stage-a-evidence) for scripts/--dry-run-evidence.
#
# Network: like the repository CI, every acceptance job rejects every live-network address for its whole run.
# All third-party actions are pinned to the SHAs the repository's own workflows already use.
on:
  push:
    branches: [wave0-v0712-lab]

permissions:
  contents: read
  actions: read

concurrency:
  group: wave0-lab-stage-a
  cancel-in-progress: false

jobs:
  guard:
    name: lab tree is base plus lab files only; configuration; offline self-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      stage_a: ${{ steps.config.outputs.stage_a }}
      stage_a_macos_arm64: ${{ steps.config.outputs.stage_a_macos_arm64 }}
      stage_a_macos_intel: ${{ steps.config.outputs.stage_a_macos_intel }}
      stage_a_aarch64: ${{ steps.config.outputs.stage_a_aarch64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind the lab tree to the base commit's tree plus added lab files only
        run: bash wave0-lab/guard.sh wave0-lab/config.json

      - name: Validate the lab configuration
        id: config
        run: python3 wave0-lab/check_config.py --config wave0-lab/config.json --github-output "$GITHUB_OUTPUT"

      - name: Offline self-tests (no network, no VM)
        run: |
          set -Eeuo pipefail
          python3 --version
          python3 -B -m unittest discover -s wave0-lab/tests -p 'test_*.py' -v
          shellcheck -S warning wave0-lab/guard.sh wave0-lab/stage_b/guest/*.sh

  stage-a-headless-linux:
    name: "Stage A: v0.7.11 headless install consumes the handoff x86_64 launcher (systemd, real updater)"
    needs: guard
    if: needs.guard.outputs.stage_a == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the handoff artifact and check it against the pinned digests
        run: python3 wave0-lab/fetch_handoff.py --config wave0-lab/config.json --out handoff
      - name: Run the existing headless acceptance on the handoff launcher bytes (it isolates the live network itself)
        run: |
          set -Eeuo pipefail
          launcher=handoff/v0.7.12/arc-node-linux-x86_64
          chmod 0755 "$launcher"
          before="$(sha256sum "$launcher" | awk '{print $1}')"
          set +e
          bash tests/legacy-bridge/headless-v07-acceptance.sh "$launcher" evidence/headless
          rc=$?
          set -e
          python3 wave0-lab/stage_a_record.py consumed --config wave0-lab/config.json \
            --asset arc-node-linux-x86_64 --launcher "$launcher" --before "$before" \
            --harness tests/legacy-bridge/headless-v07-acceptance.sh --job stage-a-headless-linux \
            --runner ubuntu-24.04 --exit-code "$rc" --installed "$HOME/.arc/bin/arc-node" \
            --out record/record-headless-linux-x86_64.json
          exit "$rc"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-record-headless-linux
          path: record/
          if-no-files-found: error
          retention-days: 90
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-evidence-headless-linux
          path: |
            evidence/
            handoff/handoff-verified.json
          if-no-files-found: warn
          retention-days: 30

  stage-a-desktop-linux:
    name: "Stage A: v0.7.11 desktop consumes the handoff x86_64 launcher (Linux)"
    needs: guard
    if: needs.guard.outputs.stage_a == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the handoff artifact and check it against the pinned digests
        run: python3 wave0-lab/fetch_handoff.py --config wave0-lab/config.json --out handoff
      - name: Isolate the runner from every live-network address
        run: |
          set -euo pipefail
          LIVE_NETWORK_IPS="$(python3 wave0-lab/live_ips.py .)"
          for ip in $LIVE_NETWORK_IPS; do
            sudo iptables -I OUTPUT -d "$ip" -j REJECT
          done
          first="${LIVE_NETWORK_IPS%% *}"
          if curl -s -m 5 -o /dev/null "https://$first/health"; then
            echo "the live network is still reachable" >&2
            exit 1
          fi
      - name: Released v0.7 inputs (v0.7.11 app resources, pinned v0.7.7 node)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.11:refs/tags/v0.7.11
          python3 tests/legacy-bridge/desktop_v07_harness.py check-source --repo .
          mkdir -p legacy
          git show v0.7.11:desktop/src-tauri/resources/testnet-seeds.txt > legacy/testnet-seeds.txt
          git show v0.7.11:desktop/src-tauri/resources/genesis.toml > legacy/genesis.toml
          curl -fsSL --retry 3 -o legacy/arc-node-v0.7.7 \
            https://github.com/FerrumVir/arc-chain/releases/download/v0.7.7/arc-node-linux-x86_64
          echo "1cfc3039786d023cde24ad0b452f35735b39f9e83aaf293e6ed0bf623a11b20c  legacy/arc-node-v0.7.7" | sha256sum -c -
          chmod 0755 legacy/arc-node-v0.7.7
      - name: The v0.7.11 desktop lifecycle consumes the handoff launcher
        run: |
          set -Eeuo pipefail
          launcher=handoff/v0.7.12/arc-node-linux-x86_64
          chmod 0755 "$launcher"
          before="$(sha256sum "$launcher" | awk '{print $1}')"
          set +e
          python3 tests/legacy-bridge/desktop_v07_harness.py run \
            --bridge "$launcher" \
            --legacy-node legacy/arc-node-v0.7.7 \
            --legacy-seeds legacy/testnet-seeds.txt \
            --legacy-genesis legacy/genesis.toml \
            --pins crates/arc-legacy-bridge/pins/active.json \
            --evidence evidence/desktop-linux
          rc=$?
          set -e
          python3 wave0-lab/stage_a_record.py consumed --config wave0-lab/config.json \
            --asset arc-node-linux-x86_64 --launcher "$launcher" --before "$before" \
            --harness tests/legacy-bridge/desktop_v07_harness.py --job stage-a-desktop-linux \
            --runner ubuntu-24.04 --exit-code "$rc" \
            --out record/record-desktop-linux-x86_64.json
          exit "$rc"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-record-desktop-linux
          path: record/
          if-no-files-found: error
          retention-days: 90
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-evidence-desktop-linux
          path: |
            evidence/
            handoff/handoff-verified.json
          if-no-files-found: warn
          retention-days: 30

  stage-a-desktop-windows:
    name: "Stage A: v0.7.11 desktop consumes the handoff Windows launcher"
    needs: guard
    if: needs.guard.outputs.stage_a == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the handoff artifact and check it against the pinned digests
        shell: bash
        run: python wave0-lab/fetch_handoff.py --config wave0-lab/config.json --out handoff
      - name: Isolate the runner from every live-network address
        shell: bash
        run: echo "LIVE_NETWORK_IPS=$(python wave0-lab/live_ips.py . | tr -d '\r')" >> "$GITHUB_ENV"
      - name: Block the live network in the Windows firewall
        shell: pwsh
        run: |
          $ips = $env:LIVE_NETWORK_IPS -split ' '
          New-NetFirewallRule -DisplayName 'arc-live-network-block' -Direction Outbound -Action Block -RemoteAddress $ips | Out-Null
          Set-NetFirewallProfile -All -Enabled True
          # A blocked connect fails fast ("access forbidden") or times out.
          $client = New-Object System.Net.Sockets.TcpClient
          $reachable = $false
          try {
            $reachable = $client.ConnectAsync($ips[0], 443).Wait(5000) -and $client.Connected
          } catch {
            Write-Host "blocked as intended: $($_.Exception.InnerException.Message)"
          }
          $client.Dispose()
          if ($reachable) { throw 'the live network is still reachable' }
      - name: Released v0.7 inputs (v0.7.11 app resources, pinned v0.7.7 node)
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.11:refs/tags/v0.7.11
          python tests/legacy-bridge/desktop_v07_harness.py check-source --repo .
          mkdir -p legacy
          git show v0.7.11:desktop/src-tauri/resources/testnet-seeds.txt > legacy/testnet-seeds.txt
          git show v0.7.11:desktop/src-tauri/resources/genesis.toml > legacy/genesis.toml
          curl -fsSL --retry 3 -o legacy/arc-node-v0.7.7.exe \
            https://github.com/FerrumVir/arc-chain/releases/download/v0.7.7/arc-node-windows-x86_64.exe
          echo "8c1530cfb41954079236dfdd5518dad52071b18f3a032630470b853e7249f240  legacy/arc-node-v0.7.7.exe" | sha256sum -c -
      - name: The v0.7.11 desktop lifecycle consumes the handoff launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          launcher=handoff/v0.7.12/arc-node-windows-x86_64.exe
          before="$(sha256sum "$launcher" | awk '{print $1}')"
          set +e
          python tests/legacy-bridge/desktop_v07_harness.py run \
            --bridge "$launcher" \
            --legacy-node legacy/arc-node-v0.7.7.exe \
            --legacy-seeds legacy/testnet-seeds.txt \
            --legacy-genesis legacy/genesis.toml \
            --pins crates/arc-legacy-bridge/pins/active.json \
            --evidence evidence/desktop-windows
          rc=$?
          set -e
          python wave0-lab/stage_a_record.py consumed --config wave0-lab/config.json \
            --asset arc-node-windows-x86_64.exe --launcher "$launcher" --before "$before" \
            --harness tests/legacy-bridge/desktop_v07_harness.py --job stage-a-desktop-windows \
            --runner windows-latest --exit-code "$rc" \
            --out record/record-desktop-windows-x86_64.json
          exit "$rc"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-record-desktop-windows
          path: record/
          if-no-files-found: error
          retention-days: 90
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-evidence-desktop-windows
          path: |
            evidence/
            handoff/handoff-verified.json
          if-no-files-found: warn
          retention-days: 30

  stage-a-desktop-macos-arm64:
    name: "Stage A: v0.7.11 desktop consumes the handoff macOS arm64 launcher"
    needs: guard
    if: needs.guard.outputs.stage_a_macos_arm64 == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the handoff artifact and check it against the pinned digests
        run: python3 wave0-lab/fetch_handoff.py --config wave0-lab/config.json --out handoff
      - name: Released v0.7 inputs, live-network isolation and the desktop lifecycle
        run: |
          set -Eeuo pipefail
          LIVE_NETWORK_IPS="$(python3 wave0-lab/live_ips.py .)"
          mkdir -p legacy
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.11:refs/tags/v0.7.11
          git show v0.7.11:desktop/src-tauri/resources/testnet-seeds.txt > legacy/testnet-seeds.txt
          git show v0.7.11:desktop/src-tauri/resources/genesis.toml > legacy/genesis.toml
          curl -fsSL --retry 3 -o legacy/arc-node-v0.7.7 \
            https://github.com/FerrumVir/arc-chain/releases/download/v0.7.7/arc-node-macos-arm64
          echo "415d6c2efbe3e6400d4dd2b7c23bc03e5e3a66c1c5c0a4e6280461611c047512  legacy/arc-node-v0.7.7" | shasum -a 256 -c -
          chmod 0755 legacy/arc-node-v0.7.7
          for ip in $LIVE_NETWORK_IPS; do
            echo "block drop out quick to $ip" >> legacy/pf.conf
          done
          sudo pfctl -f legacy/pf.conf
          sudo pfctl -e || sudo pfctl -s info | grep -q 'Status: Enabled'
          first="${LIVE_NETWORK_IPS%% *}"
          if curl -s -m 5 -o /dev/null "https://$first/health"; then
            echo "the live network is still reachable" >&2
            exit 1
          fi
          launcher=handoff/v0.7.12/arc-node-macos-arm64
          chmod 0755 "$launcher"
          before="$(shasum -a 256 "$launcher" | awk '{print $1}')"
          set +e
          python3 tests/legacy-bridge/desktop_v07_harness.py run \
            --bridge "$launcher" \
            --legacy-node legacy/arc-node-v0.7.7 \
            --legacy-seeds legacy/testnet-seeds.txt \
            --legacy-genesis legacy/genesis.toml \
            --pins crates/arc-legacy-bridge/pins/active.json \
            --evidence evidence/desktop-macos-arm64
          rc=$?
          set -e
          python3 wave0-lab/stage_a_record.py consumed --config wave0-lab/config.json \
            --asset arc-node-macos-arm64 --launcher "$launcher" --before "$before" \
            --harness tests/legacy-bridge/desktop_v07_harness.py --job stage-a-desktop-macos-arm64 \
            --runner macos-15 --exit-code "$rc" \
            --out record/record-desktop-macos-arm64.json
          exit "$rc"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-record-desktop-macos-arm64
          path: record/
          if-no-files-found: error
          retention-days: 90
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-evidence-desktop-macos-arm64
          path: |
            evidence/
            handoff/handoff-verified.json
          if-no-files-found: warn
          retention-days: 30

  stage-a-desktop-macos-intel:
    name: "Stage A: v0.7.11 desktop consumes the handoff macOS x86_64 launcher"
    needs: guard
    if: needs.guard.outputs.stage_a_macos_intel == 'true'
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the handoff artifact and check it against the pinned digests
        run: python3 wave0-lab/fetch_handoff.py --config wave0-lab/config.json --out handoff
      - name: Released v0.7 inputs, live-network isolation and the desktop lifecycle
        run: |
          set -Eeuo pipefail
          LIVE_NETWORK_IPS="$(python3 wave0-lab/live_ips.py .)"
          mkdir -p legacy
          git fetch --no-tags --depth=1 origin refs/tags/v0.7.11:refs/tags/v0.7.11
          git show v0.7.11:desktop/src-tauri/resources/testnet-seeds.txt > legacy/testnet-seeds.txt
          git show v0.7.11:desktop/src-tauri/resources/genesis.toml > legacy/genesis.toml
          curl -fsSL --retry 3 -o legacy/arc-node-v0.7.7 \
            https://github.com/FerrumVir/arc-chain/releases/download/v0.7.7/arc-node-macos-x86_64
          echo "f04d20021d64ab80c333471d4ea6fa5baf8b24262148fbaef590d6c0aaccd9c5  legacy/arc-node-v0.7.7" | shasum -a 256 -c -
          chmod 0755 legacy/arc-node-v0.7.7
          for ip in $LIVE_NETWORK_IPS; do
            echo "block drop out quick to $ip" >> legacy/pf.conf
          done
          sudo pfctl -f legacy/pf.conf
          sudo pfctl -e || sudo pfctl -s info | grep -q 'Status: Enabled'
          first="${LIVE_NETWORK_IPS%% *}"
          if curl -s -m 5 -o /dev/null "https://$first/health"; then
            echo "the live network is still reachable" >&2
            exit 1
          fi
          launcher=handoff/v0.7.12/arc-node-macos-x86_64
          chmod 0755 "$launcher"
          before="$(shasum -a 256 "$launcher" | awk '{print $1}')"
          set +e
          python3 tests/legacy-bridge/desktop_v07_harness.py run \
            --bridge "$launcher" \
            --legacy-node legacy/arc-node-v0.7.7 \
            --legacy-seeds legacy/testnet-seeds.txt \
            --legacy-genesis legacy/genesis.toml \
            --pins crates/arc-legacy-bridge/pins/active.json \
            --evidence evidence/desktop-macos-intel
          rc=$?
          set -e
          python3 wave0-lab/stage_a_record.py consumed --config wave0-lab/config.json \
            --asset arc-node-macos-x86_64 --launcher "$launcher" --before "$before" \
            --harness tests/legacy-bridge/desktop_v07_harness.py --job stage-a-desktop-macos-intel \
            --runner macos-15-intel --exit-code "$rc" \
            --out record/record-desktop-macos-x86_64.json
          exit "$rc"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-record-desktop-macos-intel
          path: record/
          if-no-files-found: error
          retention-days: 90
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-evidence-desktop-macos-intel
          path: |
            evidence/
            handoff/handoff-verified.json
          if-no-files-found: warn
          retention-days: 30

  stage-a-linux-aarch64-smoke:
    name: "Stage A: linux-aarch64 launcher EXECUTED as a smoke (named exception: no v0.7 baseline exists)"
    needs: guard
    if: needs.guard.outputs.stage_a_aarch64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the handoff artifact and check it against the pinned digests
        run: python3 wave0-lab/fetch_handoff.py --config wave0-lab/config.json --out handoff
      - name: Execute the aarch64 launcher (smoke only; no v0.7 install can consume it)
        run: |
          set -Eeuo pipefail
          launcher=handoff/v0.7.12/arc-node-linux-aarch64
          chmod 0755 "$launcher"
          mkdir -p record evidence
          before="$(sha256sum "$launcher" | awk '{print $1}')"
          uname -m | tee evidence/uname.txt
          set +e
          {
            file "$launcher" | tee evidence/file.txt
            grep -q 'ELF 64-bit LSB' evidence/file.txt && grep -q 'ARM aarch64' evidence/file.txt
          }
          file_rc=$?
          "$launcher" --version 2>&1 | tee evidence/version.txt
          version_rc=${PIPESTATUS[0]}
          grep -qF "arc-node $(jq -er .bridge_version crates/arc-legacy-bridge/pins/active.json) " evidence/version.txt
          match_rc=$?
          ARC_DIR="$(mktemp -d)" HOME="$(mktemp -d)" "$launcher" --legacy-bridge-status > evidence/status.txt 2>&1
          echo "status exit $? (information only: there is no bridged node on this machine)" | tee -a evidence/status.txt
          [ "$file_rc" -eq 0 ] && [ "$version_rc" -eq 0 ] && [ "$match_rc" -eq 0 ]
          smoke_rc=$?
          set -e
          python3 wave0-lab/stage_a_record.py smoke --config wave0-lab/config.json \
            --launcher "$launcher" --before "$before" --job stage-a-linux-aarch64-smoke \
            --runner ubuntu-24.04-arm --smoke-exit "$smoke_rc" \
            --file-text evidence/file.txt --version-text evidence/version.txt \
            --out record/record-smoke-linux-aarch64.json
          exit "$smoke_rc"
      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-record-linux-aarch64-smoke
          path: record/
          if-no-files-found: error
          retention-days: 90
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage-a-evidence-linux-aarch64-smoke
          path: |
            evidence/
            handoff/handoff-verified.json
          if-no-files-found: warn
          retention-days: 30

  stage-a-summary:
    name: Stage A summary (stage-a-summary.json for --dry-run-evidence)
    needs:
      - guard
      - stage-a-headless-linux
      - stage-a-desktop-linux
      - stage-a-desktop-windows
      - stage-a-desktop-macos-arm64
      - stage-a-desktop-macos-intel
      - stage-a-linux-aarch64-smoke
    if: always() && needs.guard.outputs.stage_a == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: stage-a-record-*
          merge-multiple: true
          path: records
      - name: Build the summary
        run: |
          set -Eeuo pipefail
          mkdir -p records bundle/records
          python3 wave0-lab/stage_a_summary.py build --config wave0-lab/config.json --records records --out bundle/stage-a-summary.json
      - name: Keep the Stage A evidence (stage-a-summary.json at the artifact root)
        if: always()
        run: |
          mkdir -p bundle/records
          cp records/*.json bundle/records/ 2>/dev/null || true
      - name: Upload the Stage A evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wave0-stage-a-evidence
          path: bundle/
          if-no-files-found: error
          retention-days: 90
