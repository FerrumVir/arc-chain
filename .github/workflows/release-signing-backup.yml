name: One-shot encrypted signing-key backup

run-name: Signing-key backup at ${{ inputs.expected_main_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Exact 40-character protected-main SHA
        required: true
        type: string
      confirmation:
        description: Type BACKUP_EXISTING_RELEASE_KEYS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: arc-one-shot-signing-key-backup
  cancel-in-progress: false

jobs:
  backup:
    name: encrypted signing-key backup
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release

    steps:
      - name: Bind to exact protected main and explicit authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
        run: |
          set +x
          set -Eeuo pipefail

          [ "$GITHUB_REPOSITORY" = "FerrumVir/arc-chain" ]
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [ "$CONFIRMATION" = "BACKUP_EXISTING_RELEASE_KEYS" ]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$GITHUB_SHA" = "$EXPECTED_MAIN_SHA" ]

          remote_main_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [ "$remote_main_sha" = "$EXPECTED_MAIN_SHA" ]

          printf 'Exact protected-main SHA: %s\n' "$remote_main_sha" \
            >> "$GITHUB_STEP_SUMMARY"

      # This fresh protected job never checks out or executes repository code.
      # Only fixed system tools touch the three recovery-equivalent secrets.
      - name: Create restore-tested ciphertext
        id: backup
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          ARC_RELEASE_MANIFEST_PRIVATE_KEY: ${{ secrets.ARC_RELEASE_MANIFEST_PRIVATE_KEY }}
          ARC_SIGNING_BACKUP_PASSPHRASE: ${{ secrets.ARC_SIGNING_BACKUP_PASSPHRASE }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/bin:/bin
        run: |
          set +x
          set -Eeuo pipefail
          ulimit -c 0
          umask 077
          export PATH='/usr/bin:/bin'
          unalias -a 2>/dev/null || true
          hash -r
          unset BASH_ENV ENV CDPATH LD_PRELOAD LD_LIBRARY_PATH \
            DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH PYTHONHOME PYTHONPATH \
            PERL5OPT PERL5LIB RUBYOPT RUBYLIB NODE_OPTIONS NODE_PATH \
            OPENSSL_CONF OPENSSL_MODULES GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM \
            GIT_CONFIG_NOSYSTEM SSH_AUTH_SOCK SSH_SK_PROVIDER

          [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]
          [ -n "${ARC_RELEASE_MANIFEST_PRIVATE_KEY:-}" ]
          [ "${#ARC_SIGNING_BACKUP_PASSPHRASE}" -ge 32 ]
          backup_passphrase="$ARC_SIGNING_BACKUP_PASSPHRASE"
          unset ARC_SIGNING_BACKUP_PASSPHRASE

          work_dir="$RUNNER_TEMP/arc-signing-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          tauri_key="$work_dir/tauri-updater.key"
          manifest_key="$work_dir/release-manifest-ed25519"
          ciphertext="$work_dir/arc-signing-keys.tar.gpg"
          payload="$work_dir/payload"
          restored="$work_dir/restored"
          plaintext_archive="$work_dir/signing-keys.tar"
          restored_archive="$work_dir/restored.tar"

          /usr/bin/install -d -m 700 -- "$work_dir" "$payload" "$restored"

          cleanup_keys() {
            unset TAURI_SIGNING_PRIVATE_KEY ARC_RELEASE_MANIFEST_PRIVATE_KEY \
              ARC_SIGNING_BACKUP_PASSPHRASE backup_passphrase
            for secret_path in \
              "$tauri_key" "$manifest_key" "$plaintext_archive" "$restored_archive" \
              "$payload/tauri-updater.key" "$payload/release-manifest-ed25519" \
              "$restored/tauri-updater.key" "$restored/release-manifest-ed25519"; do
              if [ -f "$secret_path" ] && [ ! -L "$secret_path" ]; then
                /usr/bin/shred -u -- "$secret_path" || true
              fi
            done
          }
          trap cleanup_keys EXIT HUP INT TERM

          /usr/bin/printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$tauri_key"
          # GitHub secrets do not preserve a terminal newline reliably. OpenSSH
          # private keys require one; without it ssh-keygen fails in libcrypto.
          /usr/bin/printf '%s\n' "$ARC_RELEASE_MANIFEST_PRIVATE_KEY" > "$manifest_key"
          /usr/bin/chmod 600 "$tauri_key" "$manifest_key"

          unset TAURI_SIGNING_PRIVATE_KEY ARC_RELEASE_MANIFEST_PRIVATE_KEY

          /usr/bin/install -m 600 -- "$tauri_key" "$payload/tauri-updater.key"
          /usr/bin/install -m 600 -- "$manifest_key" "$payload/release-manifest-ed25519"
          /usr/bin/ssh-keygen -y -f "$manifest_key" \
            > "$payload/release-manifest-ed25519.pub"
          /usr/bin/chmod 600 "$payload/release-manifest-ed25519.pub"
          (
            cd "$payload"
            /usr/bin/sha256sum tauri-updater.key release-manifest-ed25519 \
              > KEY-SHA256SUMS
            /usr/bin/chmod 600 KEY-SHA256SUMS
            /usr/bin/tar -cf "$plaintext_archive" \
              KEY-SHA256SUMS release-manifest-ed25519 \
              release-manifest-ed25519.pub tauri-updater.key
          )
          /usr/bin/printf '%s' "$backup_passphrase" | /usr/bin/gpg \
            --batch --yes --no-symkey-cache --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --s2k-mode 3 --s2k-digest-algo SHA512 --s2k-count 65011712 \
            --compress-algo none --output "$ciphertext" "$plaintext_archive"
          /usr/bin/printf '%s' "$backup_passphrase" | /usr/bin/gpg \
            --batch --yes --no-symkey-cache --pinentry-mode loopback \
            --passphrase-fd 0 --decrypt --output "$restored_archive" "$ciphertext"
          unset backup_passphrase
          /usr/bin/tar --extract --file "$restored_archive" --directory "$restored" \
            --no-same-owner --no-same-permissions -- \
            KEY-SHA256SUMS release-manifest-ed25519 \
            release-manifest-ed25519.pub tauri-updater.key
          (
            cd "$restored"
            /usr/bin/sha256sum -c KEY-SHA256SUMS >/dev/null
          )
          /usr/bin/cmp -s -- "$tauri_key" "$restored/tauri-updater.key"
          /usr/bin/cmp -s -- "$manifest_key" "$restored/release-manifest-ed25519"
          /usr/bin/ssh-keygen -y -f "$restored/release-manifest-ed25519" \
            > "$work_dir/restored-manifest.pub"
          /usr/bin/cmp -s -- \
            "$payload/release-manifest-ed25519.pub" "$work_dir/restored-manifest.pub"

          cleanup_keys
          trap - EXIT HUP INT TERM

          [ -f "$ciphertext" ]
          [ ! -L "$ciphertext" ]
          [ -s "$ciphertext" ]
          /usr/bin/chmod 600 "$ciphertext"

          cipher_row="$(/usr/bin/sha256sum "$ciphertext")"
          cipher_sha256="${cipher_row%% *}"
          artifact_name="arc-signing-backup-$EXPECTED_MAIN_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$cipher_sha256"

          {
            printf 'cipher_path=%s\n' "$ciphertext"
            printf 'cipher_sha256=%s\n' "$cipher_sha256"
            printf 'artifact_name=%s\n' "$artifact_name"
          } >> "$GITHUB_OUTPUT"

      - name: Upload ciphertext only
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.backup.outputs.artifact_name }}
          path: ${{ steps.backup.outputs.cipher_path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record non-secret receipt
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          CIPHER_SHA256: ${{ steps.backup.outputs.cipher_sha256 }}
        run: |
          {
            echo "Artifact ID: \`$ARTIFACT_ID\`"
            echo "Ciphertext SHA-256: \`$CIPHER_SHA256\`"
            echo "GitHub artifact digest: \`$ARTIFACT_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner ciphertext
        if: ${{ always() }}
        shell: bash
        env:
          CIPHER_PATH: ${{ steps.backup.outputs.cipher_path }}
        run: |
          set +x
          set -Eeuo pipefail
          expected_dir="$RUNNER_TEMP/arc-signing-backup-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          expected_ciphertext="$expected_dir/arc-signing-keys.tar.gpg"
          if [ -n "${CIPHER_PATH:-}" ] && [ "$CIPHER_PATH" != "$expected_ciphertext" ]; then
            echo "::error::Refusing unexpected cleanup path"
            exit 1
          fi
          case "$expected_dir" in
            "$RUNNER_TEMP"/arc-signing-backup-"$GITHUB_RUN_ID"-"$GITHUB_RUN_ATTEMPT")
              chmod -R u+rwX -- "$expected_dir" 2>/dev/null || true
              rm -rf -- "$expected_dir"
              ;;
            *)
              echo "::error::Refusing unexpected cleanup directory"
              exit 1
              ;;
          esac
