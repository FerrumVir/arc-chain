name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release-contract:
    name: release + installer contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Warm the cargo cache for the offline contract tests
        run: cargo fetch --locked
      - name: Shell syntax and offline contract tests
        run: bash tests/release/run.sh
      - name: ShellCheck release/install scripts
        run: |
          shellcheck -S warning \
            install.sh \
            scripts/install-community-node.sh \
            scripts/install-node.sh \
            scripts/auto-update.sh \
            scripts/sero-quickstart.sh \
            scripts/release/assemble-release.sh
          shellcheck -S warning --exclude=SC1090,SC2016 \
            tests/release/*.sh \
            tests/release/helpers/*.sh \
            tests/integration/*.sh

  secret-scan:
    name: secret scan (current tree)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: bash tests/release/current_tree_secret_scan.sh

  no-comments:
    name: no code comments
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - run: python3 scripts/ci/no_comments.py

  workflow-syntax:
    name: workflow syntax (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install pinned Actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            > "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version
      - name: Check every workflow
        run: |
          "$RUNNER_TEMP/actionlint" -color

  dashboard-contract:
    name: dashboard build + contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test

  explorer-contract:
    name: explorer contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: node explorer/test-contract.mjs

  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-03-16
          components: rustfmt
      - run: ./scripts/rustfmt-workspace.sh --check

  clippy:
    name: clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-03-16
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  release-candle:
    name: release Candle feature
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-03-16
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: release-candle
      - name: Deny warnings across every Candle target
        run: cargo clippy -p arc-inference -p arc-node --all-targets --features candle --locked -- -D warnings
      - name: Exercise inference, admission, cancellation, and shutdown paths
        run: cargo test -p arc-inference -p arc-node --lib --features candle --locked

  benchmark-tools:
    name: benchmark-tools feature
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-03-16
          components: clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: benchmark-tools
      - name: Deny warnings across every benchmark-tools target
        run: cargo clippy -p arc-crypto -p arc-state -p arc-node -p arc-bench --all-targets --features benchmark-tools --locked -- -D warnings
      - name: Compile nondefault examples and benches
        run: cargo check -p arc-crypto -p arc-state -p arc-node -p arc-bench --all-targets --features benchmark-tools --locked
      - name: Exercise feature-gated libraries and binaries
        run: cargo test -p arc-crypto -p arc-state -p arc-node -p arc-bench --lib --bins --tests --features benchmark-tools --locked

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-15' && startsWith(vars.ARC_MACOS_ARM_RUNNER, '[') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON(vars.ARC_MACOS_ARM_RUNNER) || matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    steps:
      - name: Prepare self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -Eeuo pipefail
          case " $(id -Gn) " in
            *" admin "*) echo "::error::The runner account must not be an administrator."; exit 1 ;;
          esac
          case "${HOME:?}" in /Users/?*) ;; *) echo "::error::Unexpected HOME: $HOME"; exit 1 ;; esac
          case "${GITHUB_WORKSPACE:?}" in
            */_work/*) ;;
            *) echo "::error::Unexpected workspace: $GITHUB_WORKSPACE"; exit 1 ;;
          esac
          chmod -R u+rwX -- "$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          {
            echo "CARGO_HOME=$HOME/.cargo"
            echo "RUSTUP_HOME=$HOME/.rustup"
            echo "GIT_CONFIG_NOSYSTEM=1"
          } >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-03-16
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        if: runner.environment != 'self-hosted'
        with:
          shared-key: test-${{ matrix.os }}
      - name: Native Windows namespace and recovery regressions
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: |
          set -uo pipefail
          failed=0
          run_test() { "$@" || failed=1; }

          run_test cargo test -p arc-crypto --lib --locked \
            secret_file::tests::windows_directory_rebarrier_requires_closed_descendant_handles \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-crypto --lib --locked \
            secret_file::tests::windows_existing_8dot3_alias_is_rejected_before_namespace_derivation \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-crypto --lib --locked \
            secret_file::tests::windows_existing_case_variants_share_one_namespace_and_sidecar \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-crypto --lib --locked \
            secret_file::tests::windows_simultaneous_first_namespace_lock_waits_out_exclusive_create_handle \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-crypto --lib --locked \
            secret_file::tests::desktop_lifecycle_handoff_requires_active_matching_session \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --lib --locked \
            recovery_dag_wal::tests::advisory_lock_contends_and_stale_regular_file_is_harmless \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --bin arc-node --locked \
            tests::node_data_directory_lock_rejects_concurrent_owner_and_survives_stale_file \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --bin arc-node --locked \
            tests::desktop_namespace_proof_allows_node_and_prepared_state_with_live_lifecycle_handle \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --bin arc-node --locked \
            tests::live_desktop_handle_without_exact_namespace_proof_fails_closed \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --bin arc-node --locked \
            tests::unlocked_lifecycle_ignores_stale_proof_and_runs_real_rebarrier \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --bin arc-node --locked \
            tests::active_desktop_handoff_rejects_wrong_session_nonce \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --bin arc-node --locked \
            tests::desktop_lifecycle_nonce_cli_is_strict_early_and_capability_visible \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --bin arc-node --locked \
            tests::node_data_directory_lock_restores_staged_only_history_before_open \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --bin arc-node --locked \
            tests::recovery_archive_rebarriers_a_visible_archive_on_absent_source_retry \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test -p arc-node --test desktop_shutdown_lifecycle --locked \
            private_desktop_request_stops_node_during_initialization \
            -- --exact --test-threads=1 --nocapture
          exit "$failed"
      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets --locked
      - name: cargo test (lib)
        if: runner.os != 'Windows'
        run: cargo test --workspace --lib --locked
      - name: cargo test (lib, serial on Windows WARP)
        if: runner.os == 'Windows'
        env:
          RUST_BACKTRACE: '1'
        run: cargo test --workspace --lib --locked -- --test-threads=1 --nocapture
      - name: LLM-sized GPU benchmark (macOS hardware)
        if: matrix.os == 'macos-15'
        run: cargo test -p arc-gpu --lib --locked gpu_matmul::tests::bench_matmul_4096 -- --exact --ignored --test-threads=1 --nocapture
      - name: ARC node binary shutdown and startup tests
        run: cargo test -p arc-node --bin arc-node --locked -- --test-threads=1
      - name: Desktop-managed node graceful shutdown integration
        run: cargo test -p arc-node --test desktop_shutdown_lifecycle --locked -- --test-threads=1
      - name: Clean up self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set +e
          case "${GITHUB_WORKSPACE:-}" in
            */_work/*)
              chmod -R u+rwX -- "$GITHUB_WORKSPACE" 2>/dev/null
              find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + ||
                echo "::warning::Workspace not fully removed; the next job's preparation retries."
              ;;
          esac
          exit 0

  integration:
    name: integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: nightly-2026-03-16
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: integration
      - run: cargo test --workspace --test '*' --locked -- --test-threads=1
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  desktop-typecheck:
    name: desktop typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Verify documentation against the installed Playwright inventory
        run: bash ../tests/release/documentation_contract_test.sh
      - run: npx tsc --noEmit

  desktop-tauri-test:
    name: desktop Tauri Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os == 'macos-15' && startsWith(vars.ARC_MACOS_ARM_RUNNER, '[') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON(vars.ARC_MACOS_ARM_RUNNER) || matrix.os }}
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      - name: Prepare self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -Eeuo pipefail
          case " $(id -Gn) " in
            *" admin "*) echo "::error::The runner account must not be an administrator."; exit 1 ;;
          esac
          case "${HOME:?}" in /Users/?*) ;; *) echo "::error::Unexpected HOME: $HOME"; exit 1 ;; esac
          case "${GITHUB_WORKSPACE:?}" in
            */_work/*) ;;
            *) echo "::error::Unexpected workspace: $GITHUB_WORKSPACE"; exit 1 ;;
          esac
          chmod -R u+rwX -- "$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          {
            echo "CARGO_HOME=$HOME/.cargo"
            echo "RUSTUP_HOME=$HOME/.rustup"
            echo "GIT_CONFIG_NOSYSTEM=1"
          } >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify macOS ad-hoc app sealing and package round-trip
        if: startsWith(matrix.os, 'macos-')
        run: python3 tests/release/test_seal_macos_app_bundle.py -v
      - name: Native Windows signer handoff permission boundary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -Eeuo pipefail
          python_bin="$(command -v python.exe)"
          case "$python_bin" in
            /*) ;;
            *)
              echo "::error::Python did not resolve to an absolute Windows executable."
              exit 1
              ;;
          esac
          [ -f "$python_bin" ] && [ ! -L "$python_bin" ] && [ -x "$python_bin" ]
          "$python_bin" -I tests/release/test_unsigned_desktop_windows_permissions.py -v

          probe_pid=''
          cleanup_probe() {
            if [ -n "$probe_pid" ] && kill -0 "$probe_pid" 2>/dev/null; then
              MSYS_NO_PATHCONV=1 taskkill.exe \
                /PID "$probe_pid" /T /F >/dev/null 2>&1 || \
                kill -KILL "$probe_pid" 2>/dev/null || true
            fi
          }
          trap cleanup_probe EXIT HUP INT TERM
          "$python_bin" -I -c 'import time; time.sleep(300)' &
          probe_pid=$!
          kill -0 "$probe_pid"
          MSYS_NO_PATHCONV=1 taskkill.exe \
            /PID "$probe_pid" /T /F >/dev/null 2>&1 || \
            kill "$probe_pid" 2>/dev/null || true
          for _ in {1..40}; do
            if ! kill -0 "$probe_pid" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          if kill -0 "$probe_pid" 2>/dev/null; then
            kill -KILL "$probe_pid" 2>/dev/null || true
            for _ in {1..20}; do
              if ! kill -0 "$probe_pid" 2>/dev/null; then
                break
              fi
              sleep 0.25
            done
          fi
          if kill -0 "$probe_pid" 2>/dev/null; then
            echo '::error::Native Windows cleanup did not terminate the probe.' >&2
            exit 1
          fi
          wait "$probe_pid" 2>/dev/null || true
          probe_pid=''
          trap - EXIT HUP INT TERM
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: desktop/package-lock.json
      - name: Build desktop frontend required by Tauri context
        working-directory: desktop
        run: |
          npm ci
          npm run build
      - name: Native Windows protected signer runtime boundary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --prefix desktop --ignore-scripts
          node_bin="$(command -v node.exe)"
          case "$node_bin" in
            /*) ;;
            *)
              echo "::error::Node did not resolve to an absolute Windows executable."
              exit 1
              ;;
          esac
          tauri_cli="$PWD/desktop/node_modules/@tauri-apps/cli/tauri.js"
          case "$tauri_cli" in
            /*) ;;
            *)
              echo "::error::Tauri CLI did not resolve inside the absolute checkout."
              exit 1
              ;;
          esac
          if [ ! -f "$node_bin" ] || [ -L "$node_bin" ] || [ ! -x "$node_bin" ]; then
            echo "::error::Node is missing, linked, or non-executable."
            exit 1
          fi
          if [ ! -f "$tauri_cli" ] || [ -L "$tauri_cli" ]; then
            echo "::error::Tauri CLI is missing or linked."
            exit 1
          fi
          [ "$("$node_bin" --version)" = "v24.20.0" ]
          tauri_cli_sha256="$(/usr/bin/sha256sum "$tauri_cli" | /usr/bin/awk '{print $1}')"
          [ "$tauri_cli_sha256" = "0dd6ec63c7c63a993fde20955e291d833c03f3760e63e0ee21e83482f6c0b43a" ]
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        if: runner.environment != 'self-hosted'
        with:
          workspaces: desktop/src-tauri
          shared-key: desktop-tauri-${{ matrix.os }}
      - name: Native Windows desktop lifecycle state-machine regressions
        if: runner.os == 'Windows'
        shell: bash
        env:
          RUST_BACKTRACE: '1'
        run: |
          set -uo pipefail
          failed=0
          run_test() { "$@" || failed=1; }

          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            desktop_instance::tests -- --test-threads=1 --nocapture
          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            node_manager::tests::existing_owner_probe_never_changes_directory_contents \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            node_manager::tests::managed_lifecycle_lock_serializes_desktop_processes \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            node_manager::tests::provisional_orphan_lease_cannot_launch_and_prepares_after_node_lock_reaps \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            node_manager::tests::managed_lifecycle_lock_migrates_v1_proof_and_lock_residue \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            node_manager::tests::managed_lifecycle_lock_rejects_invalid_namespace_proof \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            node_manager::tests::managed_lifecycle_lock_restores_staged_data_directory \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            node_manager::tests::managed_lifecycle_lock_restores_staged_control_directory \
            -- --exact --test-threads=1 --nocapture
          run_test cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked \
            node_manager::tests::managed_lifecycle_lock_accepts_existing_case_variant_namespace \
            -- --exact --test-threads=1 --nocapture
          exit "$failed"
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked
      - name: Build unsigned candidate MSI for single-instance acceptance
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: pwsh
        env:
          CARGO_BUILD_JOBS: '4'
        run: |
          npm run tauri -- build --debug --bundles msi --config '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Candidate Windows packaged desktop single-instance acceptance
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packages = @(Get-ChildItem desktop/src-tauri/target/debug/bundle/msi/*.msi)
          if ($packages.Count -ne 1) { throw 'expected one candidate MSI' }
          ./tests/desktop/windows-single-instance.ps1 -MsiPath $packages[0].FullName -EvidenceDirectory windows-instance-evidence
      - name: Upload candidate Windows instance evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-candidate-single-instance
          path: |
            windows-instance-evidence/result.json
            windows-instance-evidence/*.stdout
            windows-instance-evidence/*.stderr
            windows-instance-evidence/*.log
          if-no-files-found: warn
      - name: Clean up self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set +e
          case "${GITHUB_WORKSPACE:-}" in
            */_work/*)
              chmod -R u+rwX -- "$GITHUB_WORKSPACE" 2>/dev/null
              find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + ||
                echo "::warning::Workspace not fully removed; the next job's preparation retries."
              ;;
          esac
          exit 0

  desktop-e2e:
    name: desktop e2e (playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.gate.config.ts
      - name: Check source cleanliness after Playwright
        working-directory: .
        run: |
          set -euo pipefail
          source_status="$(git status --porcelain=v1 --untracked-files=all)"
          if [ -n "$source_status" ]; then
            printf '%s\n' "$source_status"
            echo '::error::Playwright changed tracked or untracked source.'
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7

  audit:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enforce advisory, license, source, and dependency policy
        run: |
          set -euo pipefail
          failed=()
          for manifest in \
            Cargo.toml \
            desktop/src-tauri/Cargo.toml \
            tests/release/tauri-updater-verifier/Cargo.toml; do
            if ! bash scripts/ci/run-cargo-deny.sh "$manifest"; then
              failed+=("$manifest")
            fi
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            printf '::error::cargo-deny failed for: %s\n' "${failed[*]}"
            exit 1
          fi

  shell-syntax:
    name: shell syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: bash -n every shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash syntax error"
              fail=1
            fi
          done < <(find scripts deploy tests/release tests/integration -type f -name '*.sh' | sort)
          exit "$fail"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          files=(install.sh)
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find scripts deploy tests/release tests/integration -type f -name '*.sh' -print0)
          shellcheck -S warning "${files[@]}"

  forge:
    name: contracts (forge)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09
        with:
          version: v1.7.1
      - name: forge fmt --check
        run: forge fmt --check
      - name: Resolve OpenZeppelin
        run: npm install --no-save @openzeppelin/contracts@5.0.2
      - name: forge tests
        env:
          FOUNDRY_REMAPPINGS: '@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/'
        run: forge test
      - name: forge build --sizes
        env:
          FOUNDRY_REMAPPINGS: '@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/'
        run: forge build --sizes

  sdk-check:
    name: SDK clean build + packed consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test

  compatibility-typescript-sdk:
    name: compatibility TypeScript SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdks/typescript/package-lock.json
      - run: npm ci
      - run: python3 -I -B ../../scripts/release/npm-audit-gate.py --package . --level low --omit-dev && python3 -I -B ../../scripts/release/npm-audit-gate.py --package . --level high
      - run: npm test -- --runInBand
      - run: npm run build
      - name: Load the published CommonJS entrypoint
        shell: bash
        run: >-
          node -e "const sdk=require('./dist');
          if (!sdk || typeof sdk !== 'object') throw new Error('CommonJS SDK failed to load')"

  python-sdk:
    name: Python SDK (${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPYCACHEPREFIX: /tmp/arc-python-sdk-pycache-${{ matrix.python-version }}
      RUFF_CACHE_DIR: /tmp/arc-python-sdk-ruff-cache-${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: sdks/python/pyproject.toml
      - run: python -m pip install -e '.[dev]'
      - name: Audit the resolved SDK dependency graph
        if: matrix.python-version != '3.9'
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/arc-python-sdk-requirements.txt"
          python -m pip_audit -r "$RUNNER_TEMP/arc-python-sdk-requirements.txt"
      - run: python -m ruff check arc_sdk tests
      - run: python -m ruff format --check arc_sdk tests
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q arc_sdk tests

  script-suites:
    name: script suites (python + node contract + desktop unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install the third-party packages arc_conformance needs
        run: python -m pip install "blake3>=1.0" "numpy>=1.26"
      - name: Python suites (arc_conformance, arc_soak, arc_ops, scripts/release/tests)
        run: bash scripts/ci/run-script-suites.sh
      - name: explorer local-dev native-inference contract (no browser, no build)
        run: node explorer/test-localdev-native.mjs
      - name: desktop pure-logic unit specs (Playwright unit config, no browser)
        working-directory: desktop
        run: |
          npm ci
          npm run test:unit

