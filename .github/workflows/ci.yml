name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace
      # Clippy runs as a warning surface, not a gate. Each Rust release adds
      # new stylistic lints that fire on existing code; letting them break CI
      # either forces mechanical rewrites of crypto hot-paths (which risks
      # on-chain attestation divergence) or a running war of allowlists.
      # Real regressions still fail via `cargo check` and `cargo test`.
      - run: cargo clippy --workspace
      - run: cargo test --workspace

  explorer-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build

  sdk-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx tsc --noEmit
