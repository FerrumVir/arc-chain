name: CI

# Parallel sibling jobs. Nothing uses `needs:` except where a job genuinely
# consumes another's output, so every gate occupies its own runner and total
# wall clock stays roughly the Rust build time even as coverage widens.
#
# OPTIONAL-GATE CONTRACT (read before editing):
#   Every remaining `continue-on-error` has a named TODO and a concrete exit
#   condition. Optional jobs measure known platform/tooling debt; required
#   fmt, clippy, check, unit, integration, web-contract, and desktop gates fail
#   the workflow immediately when they regress.
#
# No `paths:` filter is set deliberately: once these checks are required by
# branch protection, a docs-only PR that skips them sits forever in "Expected
# — Waiting for status to be reported". Cheap jobs on every PR beats that.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly canary so advisory data (audit job) is re-evaluated even in a quiet
  # week, and so bit-rot in the non-blocking jobs surfaces without a PR.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Deliberately NOT setting `RUSTFLAGS: -D warnings` here. It would apply to
  # every job including the blocking `test` job, promoting ordinary rustc
  # warnings (unused variables, dead code) to hard errors on a workspace that
  # has never been gated on them. Warning-denial belongs to the blocking
  # clippy job instead.

jobs:
  # ----------------------------------------------- release/install contract --
  # Cheap, deterministic, and completely offline. This recreates release
  # artifacts from fixtures and runs the installer through PATH shims, catching
  # a desktop-only release, renamed asset, checksum bypass, architecture drift,
  # or accidental service start before a tag can be cut.
  release-contract:
    name: release + installer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax and offline contract tests
        run: bash tests/release/run.sh
      - name: ShellCheck release/install scripts
        run: |
          shellcheck \
            install.sh \
            scripts/install-community-node.sh \
            scripts/install-node.sh \
            scripts/auto-update.sh \
            scripts/sero-quickstart.sh \
            scripts/release/assemble-release.sh \
            tests/release/*.sh \
            tests/release/helpers/*.sh

  # ------------------------------------------------ current-tree secrets ----
  # Full history intentionally contains the retired deterministic validator
  # material, so scanning history would create a permanent false gate. This
  # job archives and scans only the exact checked-out commit with a checksummed,
  # pinned Gitleaks binary; any secret present in the releasable tree blocks CI.
  secret-scan:
    name: secret scan (current tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: bash tests/release/current_tree_secret_scan.sh

  # ----------------------------------------------- static web contracts ----
  # These sites intentionally have no package manifest or build step. Their
  # dependency-free Node contracts validate JavaScript syntax, supported RPC
  # sources, CSP boundaries, safe rendering, and honest liveness semantics.
  dashboard-contract:
    name: dashboard contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node dashboard/test-contract.mjs

  explorer-contract:
    name: explorer contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node explorer/test-contract.mjs

  # ---------------------------------------------------------------- fmt ----
  # Cheapest gate in the repo, so it runs alone and fails in seconds instead
  # of waiting behind a multi-minute cargo build.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Keep this dated toolchain aligned with rust-toolchain.toml. Custom
      # toolchain inputs use the action's master revision by design.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-16
          components: rustfmt
      - run: ./scripts/rustfmt-workspace.sh --check

  # ------------------------------------------------------------- clippy ----
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-16
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # --------------------------------------------------------------- test ----
  # The merge gate. macos-14 is Apple Silicon, so this matrix is the only
  # place in the repo where the ARM half of the "bit-identical across
  # ARM/x86" claim is exercised at all. Note that an OS matrix alone does
  # NOT prove cross-platform determinism — every determinism test in the
  # workspace compares a run to another run in the same process on the same
  # machine. See .github/workflows/golden-vectors.yml for the missing half.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            optional: false
          # TODO(OPTIONAL-PLATFORMS): make these required after their
          # platform-specific dependencies and timing behavior are proven
          # stable enough for branch protection. Linux remains the merge gate.
          - os: macos-14
            optional: true
          - os: windows-latest
            optional: true
    continue-on-error: ${{ matrix.optional }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-16
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test-${{ matrix.os }}
      # Compile-check everything the test step does not build: the 15
      # [[bin]] targets in arc-bench (which produce the numbers in
      # docs/BENCHMARK-RESULTS.md and were never compiled by CI), the
      # arc-crypto criterion bench, and every example. A manifest or
      # compile break in those targets is exactly the class of failure that
      # shipped v0.5.5 and v0.5.6 with no arc-node binaries attached.
      - name: cargo check (all targets)
        run: cargo check --workspace --all-targets --locked
      - name: cargo test (lib)
        run: cargo test --workspace --lib --locked

  # -------------------------------------------------------- integration ----
  # Separate job so a slow multi-node run neither serializes behind nor
  # blocks fast unit feedback.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The timing-sensitive three-node transition scenario remains explicitly
    # ignored; every integration test that actually runs is a required gate.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-16
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: integration
      # --test-threads=1 because these tests bind sockets and race each
      # other for ports when run in parallel.
      - run: cargo test --workspace --test '*' --locked -- --test-threads=1
      - name: Doc tests
        run: cargo test --workspace --doc --locked

  # ---------------------------------------------------- desktop typecheck --
  # Blocking from day one: desktop/package.json's `build` script already runs
  # `tsc --noEmit`, and tauri.conf.json calls that script as
  # beforeBuildCommand, so it necessarily passed when v0.7.11 was tagged.
  # The only thing changing here is WHEN it runs — PR time instead of mid
  # release, across four parallel platform bundles.
  desktop-typecheck:
    name: desktop typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  # -------------------------------------------------------- desktop e2e ----
  # playwright.config.ts drives the mock Tauri backend, so no arc-node binary
  # is required and a plain Ubuntu runner suffices. The green suite is a
  # required gate alongside the desktop typecheck.
  desktop-e2e:
    name: desktop e2e (playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # webServer in playwright.config.ts runs `npm run build && npm run
      # preview` on :4173 and CI=true turns on forbidOnly/retries/1 worker.
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: desktop/playwright-report/
          retention-days: 7

  # -------------------------------------------------------------- audit ----
  audit:
    name: supply chain (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TODO(OPTIONAL-AUDIT): make blocking after the current advisory, license,
    # and yanked-crate findings are triaged. Every entry added to [advisories]
    # ignore must carry a dated comment; see deny.toml.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources licenses

  # ------------------------------------------------------- shell syntax ----
  # Zero-debt gate, blocking from day one: `bash -n` parses without executing,
  # so it can only fail on a genuine syntax error.
  shell-syntax:
    name: shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n every shell script
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! bash -n "$f"; then
              echo "::error file=$f::bash syntax error"
              fail=1
            fi
          done < <(find scripts deploy -type f -name '*.sh' | sort)
          exit "$fail"

  # --------------------------------------------------------- shellcheck ----
  # 33 shell scripts, several of which are curl|bash'd onto third-party
  # machines straight off main (scripts/install-community-node.sh,
  # scripts/install-node.sh), plus the per-seed self-heal daemon that decides
  # when to restart production nodes. None have ever been linted.
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # TODO(OPTIONAL-SHELLCHECK): ratchet, don't flip in one step. Sequence:
    #   a) fix findings at -S error, make the job blocking at -S error
    #   b) fix findings at -S warning, change the flag below to match
    #   c) only then consider -S style
    # Prioritise fixes by blast radius: install-community-node.sh and
    # arc-self-heal.sh before anything else.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      # shellcheck is preinstalled on ubuntu-latest runners; no third-party
      # action needed for a one-line invocation.
      - name: shellcheck
        run: |
          set -euo pipefail
          shellcheck --version
          find scripts deploy -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -S warning

  # ------------------------------------------------------------- forge ----
  # 8 Solidity files including a bridge, a staking contract, a state-root
  # anchor and a UUPS proxy. foundry.toml has been configured this whole
  # time; nothing has ever compiled them.
  forge:
    name: contracts (forge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # TODO(OPTIONAL-FORGE): make blocking after dependency resolution is
    # reproducible. contracts/ imports
    # @openzeppelin/contracts/**, foundry.toml sets libs = ["lib"], and there
    # is no lib/ directory and no git submodule in the repo — so the
    # dependency has never been resolvable from a clean checkout. The npm
    # install + FOUNDRY_REMAPPINGS below is the minimal fix that adds no new
    # tracked files; the durable fix is committing a remappings.txt or a
    # foundry submodule, and pinning the OpenZeppelin major version to
    # whichever one these contracts were written against (v5 changed
    # Ownable's constructor signature, so a v4-era contract fails to compile
    # against the v5 pinned below — that is the first thing to check).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      # Runs without dependencies resolved, so it reports honestly even while
      # `forge build` is still red.
      - name: forge fmt --check
        run: forge fmt --check
      - name: Resolve OpenZeppelin
        run: npm install --no-save @openzeppelin/contracts@5.0.2
      - name: forge build --sizes
        env:
          FOUNDRY_REMAPPINGS: '@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/'
        run: forge build --sizes

  # --------------------------------------------------------- sdk-check ----
  # Was `npm install` (resolves a fresh tree, so CI could pass on a dependency
  # set no developer has); now `npm ci`, which honours the tracked lockfile.
  #
  # `npm ci` fails hard if package.json and package-lock.json drift apart,
  # where `npm install` would silently reconcile them. Fix lock drift with
  # `cd sdk/typescript && npm install` and commit the lockfile; do not weaken
  # this gate by reverting to `npm install`.
  sdk-check:
    name: sdk typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

# REMOVED: the old `explorer-build` job. It probed for explorer/package.json,
# emitted a ::notice:: and exited. Explorer is intentionally dependency-free
# static HTML/CSS/JavaScript now, and its executable contract is enforced by
# the blocking `explorer-contract` job above. Add a build job only if a real
# package/build pipeline lands in explorer/.
#
# NOT ADDED (deliberate, tracked as follow-up): jobs for sdks/typescript
# (a complete jest + ts-jest suite that has never run), sdks/python
# (tests/test_client.py, no pytest/ruff/mypy anywhere), and
# desktop/src-tauri (excluded from the workspace at Cargo.toml:3, so every
# `--workspace` command here skips the code that supervises the arc-node
# child process and downloads its binary). All three are real gaps; none are
# in scope for this change. Note that three separate package.json files
# declare the name "@arc-chain/sdk" — that collision should be resolved
# before writing CI against them.
