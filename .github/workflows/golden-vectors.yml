name: Golden vectors

# Blocking known-answer tests compare the production CachedIntegerModel against
# reviewed, hardcoded tokens and digests. The same fixture covers one-thread I8,
# four-thread promoted-I16, whole-model execution, a three-way layer split, KV
# state, hidden states, logits, and autoregressive output. It deliberately does
# not claim GPU or full GGUF-model coverage; see INFERENCE_DETERMINISM.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  golden:
    name: golden vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; macos-15-intel directly covers the Intel
        # Mac artifact that community members reported as broken.
        os: [ubuntu-latest, macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove namespaced manifest verification on every installer OS
        shell: bash
        run: |
          set -Eeuo pipefail
          probe_dir="$RUNNER_TEMP/arc-release-ssh-portability"
          key="$probe_dir/key"
          probe="$probe_dir/probe"
          allowed="$probe_dir/allowed-signers"
          cleanup() {
            rm -f -- "$key" "$key.pub" "$probe" "$probe.sig" "$allowed"
            rmdir "$probe_dir" 2>/dev/null || true
          }
          trap cleanup EXIT HUP INT TERM
          mkdir -p -- "$probe_dir"
          ssh-keygen -q -t ed25519 -N '' -f "$key"
          printf '%s\n' 'ARC release verifier portability probe v1' > "$probe"
          printf 'arc-release namespaces="arc-release-manifest-v1" %s\n' \
            "$(cat "$key.pub")" > "$allowed"
          ssh-keygen -Y sign \
            -f "$key" \
            -n arc-release-manifest-v1 \
            "$probe"
          if [ "$RUNNER_OS" = Windows ]; then
            (
              cd "$probe_dir"
              cmd.exe /d /c "ssh-keygen -Y verify -f allowed-signers -I arc-release -n arc-release-manifest-v1 -s probe.sig < probe"
            )
          else
            ssh-keygen -Y verify \
              -f "$allowed" \
              -I arc-release \
              -n arc-release-manifest-v1 \
              -s "$probe.sig" \
              < "$probe"
          fi
          cleanup
          trap - EXIT HUP INT TERM
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: golden-${{ matrix.os }}
      - name: Run golden known-answer vectors
        run: cargo test -p arc-inference --lib --locked golden -- --nocapture
