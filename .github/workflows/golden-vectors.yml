name: Golden vectors

# Blocking known-answer tests compare the production CachedIntegerModel against
# reviewed, hardcoded tokens and digests. The same fixture covers one-thread I8,
# four-thread promoted-I16, whole-model execution, a three-way layer split, KV
# state, hidden states, logits, and autoregressive output. It deliberately does
# not claim GPU or full GGUF-model coverage; see INFERENCE_DETERMINISM.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  golden:
    name: golden vectors (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple Silicon; macos-15-intel directly covers the Intel
        # Mac artifact that community members reported as broken.
        os: [ubuntu-latest, macos-14, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: golden-${{ matrix.os }}
      - name: Run golden known-answer vectors
        run: cargo test -p arc-inference --lib --locked golden -- --nocapture
