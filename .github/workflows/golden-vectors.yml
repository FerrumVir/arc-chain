name: Golden vectors

# Blocking known-answer tests compare the production CachedIntegerModel against
# reviewed, hardcoded tokens and digests. The same fixture covers one-thread I8,
# four-thread promoted-I16, whole-model execution, a three-way layer split, KV
# state, hidden states, logits, and autoregressive output. It deliberately does
# not claim GPU or full GGUF-model coverage; see INFERENCE_DETERMINISM.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  golden:
    name: golden vectors (${{ matrix.os }})
    # The Apple Silicon leg runs on ARC's own Mac Studio only when the
    # ARC_MACOS_ARM_RUNNER repository variable is set and the branch belongs to
    # this repository; otherwise it runs on GitHub's macos-15 as before. The
    # matrix value, and so the check name, never changes. See
    # docs/self-hosted-runner.md.
    runs-on: ${{ matrix.os == 'macos-15' && startsWith(vars.ARC_MACOS_ARM_RUNNER, '[') && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]')) && fromJSON(vars.ARC_MACOS_ARM_RUNNER) || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon; macos-15-intel directly covers the Intel
        # Mac artifact that community members reported as broken.
        os: [ubuntu-latest, macos-15, macos-15-intel, windows-latest]
    steps:
      # Self-hosted runner only (docs/self-hosted-runner.md): start from an
      # empty workspace and keep the Rust toolchain in the runner's own home.
      - name: Prepare self-hosted runner
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -Eeuo pipefail
          case " $(id -Gn) " in
            *" admin "*) echo "::error::The runner account must not be an administrator."; exit 1 ;;
          esac
          case "${HOME:?}" in /Users/?*) ;; *) echo "::error::Unexpected HOME: $HOME"; exit 1 ;; esac
          case "${GITHUB_WORKSPACE:?}" in
            */_work/*) ;;
            *) echo "::error::Unexpected workspace: $GITHUB_WORKSPACE"; exit 1 ;;
          esac
          chmod -R u+rwX -- "$GITHUB_WORKSPACE"
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          {
            echo "CARGO_HOME=$HOME/.cargo"
            echo "RUSTUP_HOME=$HOME/.rustup"
            echo "GIT_CONFIG_NOSYSTEM=1"
          } >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove namespaced manifest verification on every installer OS
        shell: bash
        run: |
          set -Eeuo pipefail
          probe_dir="$RUNNER_TEMP/arc-release-ssh-portability"
          key="$probe_dir/key"
          probe="$probe_dir/probe"
          allowed="$probe_dir/allowed-signers"
          cleanup() {
            rm -f -- "$key" "$key.pub" "$probe" "$probe.sig" "$allowed"
            rmdir "$probe_dir" 2>/dev/null || true
          }
          trap cleanup EXIT HUP INT TERM
          mkdir -p -- "$probe_dir"
          ssh-keygen -q -t ed25519 -N '' -f "$key"
          printf '%s\n' 'ARC release verifier portability probe v1' > "$probe"
          printf 'arc-release namespaces="arc-release-manifest-v1" %s\n' \
            "$(cat "$key.pub")" > "$allowed"
          ssh-keygen -Y sign \
            -f "$key" \
            -n arc-release-manifest-v1 \
            "$probe"
          if [ "$RUNNER_OS" = Windows ]; then
            (
              cd "$probe_dir"
              cmd.exe /d /c "ssh-keygen -Y verify -f allowed-signers -I arc-release -n arc-release-manifest-v1 -s probe.sig < probe"
            )
          else
            ssh-keygen -Y verify \
              -f "$allowed" \
              -I arc-release \
              -n arc-release-manifest-v1 \
              -s "$probe.sig" \
              < "$probe"
          fi
          cleanup
          trap - EXIT HUP INT TERM
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # A self-hosted run neither restores nor saves the shared Actions cache.
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        if: runner.environment != 'self-hosted'
        with:
          shared-key: golden-${{ matrix.os }}
      - name: Run golden known-answer vectors
        run: cargo test -p arc-inference --lib --locked golden -- --nocapture
      - name: Clean up self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        shell: bash
        run: |
          set +e
          case "${GITHUB_WORKSPACE:-}" in
            */_work/*)
              chmod -R u+rwX -- "$GITHUB_WORKSPACE" 2>/dev/null
              find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} + ||
                echo "::warning::Workspace not fully removed; the next job's preparation retries."
              ;;
          esac
          exit 0
