name: Release desktop app

# Fires on the same tags the arc-node release workflow watches. Publishes
# signed ARC Node bundles for macOS (Apple Silicon + Intel), Windows
# (x86_64 NSIS installer), and Linux (x86_64 AppImage), plus the
# `latest.json` manifest the Tauri updater consumes.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.4)'
        required: true
        default: 'v0.5.4'

# Never cancel a release mid-flight; serialise per tag instead.
concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -------------------------------------------------- require-node-assets ---
  # THE GUARD THAT WAS MISSING.
  #
  # This workflow and .github/workflows/release.yml both fire on the same
  # `v*.*.*` tag, and both call softprops/action-gh-release for that tag.
  # They are independent: if release.yml's build fails, its publish job is
  # skipped - but this workflow carries on and creates the GitHub release
  # anyway, populated with desktop bundles only. That is exactly how v0.7.10
  # and v0.7.11 shipped with no arc-node binaries attached, which 404s:
  #   - the desktop app's own arc-node binary bootstrap
  #     (releases/latest/download/...), i.e. a fresh desktop install cannot
  #     obtain a node at all, and
  #   - the README / install-community-node.sh installer.
  #
  # So the desktop release is now gated on the CLI assets actually existing on
  # the release. This job blocks `publish` until they do, or fails loudly with
  # an actionable message. It costs one idle ubuntu runner, which is far
  # cheaper than duplicating four LTO-fat Rust builds here - and far cheaper
  # than shipping another broken release.
  require-node-assets:
    name: Require arc-node assets on the release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for arc-node assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          # Keep this list identical to REQUIRED_ASSETS in release.yml.
          REQUIRED_ASSETS="
          arc-node-macos-arm64
          arc-node-macos-x86_64
          arc-node-windows-x86_64.exe
          arc-node-linux-x86_64
          "

          # release.yml builds four targets with fat LTO, so allow generous
          # headroom. 100 attempts x 60s = 100 minutes, inside the 120 minute
          # job timeout.
          ATTEMPTS=100
          for i in $(seq 1 "$ATTEMPTS"); do
            assets=$(gh release view "$TAG" --repo "$REPO" --json assets \
                       --jq '.assets[].name' 2>/dev/null || true)

            missing=0
            for asset in $REQUIRED_ASSETS; do
              echo "$assets" | grep -Fxq "$asset" || missing=1
            done

            if [ "$missing" -eq 0 ]; then
              echo "All required arc-node assets are present on $TAG:"
              echo "$assets" | sed 's/^/  /'
              exit 0
            fi

            # Early abort: if the Release workflow already finished
            # unsuccessfully for this commit, the assets are never arriving
            # and waiting out the full timeout just delays the bad news.
            conclusion=$(gh api \
              "repos/$REPO/actions/workflows/release.yml/runs?head_sha=$SHA" \
              --jq '.workflow_runs[0].conclusion // empty' 2>/dev/null || true)
            case "$conclusion" in
              failure|cancelled|timed_out)
                echo "::error::The Release workflow (release.yml) concluded '$conclusion' for this commit, so the arc-node binaries will never be published for $TAG. Fix that workflow and re-run it before releasing the desktop app - publishing desktop bundles alone produces a release whose arc-node download URLs 404."
                exit 1
                ;;
            esac

            echo "attempt $i/$ATTEMPTS: arc-node assets not on $TAG yet (release.yml conclusion: ${conclusion:-in-progress}); sleeping 60s"
            sleep 60
          done

          echo "::error::Timed out waiting for arc-node assets on $TAG. Required: $(echo $REQUIRED_ASSETS | tr '\n' ' '). Refusing to publish a desktop-only release - that is the v0.7.10/v0.7.11 failure mode, where the desktop app ships but its arc-node bootstrap and the README installer both 404."
          exit 1

  bundle:
    name: Bundle ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: '--target aarch64-apple-darwin'
            artifact-glob: |
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          # Intel Mac: cross-compiled from the macos-14 (Apple Silicon)
          # runner instead of macos-13, since macos-13 has long queue
          # waits in GitHub-hosted pools that block the publish step.
          - platform: macos-x86_64
            runner: macos-14
            rust-target: x86_64-apple-darwin
            tauri-args: '--target x86_64-apple-darwin'
            artifact-glob: |
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-x86_64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: '--target x86_64-pc-windows-msvc'
            artifact-glob: |
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
          - platform: linux-x86_64
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: '--target x86_64-unknown-linux-gnu'
            artifact-glob: |
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux webview deps
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.rust-target }}
          workspaces: desktop/src-tauri -> target

      - name: Build + bundle signed artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty - the updater won't validate. Paste the contents of src-tauri/.tauri-keys/arc-desktop.key (without a password) into GitHub repo secrets."
            exit 1
          fi
          npx tauri build ${{ matrix.tauri-args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arc-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  publish:
    name: Publish desktop release + updater manifest
    # `require-node-assets` is load-bearing: without it this job creates the
    # GitHub release for the tag even when release.yml failed, producing a
    # desktop-only release whose arc-node URLs 404. Do not remove it to
    # "unblock a release" - a release that needs unblocking this way is the
    # broken one.
    needs: [bundle, require-node-assets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        # Each artifact stays in its own subdir so the Mac arm64 vs x86_64
        # `ARC Node.app.tar.gz` archives (same filename, different bytes)
        # don't clobber each other.
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: arc-desktop-*

      - name: List downloaded bundles
        run: find bundles -type f -exec ls -lh {} \;

      - name: Determine tag + version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Rename per-platform archives so Mac arm64 ≠ x64 collision
        # Mac arm64 and Mac x64 both produce identically-named
        # `ARC Node.app.tar.gz`. softprops/action-gh-release flattens
        # all uploads into the release and the second one overwrites
        # the first - so users on x86_64 Macs would download the arm64
        # binary (or vice versa). Stamp the basename with the target
        # arch so each shows up as a distinct release asset.
        run: |
          set -euo pipefail
          for src in bundles/arc-desktop-macos-arm64/macos/*.app.tar.gz \
                     bundles/arc-desktop-macos-arm64/macos/*.app.tar.gz.sig; do
            [ -f "$src" ] || continue
            ext="${src##*.}"
            stem="${src%.*}"
            if [ "$ext" = "sig" ]; then
              # *.app.tar.gz.sig → strip .sig, rename, re-add .sig
              base="${stem%.app.tar.gz}"
              mv "$src" "${base}_aarch64.app.tar.gz.sig"
            else
              base="${src%.app.tar.gz}"
              mv "$src" "${base}_aarch64.app.tar.gz"
            fi
          done
          for src in bundles/arc-desktop-macos-x86_64/macos/*.app.tar.gz \
                     bundles/arc-desktop-macos-x86_64/macos/*.app.tar.gz.sig; do
            [ -f "$src" ] || continue
            ext="${src##*.}"
            if [ "$ext" = "sig" ]; then
              stem="${src%.*}"
              base="${stem%.app.tar.gz}"
              mv "$src" "${base}_x64.app.tar.gz.sig"
            else
              base="${src%.app.tar.gz}"
              mv "$src" "${base}_x64.app.tar.gz"
            fi
          done
          find bundles -name '*.app.tar.gz*' | sort

      - name: Build latest.json for the Tauri updater
        # The Tauri updater reads a manifest with per-target (url, signature)
        # pairs. Without a matching entry the platform falls back to
        # "no update available", so we list every target we shipped a bundle
        # for. Missing signature files are a hard error - silently shipping
        # a release without auto-update was the bug we fixed in #29.
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          DATE="${{ steps.tag.outputs.date }}"
          base="https://github.com/FerrumVir/arc-chain/releases/download/$TAG"

          read_sig() {
            local f="$1"
            if [ ! -f "$f" ]; then
              echo "::error::missing signature file: $f"
              exit 1
            fi
            cat "$f"
          }

          # Each artifact lives in its own subdir per platform. Tauri 2's
          # updater consumes:
          #   macOS:   .app.tar.gz + .app.tar.gz.sig
          #   Windows: -setup.exe + -setup.exe.sig (NSIS direct, no zip)
          #   Linux:   .AppImage   + .AppImage.sig
          #
          # LINUX FLAVOUR CAVEAT - the manifest is honest about this, the app
          # still needs to be:
          # The `linux-x86_64` entry below points at the AppImage, because the
          # AppImage is the ONLY Linux flavour Tauri's updater can replace in
          # place (it swaps a single self-contained file). We also ship .deb
          # and .rpm bundles, and those installs are managed by dpkg/rpm - the
          # updater cannot and must not overwrite files owned by the package
          # manager. A .deb/.rpm user therefore reads this same manifest, is
          # told an update exists, and must install the new package by hand.
          # Making the runtime tell them that clearly (rather than attempting
          # an update that cannot work) is the desktop app's job, not this
          # workflow's - the manifest generation here is only responsible for
          # not lying about what it points at.
          mac_arm_archive=$(find bundles/arc-desktop-macos-arm64 -name '*_aarch64.app.tar.gz' -not -name '*.sig' | head -1)
          mac_arm_sig="${mac_arm_archive}.sig"

          mac_x86_archive=$(find bundles/arc-desktop-macos-x86_64 -name '*_x64.app.tar.gz' -not -name '*.sig' | head -1)
          mac_x86_sig="${mac_x86_archive}.sig"

          win_archive=$(find bundles/arc-desktop-windows-x86_64 -name '*-setup.exe' -not -name '*.sig' | head -1)
          win_sig="${win_archive}.sig"

          linux_archive=$(find bundles/arc-desktop-linux-x86_64 -name '*.AppImage' -not -name '*.sig' | head -1)
          linux_sig="${linux_archive}.sig"

          # GitHub replaces spaces in asset filenames with dots on upload -
          # e.g. local `ARC Node_aarch64.app.tar.gz` becomes the asset
          # `ARC.Node_aarch64.app.tar.gz` on the release page. The
          # auto-updater 404s if we publish the original space-bearing URL,
          # so apply the same rename here when building the manifest URLs.
          to_url() {
            echo "$base/$(basename "$1" | tr ' ' '.')"
          }
          mac_arm_url=$(to_url "$mac_arm_archive")
          mac_x86_url=$(to_url "$mac_x86_archive")
          win_url=$(to_url "$win_archive")
          linux_url=$(to_url "$linux_archive")

          MAC_ARM_SIG=$(read_sig "$mac_arm_sig")
          MAC_X86_SIG=$(read_sig "$mac_x86_sig")
          WIN_SIG=$(read_sig "$win_sig")
          LINUX_SIG=$(read_sig "$linux_sig")

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "ARC Node $TAG. Linux: automatic in-place update applies to the AppImage build only - .deb and .rpm installs are managed by your package manager and must be updated by installing the new package.",
            "pub_date": "$DATE",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$MAC_ARM_SIG",
                "url": "$mac_arm_url"
              },
              "darwin-x86_64": {
                "signature": "$MAC_X86_SIG",
                "url": "$mac_x86_url"
              },
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$win_url"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$linux_url"
              }
            }
          }
          EOF
          cat latest.json

      - name: Attach bundles + manifest to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            bundles/**/*
            latest.json
          generate_release_notes: false
          fail_on_unmatched_files: false
