name: Release desktop app

# Fires on the same tags the arc-node release workflow watches. Publishes
# signed ARC Node bundles for macOS (Apple Silicon + Intel), Windows
# (x86_64 NSIS installer), and Linux (x86_64 AppImage), plus the
# `latest.json` manifest the Tauri updater consumes.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.5.4)'
        required: true
        default: 'v0.5.4'

jobs:
  bundle:
    name: Bundle ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: '--target aarch64-apple-darwin'
            artifact-glob: |
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-x86_64
            runner: macos-13
            rust-target: x86_64-apple-darwin
            tauri-args: '--target x86_64-apple-darwin'
            artifact-glob: |
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-x86_64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: '--target x86_64-pc-windows-msvc'
            artifact-glob: |
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.nsis.zip.sig
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi.sig
          - platform: linux-x86_64
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: '--target x86_64-unknown-linux-gnu'
            artifact-glob: |
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux webview deps
        if: matrix.platform == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install JS deps
        run: npm ci

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ matrix.rust-target }}
          workspaces: desktop/src-tauri -> target

      - name: Build + bundle signed artifacts
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty — the updater won't validate. Paste the contents of src-tauri/.tauri-keys/arc-desktop.key (without a password) into GitHub repo secrets."
            exit 1
          fi
          npx tauri build ${{ matrix.tauri-args }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arc-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error

  publish:
    name: Publish desktop release + updater manifest
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all bundles
        uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: arc-desktop-*
          merge-multiple: true

      - name: List downloaded bundles
        run: find bundles -type f -exec ls -lh {} \;

      - name: Determine tag + version
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build latest.json for the Tauri updater
        # The Tauri updater reads a manifest with per-target (url, signature)
        # pairs. Without a matching entry the platform falls back to
        # "no update available", so we list every target we shipped a bundle
        # for. Missing signature files are a hard error — silently shipping
        # a release without auto-update was the bug we fixed in #29.
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          DATE="${{ steps.tag.outputs.date }}"
          base="https://github.com/FerrumVir/arc-chain/releases/download/$TAG"

          read_sig() {
            local f="$1"
            if [ ! -f "$f" ]; then
              echo "::error::missing signature file: $f"
              exit 1
            fi
            cat "$f"
          }

          # macOS arm64
          mac_arm_archive=$(find bundles -name '*aarch64*.app.tar.gz' -not -name '*.sig' | head -1)
          if [ -z "$mac_arm_archive" ]; then
            mac_arm_archive=$(find bundles -name '*.app.tar.gz' -not -name '*.sig' -path '*arm64*' | head -1)
          fi
          mac_arm_sig="${mac_arm_archive}.sig"

          # macOS x86_64
          mac_x86_archive=$(find bundles -name '*x64*.app.tar.gz' -not -name '*.sig' | head -1)
          if [ -z "$mac_x86_archive" ]; then
            mac_x86_archive=$(find bundles -name '*.app.tar.gz' -not -name '*.sig' -path '*x86_64*' | head -1)
          fi
          mac_x86_sig="${mac_x86_archive}.sig"

          # Windows x86_64 — Tauri NSIS produces .nsis.zip + .sig for updater
          win_archive=$(find bundles -name '*.nsis.zip' -not -name '*.sig' | head -1)
          win_sig="${win_archive}.sig"

          # Linux x86_64
          linux_archive=$(find bundles -name '*.AppImage.tar.gz' -not -name '*.sig' | head -1)
          linux_sig="${linux_archive}.sig"

          mac_arm_url="$base/$(basename "$mac_arm_archive")"
          mac_x86_url="$base/$(basename "$mac_x86_archive")"
          win_url="$base/$(basename "$win_archive")"
          linux_url="$base/$(basename "$linux_archive")"

          MAC_ARM_SIG=$(read_sig "$mac_arm_sig")
          MAC_X86_SIG=$(read_sig "$mac_x86_sig")
          WIN_SIG=$(read_sig "$win_sig")
          LINUX_SIG=$(read_sig "$linux_sig")

          cat > latest.json <<EOF
          {
            "version": "$VERSION",
            "notes": "ARC Node $TAG",
            "pub_date": "$DATE",
            "platforms": {
              "darwin-aarch64": {
                "signature": "$MAC_ARM_SIG",
                "url": "$mac_arm_url"
              },
              "darwin-x86_64": {
                "signature": "$MAC_X86_SIG",
                "url": "$mac_x86_url"
              },
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$win_url"
              },
              "linux-x86_64": {
                "signature": "$LINUX_SIG",
                "url": "$linux_url"
              }
            }
          }
          EOF
          cat latest.json

      - name: Attach bundles + manifest to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          files: |
            bundles/**/*
            latest.json
          generate_release_notes: false
          fail_on_unmatched_files: false
