name: Recheck recorded shard scaling evidence

on:
  push:
    branches: [fix/scaling-evidence-bounds-20261127]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shard-scaling-evidence-45950375807-1
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test evidence bounds before reanalysis
        run: |
          PYTHONPATH=scripts/qualification:scripts/qualification/tests python3 -m unittest discover -s scripts/qualification/scaling_tests -p 'test*.py' -q
          python3 scripts/ci/no_comments.py scripts/qualification/scaling_aggregate.py scripts/qualification/scaling_tests/test_scaling_evidence.py .github/workflows/community-shard-scaling-evidence.yml
      - name: Recompute original measurements and verify twelve clean workers
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ runner.temp }}/summary
          ARTIFACTS_DIR: ${{ runner.temp }}/downloaded-evidence
        run: |
          python3 scripts/qualification/scaling_aggregate.py \
            --workflow-run-id 45950375807 --workflow-run-attempt 1 \
            --candidate-run-id 45939239835 --candidate-run-attempt 1 \
            --candidate-sha a9972ccb31fd57b65a8d8347a69e4792b8c20c22 \
            --output-dir "$OUT_DIR" --artifacts-dir "$ARTIFACTS_DIR"
      - name: Verify compact public evidence
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ runner.temp }}/summary
        run: python3 scripts/qualification/community_shard_six_machine.py verify-public-evidence --evidence-dir "$OUT_DIR"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: qual-summary-r45950375807-a1-rechecked-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/summary
          retention-days: 30
          if-no-files-found: error
