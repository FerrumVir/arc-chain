name: Deploy ARC public console

on:
  push:
    branches: [main]
    paths:
      - 'dashboard/**'
      - 'explorer/**'
      - 'shared/frontend/**'
      - 'scripts/build-public-site.sh'
      - '.github/workflows/deploy-explorer.yml'
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Verify and assemble public console
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Verify dashboard and explorer contracts
        run: |
          set -Eeuo pipefail
          npm --prefix dashboard ci
          npm --prefix dashboard test
          node shared/frontend/test-arc-network.mjs
          node explorer/test-contract.mjs

      - name: Assemble one immutable site artifact
        env:
          ARC_PUBLIC_SITE_SHA: ${{ github.sha }}
        run: ./scripts/build-public-site.sh public-site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public-site
          retention-days: 7

  deploy:
    name: Publish GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
