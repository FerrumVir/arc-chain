name: Linux community worker verification

# Dispatch only after v0.8.6 publication. The exact release binding and asset
# checks reuse the existing read-only post-release acceptance verifier.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact published release tag
        required: true
        default: v0.8.6
        type: string
      release_source_sha:
        description: Full protected-main commit published as the selected tag
        required: true
        type: string
      release_run_id:
        description: Successful Release ARC workflow run ID
        required: true
        type: string
      release_run_attempt:
        description: Successful Release ARC workflow attempt
        required: true
        type: string
      max_runtime_minutes:
        description: Maximum worker keepalive window (15–90 minutes)
        required: true
        default: "80"
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: linux-community-worker-${{ inputs.tag }}-${{ inputs.release_run_id }}-${{ inputs.release_run_attempt }}
  cancel-in-progress: false

jobs:
  worker:
    name: Verified Linux x86_64 community worker
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: select
        name: Capture exact release attempt and publication evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: ${{ inputs.release_source_sha }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
        run: |
          set -Eeuo pipefail
          [[ "$GITHUB_REF" == refs/heads/main ]]
          [[ "$RELEASE_TAG" == v0.8.6 ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          evidence="$RUNNER_TEMP/linux-worker-api"
          mkdir -m 0700 "$evidence" evidence
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" > "$evidence/workflow.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/attempts/$RELEASE_RUN_ATTEMPT" > "$evidence/run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/attempts/$RELEASE_RUN_ATTEMPT/jobs?per_page=100" > "$evidence/jobs.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$evidence/tag-ref.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$evidence/release.json"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.7.7" > "$evidence/legacy-tag-ref.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.7.7" > "$evidence/legacy-release.json"
          release_id="$(jq -er '.id | select(type == "number" and . > 0)' "$evidence/release.json")"
          gh api --paginate --jq '.artifacts[]' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID/artifacts?per_page=100" \
            | jq -s '{artifacts: .}' > "$evidence/artifacts.json"
          python3 scripts/release/published-artifact-acceptance.py select-published-evidence \
            --commit "$RELEASE_COMMIT" --release-run-id "$RELEASE_RUN_ID" \
            --release-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --release-json "$evidence/release.json" --artifacts-json "$evidence/artifacts.json" \
            --output "$evidence/published-evidence-artifact-api.json"
          artifact_id="$(jq -er '.id' "$evidence/published-evidence-artifact-api.json")"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]]
          {
            echo "artifact_id=$artifact_id"
            echo "release_id=$release_id"
          } >> "$GITHUB_OUTPUT"

      - name: Download exact publication evidence by immutable artifact ID
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ steps.select.outputs.artifact_id }}
          path: release-published-download
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.release_run_id }}
          skip-decompress: true
          digest-mismatch: error

      - name: Seal exact release, run, signature, and asset binding
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_source_sha }}
          RELEASE_RUN_ATTEMPT: ${{ inputs.release_run_attempt }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -Eeuo pipefail
          evidence="$RUNNER_TEMP/linux-worker-api"
          python3 scripts/release/published-artifact-acceptance.py bind \
            --repository "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" --release-run-id "$RELEASE_RUN_ID" \
            --release-run-attempt "$RELEASE_RUN_ATTEMPT" \
            --workflow-json "$evidence/workflow.json" --run-json "$evidence/run.json" \
            --jobs-json "$evidence/jobs.json" --tag-ref-json "$evidence/tag-ref.json" \
            --release-json "$evidence/release.json" \
            --published-evidence-artifact-json "$evidence/published-evidence-artifact-api.json" \
            --published-evidence-download-root release-published-download \
            --legacy-tag-ref-json "$evidence/legacy-tag-ref.json" \
            --legacy-release-json "$evidence/legacy-release.json" \
            --jobs-output release-attempt-jobs.json \
            --published-evidence-output release-published.json \
            --published-evidence-zip-output published-evidence.zip \
            --published-evidence-artifact-output published-evidence-artifact.json \
            --output release-binding.json
          chmod 0400 release-binding.json release-attempt-jobs.json release-published.json \
            published-evidence.zip published-evidence-artifact.json
          cp "$evidence"/{workflow.json,run.json,jobs.json,tag-ref.json,release.json,legacy-tag-ref.json,legacy-release.json,published-evidence-artifact-api.json} evidence/
          cp release-binding.json evidence/release-binding.json

      - name: Download exact Linux assets by bound immutable asset ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -m 0700 published
          for name in arc-node-linux-x86_64 arc-cli-linux-x86_64; do
            id="$(jq -er --arg name "$name" '.assets[$name].id | select(type == "number" and . > 0)' release-binding.json)"
            gh api -H 'Accept: application/octet-stream' \
              "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "published/$name"
          done
          python3 scripts/release/published-artifact-acceptance.py verify-files \
            --binding release-binding.json --directory published \
            --asset arc-node-linux-x86_64 --asset arc-cli-linux-x86_64 \
            --output evidence/published-files.json
          chmod 0500 published/arc-node-linux-x86_64 published/arc-cli-linux-x86_64
          chmod 0400 evidence/published-files.json
          jq '.assets' evidence/published-files.json > evidence/linux-assets.json

      - name: Start worker only after host and asset gates pass
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_source_sha }}
          MAX_RUNTIME: ${{ inputs.max_runtime_minutes }}
        run: |
          set -Eeuo pipefail
          python3 scripts/release/linux-community-worker.py run \
            --commit "$RELEASE_COMMIT" --binding release-binding.json \
            --binary published/arc-node-linux-x86_64 \
            --cli published/arc-cli-linux-x86_64 \
            --work-root "$RUNNER_TEMP" --evidence "$GITHUB_WORKSPACE/evidence" \
            --max-runtime-minutes "$MAX_RUNTIME"

      - name: Preserve bounded worker evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-linux-community-worker-${{ inputs.release_run_id }}-attempt-${{ inputs.release_run_attempt }}-${{ github.run_id }}
          path: |
            evidence/**
            release-binding.json
            release-attempt-jobs.json
            release-published.json
            published-evidence.zip
            published-evidence-artifact.json
          if-no-files-found: warn
          compression-level: 0
          retention-days: 30
