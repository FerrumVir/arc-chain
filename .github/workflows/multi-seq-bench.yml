name: Multi-sequence bench

# CI-runner measurement of aggregate decode throughput when several users'
# sequences share every weight read (examples/multi_seq_bench.rs), on the live
# network model: Llama-2-7B-Chat Q4_K_M, pinned by SHA-256 exactly as #182's
# speculative bench pins it, loaded as the canonical legacy INT8 profile. For
# 1, 2, 4, 8, 16 and 32 concurrent sequences, each with its own prompt and K/V
# cache, every decode step is one forward_rows_multi call carrying the next
# row of every sequence (one forward_one_token call for a single sequence),
# with the scalar kernel and every multi-row kernel the runner's CPU has.
#
# Every run is also an exactness check on the real model: every sequence must
# decode the same tokens and logits (by hash), at every step and with every
# kernel and neighbour count, as when it runs alone through the worker's
# one-row path, or the driver exits non-zero. Timings are CI-runner
# measurements on shared 4-vCPU hosted runners, not production figures.
# Hosted x86-64 hosts vary from run to run (AMD EPYC 7763 with AVX2 only, EPYC
# 9V74 with AVX-512 VNNI, EPYC 9V45 and Intel Xeon Platinum 8573C with both
# VNNI kinds), so x86-64 runs on a Linux and a Windows leg, and every leg
# records its CPU.
#
# Cost control: a leg downloads about 4 GB and an x86-64 leg takes up to an
# hour, so it never runs on a push. It runs when started by hand
# (workflow_dispatch, once this file is on the default branch), or once at the
# moment the `multi-seq-bench` label is added to a pull request that changes
# the multi-sequence path or this bench. One label event is one run;
# measuring again means removing and re-adding the label. The model is never
# uploaded or cached.
on:
  pull_request:
    types: [labeled]
    paths:
      - .github/workflows/multi-seq-bench.yml
      - crates/arc-inference/examples/multi_seq_bench.rs
      - crates/arc-inference/src/cached_integer_model.rs
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The same bytes as arc-node's TESTNET_MODEL_SHA256 and #182's bench.
  MODEL_URL: https://huggingface.co/TheBloke/Llama-2-7B-Chat-GGUF/resolve/191239b3e26b2882fb562ffccdd1cf0f65402adb/llama-2-7b-chat.Q4_K_M.gguf
  MODEL_SHA256: 08a5566d61d7cb6b420c3e4387a39e0078e1f2fe5f055f3a03887385304d4bfa
  MODEL_BYTES: "4081004224"
  MODEL_FILE: .multi-seq-bench/llama-2-7b-chat.Q4_K_M.gguf

jobs:
  bench:
    name: 7B multi-sequence bench (${{ matrix.leg }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'multi-seq-bench'
    # Per leg, so a skipped run (another label added) never takes the slot of
    # a run that is measuring.
    concurrency:
      group: multi-seq-bench-${{ github.event.pull_request.number || github.ref }}-${{ matrix.leg }}
      cancel-in-progress: true
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {leg: linux-x86-64, runner: ubuntu-24.04}
          - {leg: windows-x86-64, runner: windows-latest}
          - {leg: linux-arm64, runner: ubuntu-24.04-arm}
    env:
      LEG: ${{ matrix.leg }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record runner facts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/multi-seq-bench"
          mkdir -p "$out"
          {
            echo "leg: $LEG"
            echo "runner: $RUNNER_OS $RUNNER_ARCH image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            if [ "$RUNNER_OS" = Linux ]; then
              lscpu
              grep -m1 -E '^(flags|Features)' /proc/cpuinfo
              free -b
            else
              powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name,Manufacturer,NumberOfCores,NumberOfLogicalProcessors,MaxClockSpeed; Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory"
            fi
            df -h .
          } 2>&1 | tee "$out/runner.txt"

      - name: Download and verify the pinned model
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$MODEL_FILE")"
          curl --fail --location --silent --show-error --retry 5 --retry-all-errors \
            --retry-max-time 900 --connect-timeout 20 --max-time 1800 \
            --proto '=https' --proto-redir '=https' --tlsv1.2 \
            --output "$MODEL_FILE.partial" "$MODEL_URL"
          mv "$MODEL_FILE.partial" "$MODEL_FILE"
          size="$(wc -c < "$MODEL_FILE" | tr -d ' ')"
          if [ "$size" != "$MODEL_BYTES" ]; then
            echo "::error::$MODEL_FILE is $size bytes, expected $MODEL_BYTES"
            exit 1
          fi
          actual="$(sha256sum "$MODEL_FILE" | cut -d ' ' -f 1)"
          if [ "$actual" != "$MODEL_SHA256" ]; then
            echo "::error::$MODEL_FILE SHA-256 is $actual, expected $MODEL_SHA256"
            exit 1
          fi
          echo "verified $MODEL_FILE: sha256 $actual, $size bytes"

      # Keep this dated toolchain aligned with rust-toolchain.toml.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-03-16

      - name: Build the bench driver (release, Candle GGUF loader)
        run: cargo build --locked --release -p arc-inference --features candle --example multi_seq_bench

      - name: Measure aggregate decode against concurrent sequences
        timeout-minutes: 120
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/multi-seq-bench"
          mkdir -p "$out"
          if [ "$RUNNER_OS" = Linux ]; then
            cpu="$(lscpu | sed -n 's/^Model name: *//p' | head -n 1 || true)"
          else
            cpu="$(powershell -NoProfile -Command "(Get-CimInstance Win32_Processor).Name" | tr -d '\r' | sed 's/ *$//' || true)"
          fi
          status=0
          target/release/examples/multi_seq_bench \
            --model "$GITHUB_WORKSPACE/$MODEL_FILE" \
            --cpu "${cpu:-unknown}" \
            --kernel all \
            --sequences 1,2,4,8,16,32 \
            --prompt 10 \
            --steps 8 \
            --out "$out/result.json" \
            --summary "$out/summary.md" 2>&1 | tee "$out/bench.log" || status=$?
          if [ -f "$out/summary.md" ]; then
            {
              echo "CI-runner measurement, $LEG: ${cpu:-CPU model not reported}, $(nproc) vCPU."
              echo
              cat "$out/summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Record memory after the run
        if: always()
        run: |
          out="$RUNNER_TEMP/multi-seq-bench"
          mkdir -p "$out"
          {
            if [ "$RUNNER_OS" = Linux ]; then
              free -b
              grep -E '^(pswpin|pswpout|pgmajfault) ' /proc/vmstat || true
            else
              powershell -NoProfile -Command "Get-CimInstance Win32_OperatingSystem | Format-List FreePhysicalMemory,TotalVisibleMemorySize"
            fi
          } 2>&1 | tee "$out/runner-after.txt"

      - name: Upload this leg's results (never the model)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: multi-seq-bench-${{ matrix.leg }}
          path: ${{ runner.temp }}/multi-seq-bench/
          if-no-files-found: error
          retention-days: 30
          overwrite: true
