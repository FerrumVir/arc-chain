name: Modern model (SmolLM3-3B)

# Evidence for the additional integer profile arc.hf-llama.i8-dyadic-row.q16.v1
# (docs/protocol/integer-profile-hf-llama-dyadic-v1.md). Nothing here changes
# the network's canonical model or any consensus or native-inference binding.
#
#   unit       clippy, unit tests, the Python reference tests, and a tiny
#              SmolLM3-shaped model converted and run by both the Rust engine
#              and the independent Python executor.
#   matrix     ubuntu x86-64, windows x86-64, macOS arm64, macOS x86-64: the
#              tiny model always; with the `smollm3-proof` label also the real
#              SmolLM3-3B, downloaded from Hugging Face at a pinned revision,
#              converted on the runner, run with the scalar and SIMD kernels.
#   reference  (label) the Python executor prepares its own package from the
#              same BF16 bytes and re-derives every golden logits vector.
#   quality    (label) perplexity on a public-domain text vs the BF16 model.
#   report     one table of package hashes, matrix digests and CI tok/s.
#
# workflow_dispatch only works from the default branch, so the pull request is
# the trigger: paths below, plus the label for the multi-gigabyte jobs.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'crates/arc-inference/**'
      - 'scripts/arc_conformance/modern_reference.py'
      - 'scripts/arc_conformance/tests/test_modern_reference.py'
      - 'scripts/arc_modern/**'
      - 'docs/protocol/integer-profile-hf-llama-dyadic-v1.md'
      - 'docs/protocol/packages/smollm3-3b*'
      - '.github/workflows/modern-model-smollm3.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # Release optimisation without fat LTO: the same kernels, a much shorter
  # build. Integer results cannot depend on optimisation settings.
  CARGO_PROFILE_RELEASE_LTO: 'off'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  SOURCE_MANIFEST: docs/protocol/packages/smollm3-3b.source.json
  PINNED_MANIFEST: docs/protocol/packages/smollm3-3b.integer-package.json
  CASES: scripts/arc_modern/smollm3_cases.json
  PY_NUMPY: numpy==2.5.3
  PY_BLAKE3: blake3==1.0.10

jobs:
  unit:
    name: unit + tiny Rust/Python cross-check
    # Adding an unrelated label must not re-run anything (pattern shared with
    # determinism-proof.yml).
    if: github.event.action != 'labeled' || github.event.label.name == 'smollm3-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-03-16
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: clippy
          save-if: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check "$PY_NUMPY" "$PY_BLAKE3"
      # Same feature set as the shipped node (arc-node enables candle); without
      # it, candle-only helpers in existing code are reported as dead.
      - name: Clippy (arc-inference with candle, all targets, deny warnings)
        run: cargo clippy -p arc-inference --all-targets --features candle --locked -- -D warnings
      - name: Unit tests (modern profile, tables, operators, tokenizer, package)
        run: cargo test -p arc-inference --lib --locked modern -- --nocapture
      - name: Python reference unit tests
        working-directory: scripts
        run: python -m unittest arc_conformance.tests.test_modern_reference -v
      - name: Build arc-modern
        run: cargo build --release --locked -p arc-inference --bin arc-modern
      - name: Tiny model, Rust converter and engine vs the independent Python executor
        shell: bash
        run: |
          set -euo pipefail
          tiny="$RUNNER_TEMP/tiny"
          out="$RUNNER_TEMP/tiny-out"
          mkdir -p "$out"
          python scripts/arc_modern/make_tiny_model.py "$tiny"
          ./target/release/arc-modern convert --source-dir "$tiny" \
            --source-manifest "$tiny/tiny-smollm3.source.json" --out "$out/tiny-rust.arcipkg" \
            --manifest-out "$out/tiny-manifest.json" | tee "$out/convert.json"
          (cd scripts && python -m arc_conformance.modern_reference prepare \
            --source-dir "$tiny" --source-manifest "$tiny/tiny-smollm3.source.json" \
            --out "$out/tiny-python.arcipkg" --json-out "$out/prepare.json")
          rust_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["package"]["sha256"])' "$out/convert.json")"
          py_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$out/prepare.json")"
          echo "Rust package sha256:   $rust_sha"
          echo "Python package sha256: $py_sha"
          test "$rust_sha" = "$py_sha"
          ./target/release/arc-modern verify --package "$out/tiny-rust.arcipkg" --manifest "$out/tiny-manifest.json"
          ./target/release/arc-modern golden --package "$out/tiny-rust.arcipkg" \
            --cases "$tiny/tiny-smollm3.cases.json" --kernel scalar --out "$out/run-scalar.json"
          ./target/release/arc-modern golden --package "$out/tiny-rust.arcipkg" \
            --cases "$tiny/tiny-smollm3.cases.json" --kernel simd --out "$out/run-simd.json"
          (cd scripts && python -m arc_conformance.modern_reference verify-run \
            --package "$out/tiny-python.arcipkg" --run "$out/run-scalar.json" --out "$out/golden-verify.json")
          (cd scripts && python -m arc_conformance.modern_reference generate \
            --package "$out/tiny-python.arcipkg" --cases "$tiny/tiny-smollm3.cases.json" --out "$out/run-python.json")
          python - "$out" <<'PY'
          import json, sys
          from pathlib import Path
          out = Path(sys.argv[1])
          digests = {name: json.loads((out / name).read_text())["matrix_digest"]
                     for name in ("run-scalar.json", "run-simd.json", "run-python.json")}
          print(json.dumps(digests, indent=1))
          assert len(set(digests.values())) == 1, "Rust scalar, Rust SIMD and Python generation differ"
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tiny-unit
          path: |
            ${{ runner.temp }}/tiny-out/*.json
          if-no-files-found: warn

  matrix:
    name: matrix (${{ matrix.os }})
    if: github.event.action != 'labeled' || github.event.label.name == 'smollm3-proof'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # macos-15 is Apple Silicon (NEON dotprod); macos-15-intel, ubuntu and
        # windows are x86-64 (AVX2).
        os: [ubuntu-latest, windows-latest, macos-15, macos-15-intel]
    env:
      PROOF: ${{ contains(github.event.pull_request.labels.*.name, 'smollm3-proof') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install every component rust-toolchain.toml lists up front; letting
      # cargo auto-install them hit a rustup component conflict on runners.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-03-16
          components: clippy, rustfmt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Python dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check "$PY_NUMPY" "$PY_BLAKE3"
      - name: Choose a model directory with room for 9.3 GB
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux)
              # Use whichever of / and /mnt has more free space.
              if [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 / | tail -1)" ]; then
                sudo mkdir -p /mnt/arc-model
                sudo chown "$(id -u):$(id -g)" /mnt/arc-model
                dir=/mnt/arc-model
              else
                dir="$HOME/arc-model"
              fi
              ;;
            # Windows: RUNNER_TEMP is on D:, which has far more room than C:.
            *) dir="$RUNNER_TEMP/arc-model" ;;
          esac
          mkdir -p "$dir" "$RUNNER_TEMP/evidence"
          echo "MODEL_DIR=$dir" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          df -h "$dir" "$RUNNER_TEMP" || true
      - name: Record runner facts (CPU, memory, disk) for the tok/s labels
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "runner: $RUNNER_OS $RUNNER_ARCH image ${ImageOS:-unknown} ${ImageVersion:-unknown}"
            case "$RUNNER_OS" in
              macOS) sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize ;;
              Linux) { lscpu | grep -E 'Model name|^CPU\(s\)|Flags' | cut -c1-400; free -b; } || true ;;
              Windows) powershell -NoProfile -Command "Get-CimInstance Win32_Processor | Format-List Name,NumberOfCores,NumberOfLogicalProcessors; Get-CimInstance Win32_ComputerSystem | Format-List TotalPhysicalMemory" ;;
            esac
          } 2>&1 | tee "$EVIDENCE/runner.txt"
      - name: Build arc-modern
        shell: bash
        run: cargo build --release --locked -p arc-inference --bin arc-modern
      - name: Tiny model on this OS (scalar and SIMD)
        shell: bash
        run: |
          set -euo pipefail
          tiny="$RUNNER_TEMP/tiny"
          python scripts/arc_modern/make_tiny_model.py "$tiny"
          ./target/release/arc-modern convert --source-dir "$tiny" \
            --source-manifest "$tiny/tiny-smollm3.source.json" --out "$tiny/tiny.arcipkg" \
            --manifest-out "$EVIDENCE/tiny-manifest.json"
          for kernel in scalar simd; do
            ./target/release/arc-modern golden --package "$tiny/tiny.arcipkg" \
              --cases "$tiny/tiny-smollm3.cases.json" --kernel "$kernel" --out "$EVIDENCE/tiny-run-$kernel.json"
          done
      - name: Fetch SmolLM3-3B BF16 from Hugging Face (pinned revision, SHA-256 verified)
        if: env.PROOF == 'true'
        shell: bash
        run: python scripts/arc_modern/fetch_source.py --manifest "$SOURCE_MANIFEST" --dir "$MODEL_DIR"
      - name: Convert on this OS
        if: env.PROOF == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./target/release/arc-modern convert --source-dir "$MODEL_DIR" \
            --source-manifest "$SOURCE_MANIFEST" --out "$MODEL_DIR/smollm3-3b.arcipkg" \
            --manifest-out "$EVIDENCE/smollm3-manifest.json" | tee "$EVIDENCE/smollm3-convert.json"
          rm -f "$MODEL_DIR"/model-*.safetensors
          if [ -f "$PINNED_MANIFEST" ]; then
            ./target/release/arc-modern verify --package "$MODEL_DIR/smollm3-3b.arcipkg" \
              --manifest "$PINNED_MANIFEST" | tee "$EVIDENCE/smollm3-verify-pinned.json"
          else
            echo "no pinned package manifest yet; the report job compares every OS" | tee "$EVIDENCE/smollm3-verify-pinned.txt"
          fi
          df -h "$MODEL_DIR" || true
      - name: Golden prompts on this OS (scalar and SIMD kernels)
        if: env.PROOF == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for kernel in scalar simd; do
            ./target/release/arc-modern golden --package "$MODEL_DIR/smollm3-3b.arcipkg" \
              --tokenizer "$MODEL_DIR/tokenizer.json" --cases "$CASES" --kernel "$kernel" \
              --out "$EVIDENCE/smollm3-run-$kernel.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn

  reference:
    name: SmolLM3-3B independent Python reference
    if: >-
      contains(github.event.pull_request.labels.*.name, 'smollm3-proof') &&
      (github.event.action != 'labeled' || github.event.label.name == 'smollm3-proof')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install every component rust-toolchain.toml lists up front; letting
      # cargo auto-install them hit a rustup component conflict on runners.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-03-16
          components: clippy, rustfmt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Python dependencies (reference executor and Hugging Face tokenizer)
        run: |
          python -m pip install --disable-pip-version-check "$PY_NUMPY" "$PY_BLAKE3" \
            'tokenizers==0.22.2' 'transformers==4.57.6' 'jinja2==3.1.6'
      - name: Model directory (the larger of / and /mnt)
        run: |
          set -euo pipefail
          if [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 / | tail -1)" ]; then
            sudo mkdir -p /mnt/arc-model
            sudo chown "$(id -u):$(id -g)" /mnt/arc-model
            dir=/mnt/arc-model
          else
            dir="$HOME/arc-model"
            mkdir -p "$dir"
          fi
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "MODEL_DIR=$dir" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
          df -h /mnt / || true
      - name: Build arc-modern
        run: cargo build --release --locked -p arc-inference --bin arc-modern
      - name: Fetch SmolLM3-3B BF16 (pinned revision, SHA-256 verified)
        run: python scripts/arc_modern/fetch_source.py --manifest "$SOURCE_MANIFEST" --dir "$MODEL_DIR"
      - name: Tokenizer and chat template vs Hugging Face
        run: |
          set -euo pipefail
          python scripts/arc_modern/hf_checks.py corpus --out "$EVIDENCE/tokenizer-corpus.jsonl" \
            scripts/arc_conformance/data/tokenizer_corpus.jsonl scripts/arc_modern/tokenizer_extra.jsonl
          ./target/release/arc-modern tokenize --tokenizer "$MODEL_DIR/tokenizer.json" \
            --input "$EVIDENCE/tokenizer-corpus.jsonl" --out "$EVIDENCE/tokenizer-rust.jsonl"
          python scripts/arc_modern/hf_checks.py compare-tokens --model-dir "$MODEL_DIR" \
            --corpus "$EVIDENCE/tokenizer-corpus.jsonl" --rust "$EVIDENCE/tokenizer-rust.jsonl" \
            --out "$EVIDENCE/tokenizer-check.json"
      - name: Rust converter and independent Python preparer produce the same bytes
        run: |
          set -euo pipefail
          ./target/release/arc-modern convert --source-dir "$MODEL_DIR" \
            --source-manifest "$SOURCE_MANIFEST" --out "$MODEL_DIR/rust.arcipkg" \
            --manifest-out "$EVIDENCE/smollm3-manifest.json" | tee "$EVIDENCE/convert.json"
          (cd scripts && python -m arc_conformance.modern_reference prepare \
            --source-dir "$MODEL_DIR" --source-manifest "../$SOURCE_MANIFEST" \
            --out "$MODEL_DIR/python.arcipkg" --json-out "$EVIDENCE/prepare.json")
          rm -f "$MODEL_DIR"/model-*.safetensors
          rust_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["package"]["sha256"])' "$EVIDENCE/convert.json")"
          py_sha="$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["sha256"])' "$EVIDENCE/prepare.json")"
          echo "Rust package sha256:   $rust_sha"
          echo "Python package sha256: $py_sha"
          test "$rust_sha" = "$py_sha"
          rm -f "$MODEL_DIR/python.arcipkg"
      - name: Rust golden run (scalar)
        run: |
          ./target/release/arc-modern golden --package "$MODEL_DIR/rust.arcipkg" \
            --tokenizer "$MODEL_DIR/tokenizer.json" --cases "$CASES" --kernel scalar \
            --out "$EVIDENCE/reference-rust-run.json"
      - name: Python executor re-derives every logits vector and token
        run: |
          cd scripts
          python -m arc_conformance.modern_reference verify-run --package "$MODEL_DIR/rust.arcipkg" \
            --run "$EVIDENCE/reference-rust-run.json" --out "$EVIDENCE/python-golden.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-reference
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn

  quality:
    name: SmolLM3-3B perplexity vs BF16
    if: >-
      contains(github.event.pull_request.labels.*.name, 'smollm3-proof') &&
      (github.event.action != 'labeled' || github.event.label.name == 'smollm3-proof')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Install every component rust-toolchain.toml lists up front; letting
      # cargo auto-install them hit a rustup component conflict on runners.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-03-16
          components: clippy, rustfmt
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - name: Python dependencies (CPU torch and transformers for the BF16 reference)
        run: |
          python -m pip install --disable-pip-version-check --index-url https://download.pytorch.org/whl/cpu 'torch==2.9.1'
          python -m pip install --disable-pip-version-check "$PY_NUMPY" 'tokenizers==0.22.2' \
            'transformers==4.57.6' 'safetensors==0.7.0' 'jinja2==3.1.6'
      - name: Model directory (the larger of / and /mnt)
        run: |
          set -euo pipefail
          if [ "$(df --output=avail -B1 /mnt | tail -1)" -gt "$(df --output=avail -B1 / | tail -1)" ]; then
            sudo mkdir -p /mnt/arc-model
            sudo chown "$(id -u):$(id -g)" /mnt/arc-model
            dir=/mnt/arc-model
          else
            dir="$HOME/arc-model"
            mkdir -p "$dir"
          fi
          mkdir -p "$RUNNER_TEMP/evidence"
          echo "MODEL_DIR=$dir" >> "$GITHUB_ENV"
          echo "EVIDENCE=$RUNNER_TEMP/evidence" >> "$GITHUB_ENV"
      - name: Build arc-modern
        run: cargo build --release --locked -p arc-inference --bin arc-modern
      - name: Fetch SmolLM3-3B BF16 (pinned revision, SHA-256 verified)
        run: python scripts/arc_modern/fetch_source.py --manifest "$SOURCE_MANIFEST" --dir "$MODEL_DIR"
      - name: Tokenise the public-domain text once (shared by both models)
        run: |
          python scripts/arc_modern/hf_checks.py tokenize-text --model-dir "$MODEL_DIR" \
            --text scripts/arc_modern/data/alice_ch1.txt --max-tokens 1024 --out "$EVIDENCE/ppl-tokens.json"
      - name: Integer engine perplexity, then the BF16 reference (transformers, CPU)
        run: |
          set -euo pipefail
          ./target/release/arc-modern convert --source-dir "$MODEL_DIR" \
            --source-manifest "$SOURCE_MANIFEST" --out "$MODEL_DIR/smollm3-3b.arcipkg" > "$EVIDENCE/convert.json"
          ./target/release/arc-modern ppl --package "$MODEL_DIR/smollm3-3b.arcipkg" \
            --tokens "$EVIDENCE/ppl-tokens.json" --window 512 --kernel simd --out "$EVIDENCE/ppl-integer.json"
          python scripts/arc_modern/hf_checks.py bf16-ppl --model-dir "$MODEL_DIR" \
            --tokens "$EVIDENCE/ppl-tokens.json" --rust "$EVIDENCE/ppl-integer.json" --window 512 \
            --threads "$(nproc)" --text-label "Alice in Wonderland ch. 1 (public domain), first 1024 tokens" \
            --out "$EVIDENCE/quality.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: evidence-quality
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: warn

  report:
    name: report
    needs: [unit, matrix, reference, quality]
    if: always() && needs.matrix.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/all
      - name: Hash matrix, reference and quality summary
        shell: bash
        run: |
          set -euo pipefail
          all="$RUNNER_TEMP/all"
          status=0
          mkdir -p "$RUNNER_TEMP/tiny-runs" "$RUNNER_TEMP/smollm3-runs"
          for dir in "$all"/evidence-*; do
            os="$(basename "$dir")"
            for f in "$dir"/tiny-run-*.json; do
              [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/tiny-runs/$os-$(basename "$f")"
            done
            for f in "$dir"/smollm3-run-*.json; do
              [ -f "$f" ] && cp "$f" "$RUNNER_TEMP/smollm3-runs/$os-$(basename "$f")"
            done
          done
          golden_tiny=""
          if [ -f "$all/tiny-unit/run-python.json" ]; then
            golden_tiny="--golden $all/tiny-unit/run-python.json"
          fi
          # shellcheck disable=SC2086
          python scripts/arc_modern/hf_checks.py matrix-report --runs "$RUNNER_TEMP/tiny-runs" \
            $golden_tiny --label "Tiny SmolLM3-shaped model" --out "$RUNNER_TEMP/tiny-report.json" \
            --summary-md "$RUNNER_TEMP/tiny-report.md" || status=1
          cat "$RUNNER_TEMP/tiny-report.md" >> "$GITHUB_STEP_SUMMARY"
          if compgen -G "$RUNNER_TEMP/smollm3-runs/*.json" > /dev/null; then
            golden=""
            if [ -f "$all/evidence-reference/python-golden.json" ]; then
              golden="--golden $all/evidence-reference/python-golden.json"
            fi
            # shellcheck disable=SC2086
            python scripts/arc_modern/hf_checks.py matrix-report --runs "$RUNNER_TEMP/smollm3-runs" \
              $golden --label "SmolLM3-3B (real model)" --out "$RUNNER_TEMP/smollm3-report.json" \
              --summary-md "$RUNNER_TEMP/smollm3-report.md" || status=1
            cat "$RUNNER_TEMP/smollm3-report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$all/evidence-quality/quality.json" ]; then
            python - "$all/evidence-quality/quality.json" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          q = json.load(open(sys.argv[1]))
          print("### Perplexity vs BF16 (CPU, CI runner)")
          print()
          print(f"Text: {q['text']}; window {q['window']}; scored tokens {q['scored_tokens']}.")
          print()
          print(f"| model | perplexity |")
          print(f"|---|---|")
          print(f"| BF16 reference (transformers, torch {q['bf16_reference']['torch']}) | {q['bf16_reference']['ppl']:.4f} |")
          print(f"| ARC integer engine ({q['integer_engine']['profile']}) | {q['integer_engine']['ppl']:.4f} |")
          print()
          print(f"Delta: **{q['ppl_delta_percent']:+.2f}%**; top-1 agreement {100 * q['top1_agreement']:.1f}%.")
          PY
          fi
          exit "$status"
