name: SIMD conformance artifact

on:
  push:
    branches: [arc-simd-conformance-profile-20260928]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simd-conformance-artifact-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CARGO_TARGET_DIR: target-simd-conformance

jobs:
  build-linux-example:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact clean source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain=v1)"

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # pinned nightly
        with:
          toolchain: nightly-2026-03-16

      - name: Test profile selection and build artifact-specific conformance example
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          cargo test --locked --release -p arc-inference --features candle --example canonical_kernel_conformance
          cargo build --locked --release -p arc-inference --features candle --example canonical_kernel_conformance
          binary="$CARGO_TARGET_DIR/release/examples/canonical_kernel_conformance"
          test -x "$binary"
          mkdir -p artifact
          cp "$binary" artifact/canonical_kernel_conformance-linux-x86_64
          sha256sum artifact/canonical_kernel_conformance-linux-x86_64 > artifact/SHA256SUMS
          rustc --version --verbose > artifact/rustc-version.txt
          python3 - "$EXPECTED_SHA" "$binary" artifact/build-receipt.json <<'PY'
          import hashlib, json, pathlib, subprocess, sys
          revision, binary, output = sys.argv[1:]
          root = pathlib.Path.cwd()
          binary_path = pathlib.Path(binary)
          lock = root / "Cargo.lock"
          receipt = {
              "schema": "arc-simd-conformance-build-v1",
              "source_commit": revision,
              "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "cargo_lock_sha256": hashlib.sha256(lock.read_bytes()).hexdigest(),
              "binary_name": "canonical_kernel_conformance-linux-x86_64",
              "binary_sha256": hashlib.sha256(binary_path.read_bytes()).hexdigest(),
              "cargo_command": "cargo build --locked --release -p arc-inference --features candle --example canonical_kernel_conformance",
              "model_executed": False,
          }
          pathlib.Path(output).write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
          print(json.dumps(receipt, sort_keys=True))
          PY

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simd-conformance-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 14
