name: One-shot validator vault rewrap

run-name: Rewrap validator vault at ${{ inputs.expected_main_sha }}

on:
  workflow_dispatch:
    inputs:
      expected_main_sha:
        description: Full protected-main SHA whose reviewed workflow is authorized to handle the vault
        required: true
        type: string
      expected_ciphertext_sha256:
        description: SHA-256 of the retained passphrase-encrypted validator vault
        required: true
        type: string
      expected_restore_cert_sha256:
        description: SHA-256 of the operator-supplied public CMS restore certificate PEM
        required: true
        type: string
      confirmation:
        description: Type REWRAP ARC VALIDATOR VAULT followed by one space and expected_main_sha
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: one-shot-validator-vault-rewrap
  cancel-in-progress: false

jobs:
  authorize:
    name: authorize exact-main vault rewrap
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
      ciphertext_sha256: ${{ steps.authorize.outputs.ciphertext_sha256 }}
      restore_cert_sha256: ${{ steps.authorize.outputs.restore_cert_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - id: authorize
        name: Require exact protected main and typed one-shot authorization
        shell: bash
        env:
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          EXPECTED_MAIN_SHA: ${{ inputs.expected_main_sha }}
          EXPECTED_CIPHERTEXT_SHA256: ${{ inputs.expected_ciphertext_sha256 }}
          EXPECTED_RESTORE_CERT_SHA256: ${{ inputs.expected_restore_cert_sha256 }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = FerrumVir/arc-chain ]
          [ "$DISPATCH_REF" = refs/heads/main ] || {
            echo "::error::Dispatch the one-shot rewrap only from protected main."
            exit 1
          }
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$EXPECTED_MAIN_SHA" = "$DISPATCH_SHA" ] || {
            echo "::error::Typed expected_main_sha does not match the dispatched commit."
            exit 1
          }
          [ "$EXPECTED_CIPHERTEXT_SHA256" = bdb2dd477fe10e06e63123d6080f321fce4a251479a5af8a59ae2b47814ed7e9 ] || {
            echo "::error::Typed source ciphertext SHA-256 is not the retained validator vault."
            exit 1
          }
          [ "$EXPECTED_RESTORE_CERT_SHA256" = 6707f8b1dbc1f2d37d9a873a7e3d2c870d2b46db36f15a6df5293547680bfd43 ] || {
            echo "::error::Typed restore-certificate SHA-256 is not the approved operator certificate."
            exit 1
          }
          [ "$CONFIRMATION" = "REWRAP ARC VALIDATOR VAULT $EXPECTED_MAIN_SHA" ] || {
            echo "::error::Explicit one-shot confirmation phrase does not match the expected main SHA."
            exit 1
          }

          [ "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA" ]
          git fetch --no-tags --force origin main:refs/remotes/origin/main
          [ "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA" ] || {
            echo "::error::Protected main moved before authorization. Dispatch again."
            exit 1
          }
          {
            echo "sha=$EXPECTED_MAIN_SHA"
            echo "ciphertext_sha256=$EXPECTED_CIPHERTEXT_SHA256"
            echo "restore_cert_sha256=$EXPECTED_RESTORE_CERT_SHA256"
          } >> "$GITHUB_OUTPUT"

  rewrap:
    name: rewrap validator vault for operator restore
    needs: authorize
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: read
    steps:
      # This protected job never checks out repository content. A compromised
      # source helper therefore cannot persist and observe the later key window.
      - name: Reconfirm exact protected main before exposing secrets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -Eeuo pipefail
          [ "$GITHUB_REPOSITORY" = FerrumVir/arc-chain ]
          [[ "$EXPECTED_MAIN_SHA" =~ ^[0-9a-f]{40}$ ]]
          remote_main_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [ "$remote_main_sha" = "$EXPECTED_MAIN_SHA" ] || {
            echo "::error::Protected main moved while waiting for release-environment approval."
            exit 1
          }

      - id: rewrap
        name: Inline-decrypt, canonicalize, and public-key rewrap
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ needs.authorize.outputs.sha }}
          EXPECTED_CIPHERTEXT_SHA256: ${{ needs.authorize.outputs.ciphertext_sha256 }}
          EXPECTED_RESTORE_CERT_SHA256: ${{ needs.authorize.outputs.restore_cert_sha256 }}
          ARC_VALIDATOR_VAULT_CIPHERTEXT_B64: ${{ secrets.ARC_VALIDATOR_VAULT_CIPHERTEXT_B64 }}
          ARC_VALIDATOR_VAULT_PASSPHRASE: ${{ secrets.ARC_VALIDATOR_VAULT_PASSPHRASE }}
          ARC_VALIDATOR_VAULT_RESTORE_CERT_B64: ${{ secrets.ARC_VALIDATOR_VAULT_RESTORE_CERT_B64 }}
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/bin:/bin
        run: |
          set +x
          set -Eeuo pipefail
          umask 077
          ulimit -c 0
          export PATH='/usr/bin:/bin'
          unalias -a 2>/dev/null || true
          hash -r
          unset BASH_ENV ENV CDPATH PYTHONHOME PYTHONPATH LD_PRELOAD \
            LD_LIBRARY_PATH DYLD_INSERT_LIBRARIES DYLD_LIBRARY_PATH \
            PERL5OPT PERL5LIB RUBYOPT RUBYLIB NODE_OPTIONS NODE_PATH \
            OPENSSL_CONF OPENSSL_MODULES GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM \
            GIT_CONFIG_NOSYSTEM SSH_AUTH_SOCK SSH_SK_PROVIDER

          [ -n "${ARC_VALIDATOR_VAULT_CIPHERTEXT_B64:-}" ] || {
            echo "::error::ARC_VALIDATOR_VAULT_CIPHERTEXT_B64 is unavailable."
            exit 1
          }
          [ -n "${ARC_VALIDATOR_VAULT_PASSPHRASE:-}" ] || {
            echo "::error::ARC_VALIDATOR_VAULT_PASSPHRASE is unavailable."
            exit 1
          }
          [ -n "${ARC_VALIDATOR_VAULT_RESTORE_CERT_B64:-}" ] || {
            echo "::error::ARC_VALIDATOR_VAULT_RESTORE_CERT_B64 is unavailable."
            exit 1
          }

          input_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/arc-validator-vault-input.XXXXXXXX")"
          work_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/arc-validator-vault-work.XXXXXXXX")"
          output_dir="$(/usr/bin/mktemp -d "$RUNNER_TEMP/arc-validator-vault-output.XXXXXXXX")"
          source_ciphertext="$input_dir/arc-validator-keys-v0.8.0.tar.enc"
          restore_cert="$input_dir/operator-restore.cert.pem"
          cms_output="$output_dir/arc-validator-keys-v0.8.0.tar.cms"
          plain_tar="$work_dir/validator-vault.tar"
          canonical_tar="$work_dir/validator-vault.canonical.tar"
          candidate_cms="$work_dir/validator-vault.tar.cms"
          keep_output=false
          clear_secret_material() {
            unset ARC_VALIDATOR_VAULT_CIPHERTEXT_B64
            unset ARC_VALIDATOR_VAULT_PASSPHRASE
            unset ARC_VALIDATOR_VAULT_RESTORE_CERT_B64
            if [ -d "$input_dir" ] && [ ! -L "$input_dir" ]; then
              /usr/bin/find "$input_dir" -xdev -type f -exec /usr/bin/shred -u -z -n 1 -- {} + \
                >/dev/null 2>&1 || true
              /usr/bin/rmdir "$input_dir" >/dev/null 2>&1 || true
            fi
            if [ -d "$work_dir" ] && [ ! -L "$work_dir" ]; then
              /usr/bin/find "$work_dir" -xdev -type f -exec /usr/bin/shred -u -z -n 1 -- {} + \
                >/dev/null 2>&1 || true
              /usr/bin/rmdir "$work_dir" >/dev/null 2>&1 || true
            fi
          }
          cleanup() {
            local status="$?"
            trap - EXIT
            clear_secret_material
            if [ "$keep_output" != true ] \
              && [ -d "$output_dir" ] && [ ! -L "$output_dir" ]; then
              /usr/bin/find "$output_dir" -xdev -type f -exec /usr/bin/shred -u -z -n 1 -- {} + \
                >/dev/null 2>&1 || true
              /usr/bin/rmdir "$output_dir" >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' HUP INT TERM

          /usr/bin/printf '%s' "$ARC_VALIDATOR_VAULT_CIPHERTEXT_B64" \
            | /usr/bin/base64 --decode > "$source_ciphertext" \
            || { echo "::error::Validator-vault ciphertext secret is not valid base64."; exit 1; }
          /usr/bin/printf '%s' "$ARC_VALIDATOR_VAULT_RESTORE_CERT_B64" \
            | /usr/bin/base64 --decode > "$restore_cert" \
            || { echo "::error::Restore-certificate secret is not valid base64."; exit 1; }
          unset ARC_VALIDATOR_VAULT_CIPHERTEXT_B64
          unset ARC_VALIDATOR_VAULT_RESTORE_CERT_B64
          /usr/bin/chmod 600 "$source_ciphertext" "$restore_cert"
          source_row="$(/usr/bin/sha256sum "$source_ciphertext")"
          cert_row="$(/usr/bin/sha256sum "$restore_cert")"
          [ "${source_row%% *}" = "$EXPECTED_CIPHERTEXT_SHA256" ]
          [ "${cert_row%% *}" = "$EXPECTED_RESTORE_CERT_SHA256" ]
          [ "$(/usr/bin/grep -c '^-----BEGIN CERTIFICATE-----$' "$restore_cert" || true)" -eq 1 ]
          [ "$(/usr/bin/grep -c '^-----END CERTIFICATE-----$' "$restore_cert" || true)" -eq 1 ]
          if /usr/bin/grep -Eq -- '-----BEGIN .*PRIVATE KEY-----' "$restore_cert"; then
            echo "::error::Restore certificate unexpectedly contains private-key material."
            exit 1
          fi

          cert_text="$work_dir/certificate.txt"
          key_usage="$work_dir/key-usage.txt"
          extended_usage="$work_dir/extended-key-usage.txt"
          /usr/bin/openssl x509 -in "$restore_cert" -noout -text > "$cert_text" 2>/dev/null
          /usr/bin/openssl verify -purpose any -CAfile "$restore_cert" "$restore_cert" >/dev/null 2>&1
          /usr/bin/openssl x509 -in "$restore_cert" -checkend 86400 -noout >/dev/null 2>&1
          /usr/bin/grep -Fq 'Public Key Algorithm: rsaEncryption' "$cert_text"
          rsa_bits="$(/usr/bin/sed -n 's/.*Public-Key: (\([0-9][0-9]*\) bit).*/\1/p' "$cert_text")"
          [[ "$rsa_bits" =~ ^[0-9]+$ ]] && [ "$rsa_bits" -ge 3072 ]
          /usr/bin/openssl x509 -in "$restore_cert" -noout -ext keyUsage > "$key_usage" 2>/dev/null
          if [ -s "$key_usage" ] \
            && ! /usr/bin/grep -Eq 'Key Encipherment|Data Encipherment|Key Agreement' "$key_usage"; then
            echo "::error::Restore certificate key usage does not permit encryption."
            exit 1
          fi
          /usr/bin/openssl x509 -in "$restore_cert" -noout -ext extendedKeyUsage > "$extended_usage" 2>/dev/null
          if [ -s "$extended_usage" ] \
            && ! /usr/bin/grep -Eq 'E-mail Protection|Any Extended Key Usage' "$extended_usage"; then
            echo "::error::Restore certificate extended usage does not permit CMS."
            exit 1
          fi

          passphrase="$ARC_VALIDATOR_VAULT_PASSPHRASE"
          unset ARC_VALIDATOR_VAULT_PASSPHRASE
          [ "${#passphrase}" -ge 32 ]
          if ! /usr/bin/printf '%s' "$passphrase" | /usr/bin/openssl enc -d \
            -aes-256-cbc -pbkdf2 -iter 600000 -md sha256 -pass stdin \
            -in "$source_ciphertext" -out "$plain_tar" 2>/dev/null; then
            unset passphrase
            echo "::error::Exact-profile validator-vault decryption failed."
            exit 1
          fi
          unset passphrase
          /usr/bin/chmod 600 "$plain_tar"

          # Isolated stdlib code rewrites only verified, bounded in-memory
          # payload slices. There is no checkout, import path, filesystem
          # extraction, member-name output, or source-generated executable.
          /usr/bin/python3 -I - "$plain_tar" "$canonical_tar" <<'PY'
          import pathlib, stat, sys, tarfile
          import io, os, re, struct
          from pathlib import PurePosixPath

          MAX_SOURCE_BYTES = 1024 * 1024
          MAX_MEMBERS = 64
          MAX_INPUT_MEMBER_BYTES = 128 * 1024
          MAX_INPUT_FILE_BYTES = 512 * 1024
          MAX_KEY_BYTES = 16 * 1024
          MAX_KEY_FILE_BYTES = 96 * 1024
          MAX_PATH_BYTES = 192
          MAX_PATH_DEPTH = 4
          ALLOWED_TIMES = {"mtime", "atime", "ctime", "LIBARCHIVE.creationtime"}
          FORBIDDEN_PAX = {"path", "linkpath", "size"}

          def read_source(path):
              flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
              descriptor = os.open(path, flags)
              try:
                  before = os.fstat(descriptor)
                  if not stat.S_ISREG(before.st_mode) or before.st_nlink != 1 or \
                     before.st_mode & 0o7777 != 0o600 or \
                     not 0 < before.st_size <= MAX_SOURCE_BYTES or before.st_size % 512:
                      raise ValueError("source contract")
                  chunks, remaining = [], before.st_size
                  while remaining:
                      chunk = os.read(descriptor, min(64 * 1024, remaining))
                      if not chunk:
                          raise ValueError("short source read")
                      chunks.append(chunk)
                      remaining -= len(chunk)
                  if os.read(descriptor, 1):
                      raise ValueError("source grew")
                  after = os.fstat(descriptor)
                  identity = lambda value: (
                      value.st_dev, value.st_ino, value.st_mode, value.st_nlink,
                      value.st_size, value.st_mtime_ns, value.st_ctime_ns,
                  )
                  if identity(before) != identity(after):
                      raise ValueError("source changed")
                  return b"".join(chunks)
              finally:
                  os.close(descriptor)

          def safe_path(name):
              encoded = name.encode("utf-8", "strict")
              pure = PurePosixPath(name)
              if not encoded or len(encoded) > MAX_PATH_BYTES or \
                 any(byte < 32 or byte == 127 for byte in encoded) or \
                 pure.is_absolute() or "\\" in name or ":" in name or \
                 any(part in ("", ".", "..") for part in pure.parts) or \
                 len(pure.parts) > MAX_PATH_DEPTH:
                  raise ValueError("unsafe member path")
              return pure.as_posix(), pure.parts

          def safe_pax(headers):
              for key, value in headers.items():
                  if key in FORBIDDEN_PAX or key.startswith("GNU.sparse."):
                      raise ValueError("semantic PAX metadata")
                  if key in ALLOWED_TIMES:
                      if not isinstance(value, str) or len(value) > 32 or \
                         re.fullmatch(r"-?[0-9]+(?:\.[0-9]+)?", value) is None:
                          raise ValueError("invalid PAX timestamp")
                      continue
                  if key.startswith(("LIBARCHIVE.xattr.", "SCHILY.xattr.")):
                      if len(key.encode("utf-8", "strict")) > 512 or \
                         not isinstance(value, str) or \
                         len(value.encode("utf-8", "surrogateescape")) > 16 * 1024:
                          raise ValueError("invalid PAX xattr")
                      continue
                  raise ValueError("unsupported PAX metadata")

          def is_appledouble(payload):
              if len(payload) < 26:
                  return False
              magic, version = struct.unpack(">II", payload[:8])
              count = struct.unpack(">H", payload[24:26])[0]
              table_end = 26 + count * 12
              if magic != 0x00051607 or version != 0x00020000 or \
                 not 0 < count <= 32 or table_end > len(payload):
                  return False
              identifiers, spans = set(), []
              for index in range(count):
                  entry_id, offset, length = struct.unpack(
                      ">III", payload[26 + index * 12:38 + index * 12]
                  )
                  if entry_id == 0 or entry_id in identifiers or \
                     offset < table_end or offset > len(payload) or \
                     length > len(payload) - offset:
                      return False
                  identifiers.add(entry_id)
                  if length:
                      spans.append((offset, offset + length))
              spans.sort()
              return all(left[1] <= right[0] for left, right in zip(spans, spans[1:]))

          def canonicalize(source, target):
              if target == source or target.parent != source.parent:
                  raise ValueError("output contract")
              raw = read_source(source)
              names, folded, records = set(), set(), {}
              total_input = 0
              with tarfile.open(fileobj=io.BytesIO(raw), mode="r:") as archive:
                  if archive.pax_headers:
                      raise ValueError("global PAX metadata")
                  members = archive.getmembers()
                  if not 0 < len(members) <= MAX_MEMBERS:
                      raise ValueError("member count")
                  for member in members:
                      normalized, parts = safe_path(member.name)
                      if normalized in names or normalized.casefold() in folded:
                          raise ValueError("duplicate member path")
                      names.add(normalized)
                      folded.add(normalized.casefold())
                      safe_pax(member.pax_headers)
                      if member.isdir():
                          if member.type != tarfile.DIRTYPE or \
                             member.mode & 0o7777 not in (0o500, 0o700):
                              raise ValueError("non-private directory")
                          records[normalized] = ("directory", parts, b"")
                          continue
                      if member.type not in (tarfile.REGTYPE, tarfile.AREGTYPE) or \
                         not member.isfile() or member.issym() or member.islnk() or member.issparse():
                          raise ValueError("non-regular vault member")
                      apple_metadata_candidate = parts[-1].startswith("._")
                      private_modes = (0o400, 0o500, 0o600, 0o700) \
                          if apple_metadata_candidate else (0o400, 0o600)
                      if not 0 < member.size <= MAX_INPUT_MEMBER_BYTES or \
                         member.mode & 0o7777 not in private_modes:
                          raise ValueError("unbounded or non-private vault member")
                      start, end = member.offset_data, member.offset_data + member.size
                      if not 0 <= start <= end <= len(raw):
                          raise ValueError("member payload bounds")
                      payload = raw[start:end]
                      if len(payload) != member.size:
                          raise ValueError("member payload size")
                      total_input += len(payload)
                      if total_input > MAX_INPUT_FILE_BYTES:
                          raise ValueError("aggregate input size")
                      records[normalized] = ("file", parts, payload)

              regular_names = {name for name, row in records.items() if row[0] == "file"}
              for name, (_, parts, _) in records.items():
                  if any("/".join(parts[:depth]) in regular_names for depth in range(1, len(parts))):
                      raise ValueError("file-directory hierarchy collision")

              keys = []
              key_parent = None
              inventory_parent = None
              inventory_seen = False
              for name, (kind, parts, payload) in records.items():
                  if kind != "file":
                      continue
                  basename = parts[-1]
                  if basename.startswith("._"):
                      base_name = "/".join((*parts[:-1], basename[2:]))
                      base = records.get(base_name)
                      if not basename[2:] or base is None or \
                         base[0] not in ("file", "directory") or \
                         base[1][-1].startswith("._") or not is_appledouble(payload):
                          raise ValueError("invalid AppleDouble metadata")
                      continue
                  if basename == "PUBLIC-INVENTORY.json":
                      if inventory_seen:
                          raise ValueError("duplicate public inventory")
                      inventory_seen = True
                      inventory_parent = parts[:-1]
                      continue
                  if not basename.endswith(".key") or basename == ".key":
                      raise ValueError("unexpected non-key vault member")
                  if key_parent is None:
                      key_parent = parts[:-1]
                  elif key_parent != parts[:-1]:
                      raise ValueError("key parent mismatch")
                  if len(payload) > MAX_KEY_BYTES:
                      raise ValueError("key size")
                  keys.append((name, payload))

              if len(keys) != 6 or sum(len(payload) for _, payload in keys) > MAX_KEY_FILE_BYTES:
                  raise ValueError("key count or aggregate size")
              if inventory_seen and inventory_parent != key_parent:
                  raise ValueError("public inventory parent mismatch")
              output = io.BytesIO()
              with tarfile.open(fileobj=output, mode="w:", format=tarfile.USTAR_FORMAT) as archive:
                  for name, payload in sorted(keys, key=lambda row: row[0].encode("utf-8")):
                      member = tarfile.TarInfo(name)
                      member.type = tarfile.REGTYPE
                      member.mode = 0o600
                      member.uid = member.gid = 0
                      member.uname = member.gname = ""
                      member.mtime = 0
                      member.size = len(payload)
                      member.linkname = ""
                      member.devmajor = member.devminor = 0
                      member.pax_headers = {}
                      archive.addfile(member, io.BytesIO(payload))
              canonical = output.getvalue()
              if not 0 < len(canonical) <= MAX_SOURCE_BYTES or len(canonical) % 512:
                  raise ValueError("canonical tar bounds")
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | \
                      getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
              descriptor = os.open(target, flags, 0o600)
              try:
                  os.fchmod(descriptor, 0o600)
                  view = memoryview(canonical)
                  while view:
                      written = os.write(descriptor, view)
                      if written <= 0:
                          raise ValueError("canonical write")
                      view = view[written:]
                  os.fsync(descriptor)
                  final = os.fstat(descriptor)
                  if not stat.S_ISREG(final.st_mode) or final.st_nlink != 1 or \
                     final.st_mode & 0o7777 != 0o600 or final.st_size != len(canonical):
                      raise ValueError("canonical output contract")
              finally:
                  os.close(descriptor)

          try:
              if len(sys.argv) != 3:
                  raise ValueError("argument contract")
              canonicalize(pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2]))
          except Exception as error:
              raise SystemExit(f"validator vault canonicalization failed: {type(error).__name__}")
          PY

          /usr/bin/openssl cms -encrypt -binary -outform DER -aes-256-gcm \
            -recip "$restore_cert" -keyopt rsa_padding_mode:oaep \
            -keyopt rsa_oaep_md:sha256 -in "$canonical_tar" -out "$candidate_cms" 2>/dev/null
          [ -s "$candidate_cms" ] && [ ! -L "$candidate_cms" ]
          /usr/bin/chmod 600 "$candidate_cms"
          /usr/bin/ln -- "$candidate_cms" "$cms_output"
          /usr/bin/unlink "$candidate_cms"

          # No plaintext, passphrase, source ciphertext, or certificate remains
          # when post-rewrap inspection and network-bound steps begin.
          clear_secret_material
          cms_text="$RUNNER_TEMP/arc-validator-vault-cms-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.txt"
          /usr/bin/openssl cms -cmsout -inform DER -in "$cms_output" -print -noout \
            > "$cms_text" 2>/dev/null
          /usr/bin/grep -Fq 'algorithm: rsaesOaep' "$cms_text"
          /usr/bin/grep -Fq 'algorithm: aes-256-gcm' "$cms_text"
          [ "$(/usr/bin/grep -Fc 'OBJECT            :sha256' "$cms_text")" -ge 2 ]
          /usr/bin/shred -u -- "$cms_text"

          cms_row="$(/usr/bin/sha256sum "$cms_output")"
          cms_sha256="${cms_row%% *}"
          [[ "$cms_sha256" =~ ^[0-9a-f]{64}$ ]]
          /usr/bin/jq -cS -n \
            --arg schema arc.validator-vault-rewrap.v1 \
            --arg source_commit "$EXPECTED_MAIN_SHA" \
            --arg source_ciphertext_sha256 "$EXPECTED_CIPHERTEXT_SHA256" \
            --arg restore_cert_sha256 "$EXPECTED_RESTORE_CERT_SHA256" \
            --arg cms_sha256 "$cms_sha256" \
            --arg key_transport RSA-OAEP-SHA256 \
            --arg content_encryption AES-256-GCM \
            '{
              schema: $schema,
              source_commit: $source_commit,
              source_ciphertext_sha256: $source_ciphertext_sha256,
              restore_cert_sha256: $restore_cert_sha256,
              cms_sha256: $cms_sha256,
              key_transport: $key_transport,
              content_encryption: $content_encryption
            }' > "$output_dir/REWRAP-RECEIPT.json"
          /usr/bin/printf '%s  %s\n' "$cms_sha256" \
            arc-validator-keys-v0.8.0.tar.cms > "$output_dir/SHA256SUMS"
          /usr/bin/chmod 600 "$output_dir/REWRAP-RECEIPT.json" "$output_dir/SHA256SUMS"

          artifact_name="arc-validator-vault-rewrap-$EXPECTED_MAIN_SHA-$EXPECTED_RESTORE_CERT_SHA256-$cms_sha256"
          {
            echo "output_dir=$output_dir"
            echo "artifact_name=$artifact_name"
            echo "cms_sha256=$cms_sha256"
          } >> "$GITHUB_OUTPUT"
          keep_output=true

      - name: Reconfirm protected main after every secret and plaintext is gone
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: ${{ needs.authorize.outputs.sha }}
        run: |
          set -Eeuo pipefail
          remote_main_sha="$(gh api \
            "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          [ "$remote_main_sha" = "$EXPECTED_MAIN_SHA" ] || {
            echo "::error::Protected main moved during rewrap; encrypted output will be discarded."
            exit 1
          }

      - id: upload
        name: Upload one-day encrypted operator restore artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.rewrap.outputs.artifact_name }}
          path: |
            ${{ steps.rewrap.outputs.output_dir }}/arc-validator-keys-v0.8.0.tar.cms
            ${{ steps.rewrap.outputs.output_dir }}/REWRAP-RECEIPT.json
            ${{ steps.rewrap.outputs.output_dir }}/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Record encrypted-artifact receipt
        shell: bash
        env:
          EXPECTED_MAIN_SHA: ${{ needs.authorize.outputs.sha }}
          SOURCE_CIPHERTEXT_SHA256: ${{ needs.authorize.outputs.ciphertext_sha256 }}
          RESTORE_CERT_SHA256: ${{ needs.authorize.outputs.restore_cert_sha256 }}
          CMS_SHA256: ${{ steps.rewrap.outputs.cms_sha256 }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          {
            echo '## One-shot validator vault rewrap'
            echo
            echo "Source commit: \`$EXPECTED_MAIN_SHA\`"
            echo "Source ciphertext SHA-256: \`$SOURCE_CIPHERTEXT_SHA256\`"
            echo "Restore certificate SHA-256: \`$RESTORE_CERT_SHA256\`"
            echo "CMS ciphertext SHA-256: \`$CMS_SHA256\`"
            echo "Actions artifact ID: \`$ARTIFACT_ID\`"
            echo "Actions artifact digest: \`$ARTIFACT_DIGEST\`"
            echo 'Retention: one day. Download into the operator-controlled private-key host before expiry.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner copy of the encrypted restore artifact
        if: always() && steps.rewrap.outputs.output_dir != ''
        shell: bash
        env:
          OUTPUT_DIR: ${{ steps.rewrap.outputs.output_dir }}
        run: |
          set +x
          set -Eeuo pipefail
          case "$OUTPUT_DIR" in
            "$RUNNER_TEMP"/arc-validator-vault-output.*) ;;
            *) echo "::error::Refusing cleanup outside the exact runner-temp output namespace."; exit 1 ;;
          esac
          [ -d "$OUTPUT_DIR" ] && [ ! -L "$OUTPUT_DIR" ]
          find "$OUTPUT_DIR" -xdev -type f -exec shred -u -z -n 1 -- {} +
          rmdir "$OUTPUT_DIR"
