name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: arc-node-linux-x86_64
          # aarch64-unknown-linux-gnu temporarily disabled — OpenSSL cross-compilation issue
          # - target: aarch64-unknown-linux-gnu
          #   os: ubuntu-latest
          #   artifact: arc-node-linux-aarch64
          - target: aarch64-apple-darwin
            os: macos-14
            artifact: arc-node-macos-arm64
          - target: x86_64-apple-darwin
            os: macos-14
            artifact: arc-node-macos-x86_64

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.artifact }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu libssl-dev pkg-config
          # Cross-compile OpenSSL for aarch64 using vendored feature
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV
          # Use vendored OpenSSL for cross-compilation (avoids needing aarch64 libssl-dev)
          echo "OPENSSL_STATIC=1" >> $GITHUB_ENV
          echo "OPENSSL_DIR=/usr" >> $GITHUB_ENV
          # Install aarch64 OpenSSL dev libs
          sudo dpkg --add-architecture arm64 || true
          sudo apt-get install -y libssl-dev:arm64 2>/dev/null || echo "arm64 libssl not available — will use vendored"
          echo "OPENSSL_LIB_DIR=/usr/lib/aarch64-linux-gnu" >> $GITHUB_ENV
          echo "OPENSSL_INCLUDE_DIR=/usr/include" >> $GITHUB_ENV

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      - name: Build arc-node (release)
        run: cargo build --release --target ${{ matrix.target }} --bin arc-node

      - name: Rename binary
        run: |
          SRC=target/${{ matrix.target }}/release/arc-node
          DEST=${{ matrix.artifact }}
          cp "$SRC" "$DEST"
          chmod +x "$DEST"

      - name: Install b3sum
        run: cargo install b3sum --locked

      - name: Compute BLAKE3 hash
        run: |
          b3sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.blake3
          cat ${{ matrix.artifact }}.blake3

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.blake3

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect binaries
        run: |
          mkdir -p release
          for dir in artifacts/*/; do
            cp "$dir"* release/ 2>/dev/null || true
          done
          ls -la release/
          echo ""
          echo "=== BLAKE3 Hashes ==="
          cat release/*.blake3

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/arc-node-linux-x86_64
            release/arc-node-linux-x86_64.blake3
            release/arc-node-linux-aarch64
            release/arc-node-linux-aarch64.blake3
            release/arc-node-macos-arm64
            release/arc-node-macos-arm64.blake3
            release/arc-node-macos-x86_64
            release/arc-node-macos-x86_64.blake3
          body: |
            ## Installation

            **Mac / Linux (one-line install):**
            ```bash
            curl -sSf https://raw.githubusercontent.com/FerrumVir/arc-chain/main/scripts/arc-community.sh | bash
            ```

            **Windows (PowerShell as Administrator):**
            ```powershell
            irm https://raw.githubusercontent.com/FerrumVir/arc-chain/main/scripts/arc-community.ps1 | iex
            ```

            **Or download a binary directly** from the assets below.

            ## Verify (BLAKE3)
            ```bash
            b3sum arc-node-linux-x86_64
            # Compare with arc-node-linux-x86_64.blake3
            ```
