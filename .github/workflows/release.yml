name: Release ARC

# One tag, one workflow, one create-only publisher. v0.7.10 and v0.7.11 were broken by
# two sibling workflows: the desktop workflow created a release with its
# GITHUB_TOKEN, and that event could not trigger the headless workflow. This
# graph builds every supported asset first and invokes one create-only publisher.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing strict tag to release (for example v0.8.0); repository rules must separately protect it from moves
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate release tag and pin commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      date: ${{ steps.release.outputs.date }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false

      - id: release
        name: Match tag, source, and application versions
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -Eeuo pipefail
          TAG="$REQUESTED_TAG"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tags must be strict vMAJOR.MINOR.PATCH values; got '$TAG'."
            exit 1
          fi
          VERSION="${TAG#v}"

          git show-ref --verify --quiet "refs/tags/$TAG" || {
            echo "::error::Tag '$TAG' does not exist. workflow_dispatch never creates or moves tags."
            exit 1
          }
          TAG_COMMIT="$(git rev-list -n 1 "$TAG")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$HEAD_COMMIT" ]; then
            echo "::error::Checkout $HEAD_COMMIT does not match tag $TAG ($TAG_COMMIT)."
            exit 1
          fi

          WORKSPACE_VERSION="$(awk '
            /^\[workspace\.package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && /^version[[:space:]]*=/ {
              gsub(/[[:space:]\"]/], "", $0)
              sub(/^version=/, "", $0)
              print
              exit
            }
          ' Cargo.toml)"
          DESKTOP_VERSION="$(python3 -c 'import json; print(json.load(open("desktop/src-tauri/tauri.conf.json"))["version"])')"
          DESKTOP_NPM_VERSION="$(python3 -c 'import json; print(json.load(open("desktop/package.json"))["version"])')"
          DESKTOP_NPM_LOCK_VERSION="$(python3 -c 'import json; print(json.load(open("desktop/package-lock.json"))["version"])')"
          DESKTOP_NPM_LOCK_ROOT_VERSION="$(python3 -c 'import json; print(json.load(open("desktop/package-lock.json"))["packages"][""]["version"])')"
          DESKTOP_CARGO_VERSION="$(awk '
            /^\[package\]$/ { in_package=1; next }
            /^\[/ { in_package=0 }
            in_package && /^version[[:space:]]*=/ {
              gsub(/[[:space:]\"]/], "", $0)
              sub(/^version=/, "", $0)
              print
              exit
            }
          ' desktop/src-tauri/Cargo.toml)"
          for pair in \
            "workspace:$WORKSPACE_VERSION" \
            "desktop-tauri:$DESKTOP_VERSION" \
            "desktop-npm:$DESKTOP_NPM_VERSION" \
            "desktop-npm-lock:$DESKTOP_NPM_LOCK_VERSION" \
            "desktop-npm-lock-root:$DESKTOP_NPM_LOCK_ROOT_VERSION" \
            "desktop-cargo:$DESKTOP_CARGO_VERSION"; do
            component="${pair%%:*}"
            actual="${pair#*:}"
            if [ "$actual" != "$VERSION" ]; then
              echo "::error::$component version is $actual but tag is $TAG. Align versions before tagging."
              exit 1
            fi
          done

          {
            echo "tag=$TAG"
            echo "version=$VERSION"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "sha=$TAG_COMMIT"
          } >> "$GITHUB_OUTPUT"

  # A tag is independently releasable only if its validated commit passes
  # the aggregate quality harness. Do not rely on a prior branch CI run: a tag
  # or workflow_dispatch can otherwise publish a commit whose required gates
  # were never executed. This intentionally duplicates build work in exchange
  # for making the publish authorization self-contained.
  release-quality:
    name: Full quality gate on validated release commit
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
            sdk/typescript/package-lock.json
            sdks/typescript/package-lock.json

      # The workspace is pinned to nightly; the out-of-workspace Tauri crate
      # is deliberately tested on stable by scripts/ci_check.sh.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-03-16
          components: clippy,rustfmt

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-quality
          workspaces: |
            . -> target
            desktop/src-tauri -> desktop/src-tauri/target

      - name: Audit every JavaScript lockfile used by release builds
        shell: bash
        run: |
          set -Eeuo pipefail
          for package in dashboard desktop sdk/typescript sdks/typescript; do
            npm --prefix "$package" audit --package-lock-only --audit-level=low
          done

      - name: Install pinned Actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -Eeuo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            > "$archive"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          printf '%s\n' "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install Linux desktop and browser prerequisites
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2
          cd desktop
          npm ci
          npx playwright install --with-deps chromium

      - name: Run every blocking local release gate
        run: ./scripts/ci_check.sh --full

  # Release publication fails closed on the reviewed Cargo.lock and deny.toml.
  # Branch CI audits these same three Rust graphs; this gate repeats the policy
  # on the validated tag commit so publication never relies on an earlier run.
  release-supply-chain:
    name: Cargo dependency policy (${{ matrix.graph }})
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - graph: workspace
            manifest: Cargo.toml
          - graph: desktop
            manifest: desktop/src-tauri/Cargo.toml
          - graph: updater-verifier
            manifest: tests/release/tauri-updater-verifier/Cargo.toml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - name: Enforce advisory, license, source, and dependency policy
        run: bash scripts/ci/run-cargo-deny.sh "${{ matrix.manifest }}"

  # The release graph repeats the inference known-answer vectors on every
  # supported CPU/OS architecture. A green Linux x86_64 quality run alone does
  # not prove that integer promotion, threading, or shard assembly agrees on
  # ARM, Intel macOS, or Windows.
  cross-arch-golden-vectors:
    name: Golden vectors (${{ matrix.platform }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
          - platform: macos-arm64
            runner: macos-14
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-03-16

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-golden-${{ matrix.platform }}

      - name: Run blocking inference known-answer vectors
        run: cargo test -p arc-inference --lib --locked golden -- --nocapture

  headless:
    name: Headless ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node-binary: arc-node
            cli-binary: arc
            extension: ''
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            node-binary: arc-node
            cli-binary: arc
            extension: ''
          - platform: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            node-binary: arc-node
            cli-binary: arc
            extension: ''
          - platform: macos-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            node-binary: arc-node
            cli-binary: arc
            extension: ''
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            node-binary: arc-node.exe
            cli-binary: arc.exe
            extension: .exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: nightly-2026-03-16
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-headless-${{ matrix.target }}
          workspaces: . -> target

      - name: Build locked node and CLI
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --release --locked -p arc-node --features candle --target "${{ matrix.target }}"
          cargo build --release --locked -p arc-cli --target "${{ matrix.target }}"

      - name: Name and smoke-test release binaries
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -Eeuo pipefail
          NODE_ASSET="arc-node-${{ matrix.platform }}${{ matrix.extension }}"
          CLI_ASSET="arc-cli-${{ matrix.platform }}${{ matrix.extension }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.node-binary }}" "$NODE_ASSET"
          cp "target/${{ matrix.target }}/release/${{ matrix.cli-binary }}" "$CLI_ASSET"
          chmod +x "$NODE_ASSET" "$CLI_ASSET"
          "./$NODE_ASSET" --version | grep -F " $VERSION"
          "./$CLI_ASSET" --version | grep -F " $VERSION"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: headless-${{ matrix.platform }}
          path: |
            arc-node-${{ matrix.platform }}${{ matrix.extension }}
            arc-cli-${{ matrix.platform }}${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 2

  linux-server-compat:
    name: Ubuntu 24/26 smoke (${{ matrix.platform }})
    needs: [validate, headless]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: headless-${{ matrix.platform }}
          path: release-smoke

      - name: Execute both binaries without a display on supported Ubuntu servers
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -Eeuo pipefail
          chmod +x release-smoke/arc-node-${{ matrix.platform }} release-smoke/arc-cli-${{ matrix.platform }}
          for ubuntu in 24.04 26.04; do
            docker pull "ubuntu:$ubuntu"
            for binary in arc-node-${{ matrix.platform }} arc-cli-${{ matrix.platform }}; do
              docker run --rm \
                --env DISPLAY= \
                --volume "$PWD/release-smoke:/release:ro" \
                "ubuntu:$ubuntu" "/release/$binary" --version \
                | grep -F " $VERSION"
            done

            # Boot the real headless node, not just clap's `--version` path.
            # The shipped incomplete genesis deliberately enters the
            # stake-zero migration-observer mode, so this exercises config,
            # data-dir creation and Axum health serving without joining or
            # mutating any network. Bash `/dev/tcp` avoids installing curl in
            # the otherwise-clean server image.
            docker run --rm \
              --env DISPLAY= \
              --volume "$PWD/release-smoke:/release:ro" \
              --volume "$PWD/genesis.toml:/config/genesis.toml:ro" \
              "ubuntu:$ubuntu" bash -ceu '
                log=/tmp/arc-node-smoke.log
                /release/arc-node-${{ matrix.platform }} \
                  --rpc 127.0.0.1:19944 \
                  --p2p-port 19945 \
                  --eth-rpc-port 0 \
                  --data-dir /tmp/arc-data \
                  --genesis /config/genesis.toml \
                  --no-community >"$log" 2>&1 &
                node_pid=$!
                trap '\''kill "$node_pid" 2>/dev/null || true; wait "$node_pid" 2>/dev/null || true'\'' EXIT
                for _ in $(seq 1 40); do
                  if ! kill -0 "$node_pid" 2>/dev/null; then
                    cat "$log"
                    exit 1
                  fi
                  if response=$(timeout 2 bash -ceu '\''
                    exec 3<>/dev/tcp/127.0.0.1/19944
                    printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3
                    cat <&3
                  '\'' 2>/dev/null) && printf "%s" "$response" | grep -q "HTTP/1.1 200"; then
                    # An isolated migration observer has no advancing chain,
                    # so truthful health is normally `degraded`; the smoke
                    # requires a valid liveness classification, not a false
                    # green chain claim.
                    printf "%s\n" "$response" | grep -Eq '"status":"(ok|degraded)"'
                    exit 0
                  fi
                  sleep 0.25
                done
                cat "$log"
                exit 1
              '
          done

  desktop:
    name: Desktop ${{ matrix.platform }}
    # Do not expose the environment-scoped signing key to repository build
    # code until the exact commit has passed every platform-independent
    # quality, dependency-policy, and known-answer gate.
    needs: [validate, release-quality, release-supply-chain, cross-arch-golden-vectors]
    runs-on: ${{ matrix.runner }}
    environment: release
    timeout-minutes: 120
    env:
      # The desktop crate is intentionally built and tested independently of
      # the workspace's pinned nightly toolchain.
      RUSTUP_TOOLCHAIN: stable
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
            rust-target: aarch64-apple-darwin
            tauri-args: --target aarch64-apple-darwin
            artifact-glob: |
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-x86_64
            runner: macos-15-intel
            rust-target: x86_64-apple-darwin
            tauri-args: --target x86_64-apple-darwin
            artifact-glob: |
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              desktop/src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: windows-x86_64
            runner: windows-latest
            rust-target: x86_64-pc-windows-msvc
            tauri-args: --target x86_64-pc-windows-msvc
            artifact-glob: |
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
              desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          - platform: linux-x86_64
            runner: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
            tauri-args: --target x86_64-unknown-linux-gnu
            artifact-glob: |
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
              desktop/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm

    defaults:
      run:
        working-directory: desktop

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'linux-x86_64'
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libfuse2

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - run: npm ci

      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          shared-key: release-desktop-${{ matrix.rust-target }}
          workspaces: desktop/src-tauri -> target

      - name: Build signed updater bundles
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -Eeuo pipefail
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is required. Unsigned updater artifacts are never published."
            exit 1
          fi
          npx tauri build --ci ${{ matrix.tauri-args }} -- --locked

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arc-desktop-${{ matrix.platform }}
          path: ${{ matrix.artifact-glob }}
          if-no-files-found: error
          retention-days: 2

  publish:
    name: Validate and publish complete release
    needs: [validate, release-quality, release-supply-chain, cross-arch-golden-vectors, headless, linux-server-compat, desktop]
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    env:
      # The isolated updater verifier is a stable-toolchain release utility.
      RUSTUP_TOOLCHAIN: stable
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Assemble assets, updater manifest, and checksums
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_DATE: ${{ needs.validate.outputs.date }}
          REPOSITORY: ${{ github.repository }}
        run: ./scripts/release/assemble-release.sh

      - name: Cryptographically verify every updater payload against the embedded key
        run: |
          tests/release/verify_tauri_updater_signatures.sh \
            desktop/src-tauri/tauri.conf.json release-files

      - name: Show final release contract
        run: |
          set -Eeuo pipefail
          ls -lh release-files
          cat release-files/SHA256SUMS

      # This is intentionally the only release-publishing command in the repo.
      # It refuses an existing release, re-resolves the remote tag immediately
      # before creation, and lets `gh release create` stage every asset on a
      # draft before publishing it. Repository tag rules and immutable-release
      # settings remain an owner-controlled prerequisite outside this workflow.
      - name: Re-verify tag and create a new complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          EXPECTED_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_NOTES: |
            ## Headless / server node

            Every supported GUI-free target has a node and CLI binary:

            - Linux x86_64/amd64: `arc-node-linux-x86_64`, `arc-cli-linux-x86_64`
            - Linux ARM64/aarch64: `arc-node-linux-arm64`, `arc-cli-linux-arm64`
            - macOS Apple Silicon: `arc-node-macos-arm64`, `arc-cli-macos-arm64`
            - macOS Intel: `arc-node-macos-x86_64`, `arc-cli-macos-x86_64`
            - Windows x86_64: `arc-node-windows-x86_64.exe`, `arc-cli-windows-x86_64.exe`

            Linux and macOS install without a display using the exact release:

            ```bash
            curl -fsSLO https://github.com/${{ github.repository }}/releases/download/${{ needs.validate.outputs.tag }}/install.sh
            bash install.sh --version ${{ needs.validate.outputs.version }}
            ```

            Windows Server users download the two `.exe` files above manually.

            ## Desktop GUI

            - macOS Apple Silicon: `arc-desktop-macos-arm64.dmg`
            - macOS Intel: `arc-desktop-macos-x86_64.dmg`
            - Windows x86_64: `arc-desktop-windows-x86_64-setup.exe`
            - Linux x86_64: `arc-desktop-linux-x86_64.AppImage`,
              `arc-desktop-linux-x86_64.deb`, `arc-desktop-linux-x86_64.rpm`

            Linux ARM64 is headless-only in this release. Tauri updater payloads
            carry application-update signatures. Enabled background checks read
            the signed manifest after startup and every 24 hours, but never
            download or install without confirmation. In-place updates cover
            macOS, Windows, and AppImage; `.deb` and `.rpm` remain manual package
            upgrades. The macOS and Windows installers are not Apple Developer
            ID/notarized or Windows Authenticode signed, so operating-system
            trust approval may be required.

            The checked-in genesis is a stake-zero migration-observer placeholder:
            it does not activate reward issuance, and work is not guaranteed.
            Once an approved validator genesis activates the policy, stake-zero
            workers are eligible, but only a successful mined `0x25`
            `CommunityInferenceReward` receipt is earned. Projected earnings are
            null with an explicit reason unless policy, receipt-rate, and funded
            treasury evidence are all available.

            Verify any asset with the attached `SHA256SUMS` file.
        run: |
          set -Eeuo pipefail

          LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "$LOCAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Publish checkout $LOCAL_SHA does not match validated commit $EXPECTED_SHA."
            exit 1
          fi

          REMOTE_TAG_ROWS="$(git ls-remote --exit-code --tags origin \
            "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")" || {
            echo "::error::Remote tag $RELEASE_TAG no longer exists."
            exit 1
          }
          REMOTE_SHA="$(printf '%s\n' "$REMOTE_TAG_ROWS" \
            | awk '$2 ~ /\^\{\}$/ { print $1; exit }')"
          if [ -z "$REMOTE_SHA" ]; then
            REMOTE_SHA="$(printf '%s\n' "$REMOTE_TAG_ROWS" \
              | awk -v tag="refs/tags/$RELEASE_TAG" '$2 == tag { print $1; exit }')"
          fi
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::Remote tag $RELEASE_TAG moved to ${REMOTE_SHA:-missing}; validated commit was $EXPECTED_SHA."
            exit 1
          fi

          EXISTING_TAGS="$RUNNER_TEMP/existing-release-tags.txt"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name' > "$EXISTING_TAGS"
          if grep -Fxq "$RELEASE_TAG" "$EXISTING_TAGS"; then
            echo "::error::A GitHub release already exists for $RELEASE_TAG. Releases are create-only; use a new version/tag instead of replacing assets."
            exit 1
          fi

          gh release create "$RELEASE_TAG" release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$EXPECTED_SHA" \
            --title "ARC Chain $RELEASE_TAG" \
            --notes "$RELEASE_NOTES" \
            --latest
