[project]
name = "arc-sdk"
version = "0.1.0"
description = "Python SDK for ARC Chain"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "websockets>=13.0", "pynacl>=1.5", "blake3>=1.0"]

[project.optional-dependencies]
dev = [
    "pip-audit==2.10.1; python_version >= '3.10'",
    "ruff==0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
