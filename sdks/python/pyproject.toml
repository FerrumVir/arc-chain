[project]
name = "arc-sdk"
version = "0.1.0"
description = "Python SDK for ARC Chain"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "websockets>=13.0", "pynacl>=1.5", "blake3>=1.0"]

[project.optional-dependencies]
dev = [
    "pip-audit==2.10.1; python_version >= '3.10'",
    "ruff==0.16.5",
]

[build-system]
# PEP 517 installs these in an isolated environment before executing the
# backend, so every executable build-time dependency is pinned by exact
# reviewed version rather than resolved from a mutable range.
requires = [
    "hatchling==1.27.0",
    "packaging==24.2",
    "pathspec==1.1.1",
    "pluggy==1.5.0",
    "tomli==2.2.1; python_version < '3.11'",
    "trove-classifiers==2024.10.21.16",
]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
