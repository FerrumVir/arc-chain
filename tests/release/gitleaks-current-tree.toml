title = "ARC current-tree secret scan"
minVersion = "8.30.1"

[extend]
useDefault = true

# No broad source-path allowlist is intentional. Negative security fixtures build
# their marker strings at runtime, so a real credential committed anywhere —
# including tests or release fixtures — still blocks CI.

# The immutable official K2.6 reference contains this documentation import.
# Generic-api-key mistakes the tokenizer/class names for a credential. Both
# path and complete line must match; adjacent or edited lines remain scanned.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Pinned official K2.6 docstring import is not a credential"
condition = "AND"
paths = ['''(^|/)scripts/arc_quality/layer_probe/reference/modeling_deepseek\.py$''']
regexTarget = "line"
regexes = ['''^\s*>>> from transformers import AutoTokenizer, DeepseekV3ForCausalLM\s*$''']
