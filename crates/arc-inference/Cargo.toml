[package]
name = "arc-inference"
description = "ARC Chain on-chain inference - INT4 runtime, VRF committee selection, EIP-1559 inference gas lane"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
int16 = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
# Patent-pending integer/ASIC inference paths (ternary, INT8/INT16-ASIC, mining
# datapath, etc). Source files for these modules are intentionally NOT in the
# public repo until patents are filed; they live in a private branch and on
# the author's local working tree. The default build (and CI release builds)
# stub out the type signatures so the rest of the crate compiles. Enabling
# `experimental-ip` requires the actual implementation files at
# crates/arc-inference/src/ternary_engine.rs and ternary_hybrid.rs.
experimental-ip = []

[dependencies]
arc-crypto = { path = "../arc-crypto" }
arc-types = { path = "../arc-types" }
arc-gpu = { path = "../arc-gpu" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
hex.workspace = true
rayon.workspace = true
libc = "0.2"
# SHA-256 identities of pinned Hugging Face sources and integer packages
# (`modern`). Already in the shipped graph through arc-crypto.
sha2.workspace = true
# The Llama-3/SmolLM3 tokenizer split pattern needs a negative lookahead.
# Already locked through candle-transformers; no new crate enters the graph.
fancy-regex = "0.13"
# Proof Kit submission nonces (OS randomness). Already locked as this
# crate's dev-dependency, so the lock file does not change.
rand.workspace = true

# Optional: real INT4/GGUF inference via Hugging Face candle
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }

# Modern-model CLI (SmolLM3-3B): convert, verify, generate, golden, ppl.
[[bin]]
name = "arc-modern"
path = "src/bin/arc_modern.rs"

# Examples that load GGUF models or run inference benchmarks against candle-
# backed tensors pull in candle-core/candle-nn/candle-transformers. Declare
# required-features so `cargo test --workspace` (default features) skips
# building them. Build any single example with:
#     cargo run --example <name> --features candle --release
#
# Only examples whose source files are actually checked in are listed here -
# adding a [[example]] line for an uncommitted file fails manifest parse on
# CI runners and breaks the release workflow (last seen v0.5.5 / v0.5.6,
# where arc-node-*.exe binaries never made it onto the GitHub release).
[[example]]
name = "bench_int8"
required-features = ["candle"]
[[example]]
name = "validate_canonical_artifact"
required-features = ["candle"]
[[example]]
name = "compare_same_gguf_quality"
required-features = ["candle"]
[[example]]
name = "validate_llama_spm_tokenizer"
required-features = ["candle"]
[[example]]
name = "capture_llama_simple_trace"
required-features = ["candle"]
[[example]]
name = "bench_gpu_forward"
required-features = ["candle"]
[[example]]
name = "bench_q4_gpu"
required-features = ["candle"]
[[example]]
name = "check_weights"
required-features = ["candle"]
[[example]]
name = "cross_platform_7b"
required-features = ["candle"]
[[example]]
name = "debug_7b"
required-features = ["candle"]
[[example]]
name = "debug_forward"
required-features = ["candle"]
[[example]]
name = "debug_generation"
required-features = ["candle"]
[[example]]
name = "eval_perplexity"
required-features = ["candle"]
[[example]]
name = "tensor_parallel_oracle"
required-features = ["candle"]
[[example]]
name = "canonical_kernel_conformance"
required-features = ["candle"]
[[example]]
name = "batched_prefill_experiment"
required-features = ["candle"]
# These five were missing from this list, so `--all-targets` (and plain
# `cargo test -p arc-inference`) tried to build them without the candle
# dependency and failed on unresolved `candle_core`/`candle_transformers`
# imports. They are candle-only probes like the rest of the list.
[[example]]
