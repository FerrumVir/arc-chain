[package]
name = "arc-inference"
description = "ARC Chain on-chain inference - INT4 runtime, VRF committee selection, EIP-1559 inference gas lane"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = []
int16 = []
candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers"]
experimental-ip = []

[dependencies]
arc-crypto = { path = "../arc-crypto" }
arc-types = { path = "../arc-types" }
arc-gpu = { path = "../arc-gpu" }
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
dashmap.workspace = true
hex.workspace = true
rayon.workspace = true
libc = "0.2"
sha2.workspace = true
fancy-regex = "0.13"

candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }

[dev-dependencies]
rand.workspace = true

[[bin]]
name = "arc-modern"
path = "src/bin/arc_modern.rs"

