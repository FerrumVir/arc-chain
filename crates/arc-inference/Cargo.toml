[[example]]
name = "probe_candle_vs_integer"
required-features = ["candle"]
[[example]]
name = "probe_i16_real_weights"
required-features = ["candle"]
[[example]]
name = "profile_int8"
required-features = ["candle"]
[[example]]
name = "test_candle"
required-features = ["candle"]
[[example]]
name = "test_q4_7b"
required-features = ["candle"]
[[example]]
name = "trace_layers"
