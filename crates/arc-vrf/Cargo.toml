[package]
name = "arc-vrf"
description = "RFC 9381 ECVRF (ECVRF-EDWARDS25519-SHA512-TAI) and BLS12-381 proof of possession for validator key registration. Stage 0 library: dormant, not wired into consensus."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# The three cryptographic dependencies are pinned to the exact versions that
# Cargo.lock already carries for the rest of the workspace, so this crate adds
# no new package to the lockfile and a `cargo update` cannot move them without
# an explicit manifest change. README.md ("Dependencies and audits") records
# what is known about each one's audit history.
blst = { version = "=0.3.17", features = ["portable"] }
curve25519-dalek = "=4.1.3"
sha2 = "=0.10.9"
rand_core.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
rand.workspace = true
serde_json.workspace = true

[lints]
workspace = true
