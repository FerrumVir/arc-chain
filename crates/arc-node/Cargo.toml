[package]
name = "arc-node"
description = "ARC Chain node - block production, RPC server, DAG consensus"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "arc-node"
path = "src/main.rs"

# Real Stwo Circle-STARK proofs enabled automatically in production (nightly).
# Dev builds on stable use mock BLAKE3 verifier - proofs are structurally identical.
[features]
default = []
# Integration-only deterministic native executor. Behind a feature so it cannot
# exist in a default build; evidence produced with it is protocol coverage and
# qualifies no model.
native-test-executor = []
benchmark-tools = ["arc-crypto/benchmark-tools", "arc-state/benchmark-tools"]
candle = ["arc-inference/candle"]
stwo-prover = ["arc-crypto/stwo-prover", "arc-state/stwo-prover"]
# Historical public-testnet mutation drivers are inert, but keeping them behind
# an explicit feature prevents default/release builds from treating them as
# supported operational tools.
retired-live-examples = []

[[example]]
name = "diag_model_reg"
required-features = ["retired-live-examples"]

[[example]]
name = "diag_open"
required-features = ["retired-live-examples"]

[[example]]
name = "keepalive"
required-features = ["retired-live-examples"]

[[example]]
name = "live_milestones_cde"
required-features = ["retired-live-examples"]

[[example]]
name = "live_paid_inference"
required-features = ["retired-live-examples"]

[[example]]
name = "manual_release"
required-features = ["retired-live-examples"]

[[example]]
name = "quick_transfer_test"
required-features = ["retired-live-examples"]

[[example]]
name = "v079_signed_inference"
required-features = ["retired-live-examples"]

[dependencies]
arc-assign = { path = "../arc-assign" }
arc-crypto = { path = "../arc-crypto" }
arc-types = { path = "../arc-types" }
arc-state = { path = "../arc-state" }
arc-vm = { path = "../arc-vm" }
arc-mempool = { path = "../arc-mempool" }
arc-gpu = { path = "../arc-gpu" }
arc-consensus = { path = "../arc-consensus" }
arc-inference = { path = "../arc-inference", features = ["candle"] }
arc-net = { path = "../arc-net" }
tokio.workspace = true
axum.workspace = true
tower.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
hex.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
clap.workspace = true
crossbeam.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
k256.workspace = true
sha3.workspace = true
sha2.workspace = true
rayon.workspace = true
lz4_flex.workspace = true
reqwest.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rand = "0.8"

[lints]
workspace = true
