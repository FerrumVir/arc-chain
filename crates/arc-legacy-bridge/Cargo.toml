[package]
name = "arc-legacy-bridge"
description = "One-time launcher that moves a stranded v0.7 ARC install onto a pinned, signature-verified v0.8 stake-zero node"
version = "0.7.15"
edition.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "arc-legacy-bridge"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64 = "0.22"
ed25519-dalek.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ureq = { version = "2.12", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[lints]
workspace = true
