:root{color-scheme:dark;--ground:#002dde;--ground-deep:#0026c4;--well:rgba(0,16,120,.4);--ink:#fff;--ink-soft:rgba(255,255,255,.88);--ink-muted:rgba(255,255,255,.76);--line:rgba(255,255,255,.2);--line-strong:rgba(255,255,255,.44);--good:#8af2cb;--warn:#ffd98c;--bad:#ffb0b0;--info:#b3dcff;--display:"Arc Figures","Marcellus",Georgia,"Times New Roman",serif;--body:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;--hatch:repeating-linear-gradient(90deg,rgba(255,255,255,.8) 0 1px,transparent 1px 3px)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--body);font-variant-numeric:lining-nums tabular-nums;background-color:var(--ground);background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 4px);color:var(--ink);min-height:100vh;line-height:1.5;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
:focus-visible{outline:2px solid #fff;outline-offset:3px}
::selection{background:rgba(255,255,255,.86);color:var(--ground)}
.container{max-width:480px;margin:0 auto;padding:36px 20px 56px}
.masthead{display:flex;flex-direction:column;align-items:center;gap:20px;margin:0 0 18px;text-align:center;font-weight:400}
/* the arc.ai wordmark itself, white, with its tagline; never "arc" typed in a font */
.masthead .brand{display:flex;flex-direction:column;align-items:center;gap:7px}
.masthead .wordmark{display:block;width:calc(30px * 241.87 / 94.04);height:30px;fill:#fff}
.masthead .tagline{font:400 13px/1.3 var(--body);letter-spacing:.01em;color:var(--ink-muted)}
.masthead .title{font:400 46px/1 var(--display)}
.masthead .title::after{content:"";display:block;width:72px;height:6px;margin:16px auto 0;background:var(--hatch)}
.card{background:var(--ground-deep);border:1px solid var(--line);border-radius:6px;padding:22px;margin-bottom:16px;box-shadow:inset 0 0 0 4px var(--ground-deep),inset 0 0 0 5px rgba(255,255,255,.07)}
.card h2{font-size:11px;font-weight:600;color:var(--ink-muted);text-transform:uppercase;letter-spacing:.14em;margin-bottom:14px}
.balance{font:500 40px/1.1 var(--body);letter-spacing:-.02em;color:#fff}
.balance small{font:600 13px var(--body);color:var(--ink-muted);letter-spacing:.1em}
.addr{display:block;width:100%;margin:12px 0 0;padding:0;background:none;border:0;border-radius:2px;text-align:left;font:12px/1.55 var(--mono);color:var(--info);word-break:break-all;cursor:pointer;text-decoration:underline;text-decoration-color:rgba(179,220,255,.4);text-underline-offset:4px}
.addr:hover{background:none;color:#fff;text-decoration-color:#fff}
input,select{width:100%;padding:12px 14px;background:var(--well);border:1px solid var(--line-strong);border-radius:4px;color:#fff;font:14px var(--mono);margin-bottom:10px;outline:none}
input::placeholder{color:rgba(255,255,255,.66)}
input:focus-visible{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.2);outline:none}
button{width:100%;padding:13px;background:#fff;color:var(--ground);border:none;border-radius:4px;font:700 14px var(--body);cursor:pointer;margin-bottom:8px}
button:hover{background:#e3eaff}
button:disabled{background:rgba(255,255,255,.35);color:#001a99;cursor:not-allowed}
button.secondary{background:transparent;border:1px solid rgba(255,255,255,.62);color:#fff;font-weight:600}
button.secondary:hover{border-color:#fff;background:rgba(255,255,255,.1)}
button.quiet{margin-top:8px;font-size:12px}
.status{font-size:13px;line-height:1.5;padding:9px 12px;border-radius:4px;margin-top:8px;border:1px solid;border-left-width:3px;word-break:break-word}
.status.ok{background:rgba(138,242,203,.13);color:#e3fbf2;border-color:rgba(138,242,203,.6)}
.status.err{background:rgba(255,150,150,.15);color:#ffe6e6;border-color:rgba(255,176,176,.6)}
.status.info{background:rgba(179,220,255,.13);color:#eaf5ff;border-color:rgba(179,220,255,.55)}
.tx-list{max-height:220px;overflow-y:auto}
.tx-item{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.12);font-size:13px}
.tx-item .hash{color:var(--info);font-family:var(--mono)}
.tx-item .amount{float:right;font-weight:600;font-family:var(--mono)}
.tx-item .amount.plus{color:var(--good)}
.tx-item .amount.minus{color:var(--bad)}
.tx-time{color:var(--ink-muted)}
.net{margin-bottom:22px;font-size:13px;line-height:1.6;color:var(--ink-soft);text-align:center}
.net .dot{width:8px;height:8px;margin:0 8px 1px 0;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(138,242,203,.14);display:inline-block;vertical-align:middle}
.net .dot.pending{background:rgba(255,255,255,.55);box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.net .dot.off{background:var(--bad);box-shadow:0 0 0 3px rgba(255,150,150,.16)}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tab{flex:1;width:auto;margin:0;padding:11px;text-align:center;background:transparent;border:1px solid var(--line-strong);border-radius:4px;cursor:pointer;font:600 13px var(--body);color:var(--ink-soft)}
.tab:hover{background:rgba(255,255,255,.08);color:#fff}
.tab.active{background:#fff;border-color:#fff;color:var(--ground)}
.note{color:var(--ink-muted);font-size:13px;line-height:1.6;margin-bottom:14px}
.muted{color:var(--ink-muted);font-size:13px}
#app{display:none}
#setup{text-align:center;padding:8px 0 0}
.emblem{display:block;max-width:100%;height:auto;margin:2px auto 16px}
#setup p{color:var(--ink-soft);margin:14px 0 18px;line-height:1.6}
</style>

<div class="net">
  <span class="dot pending" id="netDot"></span>
  <span id="netStatus">Connecting...</span>
</div>

<!-- Setup (no wallet) -->
<div id="setup">
  <div class="card">
    <img class="emblem" src="./tablet.png" width="190" height="92" alt="" aria-hidden="true">
    <h2>Get Started</h2>
    <p>Create a new wallet or import an existing one to start using ARC Chain testnet.</p>
    <button onclick="try{createWallet()}catch(e){alert('Error: '+e.message)}">Create New Wallet</button>
    <button class="secondary" onclick="showImport()">Import Private Key</button>
    <div id="importBox" style="display:none;margin-top:12px">
      <input type="password" id="importKey" placeholder="Paste 64-char hex private key">
      <button onclick="importWallet()">Import</button>
    </div>
  </div>
</div>

<!-- Main app -->
<div id="app">
  <!-- Balance -->
  <div class="card">
    <h2>Balance</h2>
    <div class="balance" id="bal">0 <small>ARC</small></div>
    <div id="balStatus"></div>
    <button type="button" class="addr" id="myAddr" onclick="copyAddr()" title="Click to copy"></button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <button type="button" class="tab active" onclick="switchTab('send',this)">Send</button>
    <button type="button" class="tab" onclick="switchTab('faucet',this)">Faucet</button>
    <button type="button" class="tab" onclick="switchTab('txs',this)">History</button>
  </div>

  <!-- Send -->
  <div id="tab-send" class="card">
    <h2>Send ARC</h2>
    <input id="sendTo" placeholder="Recipient address (64 hex chars)">
    <input id="sendAmt" type="number" placeholder="Amount" min="1">
    <button onclick="sendTx()">Send</button>
    <div id="sendStatus"></div>
  </div>

  <!-- Faucet -->
  <div id="tab-faucet" class="card" style="display:none">
    <h2>Claim Testnet Tokens</h2>
    <p class="note">Get 10,000 free ARC tokens for testing. One claim per hour.</p>
    <button onclick="claimFaucet()">Claim 10,000 ARC</button>
    <div id="faucetStatus"></div>
  </div>

  <!-- History -->
  <div id="tab-txs" class="card" style="display:none">
    <h2>Recent Transactions</h2>
    <div class="tx-list" id="txList"><p class="muted">No transactions yet</p></div>
  </div>

  <button class="secondary quiet" onclick="logout()">Disconnect Wallet</button>
</div>
</div>

<script type="module">
// Real Ed25519 + BLAKE3 keyed hashing matching arc-chain server-side verification:
//   address  = BLAKE3(ed25519_pubkey)
//   tx_hash  = BLAKE3-derive-key("ARC-chain-tx-v1", [tx_type, from, nonce_le, body, fee_le, gas_le])
//   sig      = Ed25519.sign(privKey, tx_hash)
import * as ed     from 'https://esm.sh/@noble/ed25519@2.1.0';
import { sha512 }  from 'https://esm.sh/@noble/hashes@1.4.0/sha512';
import { blake3 }  from 'https://esm.sh/@noble/hashes@1.4.0/blake3';
ed.etc.sha512Sync = (...m) => sha512(ed.etc.concatBytes(...m));

// ── Config ──
const NODES = [
  {name:'LAX', ip:'140.82.16.112'},
  {name:'AMS', ip:'136.244.109.1'},
  {name:'NRT', ip:'202.182.107.41'},
  {name:'NYC', ip:'149.28.32.76'},
  {name:'LHR', ip:'104.238.171.11'},
  {name:'SGP', ip:'149.28.153.31'},
];
let RPC = '';
let wallet = null; // {version, privKey, pubKey, address}

// ── Startup ──
(async function init() {
  for (const n of NODES) {
    try {
      const r = await fetch(`http://${n.ip}:9090/health`, {signal: AbortSignal.timeout(3000)});
      if (r.ok) { RPC = `http://${n.ip}:9090`; break; }
    } catch(e) { /* probing: an unreachable seed is the expected case, try the next */ }
  }
  if (RPC) {
    try {
      const h = await (await fetch(RPC+'/health')).json();
      document.getElementById('netDot').className = 'dot';
      document.getElementById('netStatus').textContent =
        `Connected to ARC Testnet (${h.validators} validators, round ${h.dag_round.toLocaleString()})`;
    } catch (e) {
      // Reachable a moment ago, unreadable now. Say which, rather than
      // leaving the header on "Connecting..." forever.
      document.getElementById('netDot').className = 'dot off';
      document.getElementById('netStatus').textContent =
        `Reached ${RPC} but could not read /health: ${e.message}`;
    }
  } else {
    document.getElementById('netDot').className = 'dot off';
    document.getElementById('netStatus').textContent = 'Testnet unreachable';
  }
  const saved = localStorage.getItem('arc_wallet');
  if (saved) {
    const w = JSON.parse(saved);
    if (w.version === 2 && w.pubKey) {
      wallet = w;
      showApp();
    } else {
      // Legacy wallet (random-bytes "key", sha256 address) couldn't sign. Drop it
      // and start fresh with a real Ed25519 keypair.
      localStorage.removeItem('arc_wallet');
      localStorage.removeItem('arc_txs');
    }
  }
})();

// ── Hex helpers ──
function toHex(bytes){return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join('')}
function fromHex(s){const out=new Uint8Array(s.length/2);for(let i=0;i<out.length;i++)out[i]=parseInt(s.substr(i*2,2),16);return out}
function u64le(n){const b=new Uint8Array(8);new DataView(b.buffer).setBigUint64(0,BigInt(n),true);return b}
function concat(...arrs){let n=0;for(const a of arrs)n+=a.length;const o=new Uint8Array(n);let i=0;for(const a of arrs){o.set(a,i);i+=a.length}return o}

// ── Tx hash (matches arc-types::Transaction::compute_hash) ──
// Transfer body bincode encoding (1.3 default cfg, fixint, varint disabled for primitives):
//   variant_idx (u32 LE = 0)         4 B
//   to (Address = [u8;32])           32 B
//   amount (u64 LE)                  8 B
//   amount_commitment (Option=None)  1 B
function transferBodyBytes(toBytes, amount){
  const buf=new Uint8Array(45);
  // 0..4 = variant index 0 (Transfer)
  buf.set(toBytes,4);
  new DataView(buf.buffer).setBigUint64(36,BigInt(amount),true);
  // 44 = Option None tag (0)
  return buf;
}
function txTransferHash(fromBytes, toBytes, amount, nonce){
  const body = transferBodyBytes(toBytes, amount);
  // BLAKE3 keyed-derive with context "ARC-chain-tx-v1"
  const data = concat(
    new Uint8Array([0x01]),  // TxType::Transfer = 0x01
    fromBytes,                // 32 B
    u64le(nonce),             // 8 B
    body,                     // 45 B
    u64le(0),                 // fee = 0
    u64le(0),                 // gas_limit = 0
  );
  return blake3(data, {context: 'ARC-chain-tx-v1', dkLen: 32});
}

function generateKeypair() {
  const privBytes = ed.utils.randomPrivateKey();
  const pubBytes  = ed.getPublicKey(privBytes);
  const addrBytes = blake3(pubBytes, {dkLen: 32});
  return {version:2, privKey:toHex(privBytes), pubKey:toHex(pubBytes), address:toHex(addrBytes)};
}

function createWallet() {
  wallet = generateKeypair();
  localStorage.setItem('arc_wallet', JSON.stringify(wallet));
  showKeyModal(wallet.privKey, wallet.address);
  showApp();
  claimFaucet().then(() => { setTimeout(refreshBalance, 1000); });
}

function showKeyModal(privKey, address) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,18,110,0.88);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `<div style="background:#0026c4;border:1px solid rgba(255,255,255,.55);border-radius:6px;padding:26px;max-width:440px;width:100%;box-shadow:inset 0 0 0 4px #0026c4,inset 0 0 0 5px rgba(255,255,255,.1),0 24px 60px rgba(0,8,70,.5)">
    <h3 style="color:#ffb0b0;font:400 24px/1.2 Marcellus,Georgia,serif;margin-bottom:10px">Save Your Private Key</h3>
    <p style="color:rgba(255,255,255,.86);font-size:14px;line-height:1.55;margin-bottom:16px">This is shown only once. Copy it now and store it safely.</p>
    <div style="background:rgba(0,16,120,.45);border:1px solid rgba(255,176,176,.6);border-radius:4px;padding:12px 14px;margin-bottom:12px">
      <div style="color:rgba(255,255,255,.8);font-size:11px;letter-spacing:.12em;margin-bottom:6px">PRIVATE KEY (tap to copy)</div>
      <div id="pkDisplay" onclick="navigator.clipboard.writeText('${privKey}');this.style.color='#8af2cb';this.textContent='Copied!';setTimeout(()=>{this.textContent='${privKey}';this.style.color='#ffb0b0'},1500)" style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.55;color:#ffb0b0;word-break:break-all;cursor:pointer;user-select:all">${privKey}</div>
    </div>
    <div style="background:rgba(0,16,120,.45);border:1px solid rgba(255,255,255,.3);border-radius:4px;padding:12px 14px;margin-bottom:18px">
      <div style="color:rgba(255,255,255,.8);font-size:11px;letter-spacing:.12em;margin-bottom:6px">YOUR ADDRESS</div>
      <div style="font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.55;color:#b3dcff;word-break:break-all;user-select:all">${address}</div>
    </div>
    <button onclick="this.parentElement.parentElement.remove()" style="width:100%;padding:13px;background:#fff;color:#002dde;border:none;border-radius:4px;font-size:14px;font-weight:700;cursor:pointer">I've Saved My Key</button>
  </div>`;
  document.body.appendChild(overlay);
}

function showImport() {
  document.getElementById('importBox').style.display = 'block';
}

function importWallet() {
  const key = document.getElementById('importKey').value.trim();
  if (key.length !== 64 || !/^[0-9a-f]+$/i.test(key)) {
    alert('Invalid key - must be 64 hex characters');
    return;
  }
  const privBytes = fromHex(key);
  const pubBytes  = ed.getPublicKey(privBytes);
  const address   = toHex(blake3(pubBytes, {dkLen: 32}));
  wallet = {version:2, privKey: key, pubKey: toHex(pubBytes), address};
  localStorage.setItem('arc_wallet', JSON.stringify(wallet));
  showApp();
}

function showApp() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('myAddr').textContent = wallet.address;
  refreshBalance();
}

function logout() {
  localStorage.removeItem('arc_wallet');
  wallet = null;
  document.getElementById('setup').style.display = 'block';
  document.getElementById('app').style.display = 'none';
}

function copyAddr() {
  navigator.clipboard.writeText(wallet.address);
  document.getElementById('myAddr').textContent = 'Copied!';
  setTimeout(() => document.getElementById('myAddr').textContent = wallet.address, 1500);
}

// ── Balance ──
async function refreshBalance() {
  if (!wallet || !RPC) return;
  const note = document.getElementById('balStatus');
  try {
    const r = await fetch(`${RPC}/account/${wallet.address}`);
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    document.getElementById('bal').innerHTML =
      `${(d.balance||0).toLocaleString()} <small>ARC</small>`;
    note.innerHTML = '';
  } catch(e) {
    document.getElementById('bal').innerHTML = '&mdash; <small>ARC</small>';
    note.innerHTML = `<div class="status err">Balance unavailable: ${e.message}</div>`;
  }
}
setInterval(refreshBalance, 5000);

// ── Send (Ed25519-signed) ──
async function sendTx() {
  const to  = document.getElementById('sendTo').value.trim();
  const amt = parseInt(document.getElementById('sendAmt').value);
  const el  = document.getElementById('sendStatus');
  if (!to || to.length!==64 || !/^[0-9a-f]+$/i.test(to)) {
    el.innerHTML='<div class="status err">Invalid address (need 64 hex chars)</div>'; return;
  }
  if (!amt || amt<=0) { el.innerHTML='<div class="status err">Invalid amount</div>'; return; }
  el.innerHTML='<div class="status info">Signing & submitting...</div>';
  try {
    // Fetch fresh nonce
    const acct = await (await fetch(`${RPC}/account/${wallet.address}`)).json();
    const nonce = acct.nonce || 0;

    const fromBytes = fromHex(wallet.address);
    const toBytes   = fromHex(to);
    const privBytes = fromHex(wallet.privKey);
    const pubBytes  = fromHex(wallet.pubKey);

    const txHash = txTransferHash(fromBytes, toBytes, amt, nonce);
    const sig    = ed.sign(txHash, privBytes);

    const r = await fetch(`${RPC}/tx/submit`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        from: wallet.address,
        to,
        amount: amt,
        nonce,
        signature:  toHex(sig),
        public_key: toHex(pubBytes),
      })
    });
    const d = await r.json();
    if (r.ok && d.tx_hash) {
      el.innerHTML=`<div class="status ok">Sent! TX: ${d.tx_hash.slice(0,16)}...</div>`;
      addTxToHistory({hash:d.tx_hash, to, amount:-amt});
      document.getElementById('sendTo').value='';
      document.getElementById('sendAmt').value='';
      setTimeout(refreshBalance, 2000);
    } else {
      el.innerHTML=`<div class="status err">${d.error||d.message||JSON.stringify(d)}</div>`;
    }
  } catch(e) { el.innerHTML=`<div class="status err">${e.message}</div>`; }
}

// ── Faucet ──
async function claimFaucet() {
  const el = document.getElementById('faucetStatus');
  el.innerHTML='<div class="status info">Claiming...</div>';
  try {
    const r = await fetch(`${RPC}/faucet/claim`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({address:wallet.address})
    });
    const d = await r.json();
    if (r.ok && d.tx_hash) {
      el.innerHTML=`<div class="status ok">Received ${d.amount||10000} ARC!</div>`;
      addTxToHistory({hash:d.tx_hash, from:'faucet', amount:d.amount||10000});
      refreshBalance();
    } else {
      el.innerHTML=`<div class="status err">${d.error||d.message||JSON.stringify(d)}</div>`;
    }
  } catch(e) { el.innerHTML=`<div class="status err">${e.message}</div>`; }
}

// ── Tabs ──
function switchTab(name, el) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  ['send','faucet','txs'].forEach(t=>{
    document.getElementById('tab-'+t).style.display = t===name?'block':'none';
  });
  if (name==='txs') loadHistory();
}

// ── History ──
let txHistory = JSON.parse(localStorage.getItem('arc_txs')||'[]');

function addTxToHistory(tx) {
  tx.time = Date.now();
  txHistory.unshift(tx);
  if (txHistory.length>50) txHistory=txHistory.slice(0,50);
  localStorage.setItem('arc_txs', JSON.stringify(txHistory));
}

function loadHistory() {
  const el = document.getElementById('txList');
  if (!txHistory.length) { el.innerHTML='<p class="muted">No transactions yet</p>'; return; }
  el.innerHTML = txHistory.map(tx=>{
    const isIn = tx.amount > 0;
    const time = new Date(tx.time).toLocaleTimeString();
    return `<div class="tx-item">
      <span class="hash">${(tx.hash||'').slice(0,12)}...</span>
      <span class="amount ${isIn?'plus':'minus'}">${isIn?'+':''}${tx.amount} ARC</span>
      <br><span class="tx-time">${time}</span>
    </div>`;
  }).join('');
}

// Expose handlers for inline onclick="..." attributes (module scope is local).
Object.assign(window, {
  createWallet, importWallet, showImport, sendTx, claimFaucet,
  switchTab, copyAddr, logout, loadHistory,
});
</script>
</body>
