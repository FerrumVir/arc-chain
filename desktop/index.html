<!doctype html>
<html lang="en" data-theme="engraved">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#002dde" />
    <meta name="color-scheme" content="dark" />
    <title>ARC - Node</title>
    <!--
      The launch screen. It is painted by this HTML alone, before any script or
      bundled stylesheet has loaded, so the very first frame is already Arc blue
      (the default "engraved" theme; lib/theme.ts switches the attribute if this
      device chose "classic"). It sits outside #root, so React mounting never
      restarts its animation; lib/boot.ts fades it out once the app knows what
      to show. The CSP allows inline styles but not inline scripts, so nothing
      here runs code.
    -->
    <style>
      html { background: #002dde; }
      html[data-theme="classic"] { background: #060608; }
      .boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #002dde;
        pointer-events: none;
        transition: opacity 320ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      html[data-theme="classic"] .boot { background: #060608; }
      .boot::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.028) 0 1px, transparent 1px 4px);
      }
      .boot--out { opacity: 0; }
      .boot-mark { position: relative; display: grid; justify-items: center; gap: 20px; }
      .boot-arch { width: 148px; height: auto; overflow: visible; }
      .boot-arch .ln {
        fill: none;
        stroke: #fff;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: boot-draw 700ms cubic-bezier(0.65, 0, 0.35, 1) forwards;
      }
      .boot-arch .ln-v { stroke-opacity: 0.7; stroke-width: 1; animation-delay: 260ms; }
      .boot-arch .key {
        fill: #fff;
        opacity: 0;
        transform: translateY(-18px);
        transform-box: fill-box;
        animation: boot-seat 420ms cubic-bezier(0.34, 1.56, 0.64, 1) 640ms forwards;
      }
      .boot-arch .water {
        fill: none;
        stroke: #fff;
        stroke-opacity: 0.6;
        stroke-width: 1;
        stroke-dasharray: 8 12;
        opacity: 0;
        animation: boot-flow 1.4s linear 900ms infinite;
      }
      .boot-word { width: 58px; height: auto; opacity: 0; animation: boot-fade 420ms ease 800ms forwards; }
      .boot-label {
        font: 500 10.5px/1 "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.62);
        opacity: 0;
        animation: boot-fade 420ms ease 1100ms forwards;
      }
      @keyframes boot-draw { to { stroke-dashoffset: 0; } }
      @keyframes boot-seat { to { opacity: 1; transform: none; } }
      @keyframes boot-fade { to { opacity: 1; } }
      @keyframes boot-flow { from { stroke-dashoffset: 20; opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .boot { transition: none; }
        .boot-arch .ln, .boot-arch .key, .boot-arch .water, .boot-word, .boot-label {
          animation: none;
          stroke-dashoffset: 0;
          opacity: 1;
          transform: none;
        }
        .boot-arch .water { opacity: 0.6; }
      }
    </style>
  </head>
  <body>
    <div id="boot" class="boot" role="status" aria-label="Starting Arc">
      <div class="boot-mark">
        <!-- one bay of the aqueduct: it draws itself, the keystone seats, then water runs along the top -->
        <svg class="boot-arch" viewBox="0 0 160 124" aria-hidden="true">
          <path class="water" d="M12 3H148" />
          <path class="ln" pathLength="1" d="M12 118V8H148V118" />
          <path class="ln" pathLength="1" d="M22 118V70A58 58 0 0 1 138 70V118" />
          <path class="ln" pathLength="1" d="M40 118V70A40 40 0 0 1 120 70V118" />
          <path class="ln ln-v" pathLength="1" d="M41.36 59.65L23.98 54.99M45.36 50L29.77 41M51.72 41.72L38.99 28.99M60 35.36L51 19.77M69.65 31.36L64.99 13.98M90.35 31.36L95.01 13.98M100 35.36L109 19.77M108.28 41.72L121.01 28.99M114.64 50L130.23 41M118.64 59.65L136.02 54.99" />
          <path class="ln" pathLength="1" d="M4 118H156" />
          <polygon class="key" points="75.37,32.28 84.63,32.28 87.31,10.45 72.69,10.45" />
        </svg>
        <img class="boot-word" src="/src/assets/brand/arc-logo-white.svg" alt="" />
        <span class="boot-label">Starting</span>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
