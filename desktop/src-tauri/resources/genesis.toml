# ── Genesis Validators (migration required) ────────────────────────────
# Never store signing-key contents or deterministic seeds in genesis.
# Add fresh public ARC addresses here, then set the flag above to true:
#
# [[validators]]
# address = "<64-character public ARC address from arc keygen>"
# stake = 5_000_000
